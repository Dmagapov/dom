/* Layout: one phone-first column; sticky search on top; zones → rooms → boxes; box codes styled as printed label tape */
:root{

.clar{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:16px;margin:6px 0 14px}
.clar-q{font-size:1.25rem;font-weight:700;color:#2242AA;margin-bottom:12px}

header{position:relative}

/* Kitchen map */
.kmap{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:12px;margin:6px 0 14px}

.kmap-svg{display:block;width:760px;height:auto}.kmap.big .kmap-svg{width:1300px}
.kmap-svg .bg{fill:#f3f6fb}.kmap-svg .ttl{font-size:28px;font-weight:700;fill:#2242AA}.kmap-svg .sub{font-size:17px;fill:#66718a}.kmap-svg .floor{fill:#dfe6f1}
.kmap-svg .c{fill:#232b3d;stroke:#141a27;stroke-width:2}.kmap-svg .c.w{fill:#fff;stroke:#c9d3e3}
.kmap-svg .hd{fill:#8a97ad}.kmap-svg .tape{fill:#f3c623;stroke:#111;stroke-width:1.5}
.kmap-svg .tt{font-weight:800;text-anchor:middle;fill:#111;font-family:"JetBrains Mono",monospace}
.kmap-svg .lb{font-size:14px;text-anchor:middle;fill:#c5cee0}.kmap-svg .ks.up .lb{fill:#66718a}
.kmap-svg .ap{fill:#e4e9f1;stroke:#c9d3e3;stroke-width:2}.kmap-svg .al{font-size:16px;font-weight:600;text-anchor:middle;fill:#55617a}
.kmap-svg .sh{fill:#fafbfd;stroke:#e1e7f1}.kmap-svg .wl{fill:#eaf3f1;stroke:#d3e4df}.kmap-svg .tp{fill:#ece6da;stroke:#d6cfc0}
.kmap-svg .ks{cursor:pointer;transition:opacity .2s}.kmap.has-hit .ks:not(.hit):not(.sel){opacity:.5}

s); ajastin — sammuu 15 min kuluttua. Jatkuva punainen valo moottorin ollessa pois päältä — rasvasuodattimet on aika pestä (≈ 30 käyttötunnin välein, astianpesukoneessa ≤55 °C); nollaus — pidä painiketta pohjassa 3 s.", "pic": "man/img/falmec-pic.png"}, {"ru": "Мусорное ведро с датчиком Fromm & Starck STAR_BIN_40", "en": "Fromm & Starck automatic sensor bin STAR_BIN_40", "fi": "Fromm & Starck anturiroska-astia STAR_BIN_40", "x": "кухня; батарейки 4×AA", "x_en": "kitchen; 4×AA batteries", "x_fi": "keittiö; 4×AA paristot", "u": "man/fromm-starck-bin-40.html", "pic": "man/img/bin-pic.png"}], "title_en": "Kitchen appliances", "title_fi": "Keittiökoneet", "room_en": "Kitchen", "room_fi": "Keittiö"}, {"code": "010", "title": "Между аптечками", "title_en": "Middle shelf", "title_fi": "Välihylly", "zone": "Дом", "room": "Кухня", "room_en": "Kitchen", "room_fi": "Keittiö", "cab": "Аптека", "where": "Полка в шкафчике между аптечками 008 и 009", "where_en": "Cabinet shelf, between organizers 008 and 009", "items": [{"ru": "Дюфалак, большая бутылка", "en": "Duphalac, large bottle (lactulose)", "fi": "Duphalac, iso pullo (laktuloosi)", "x": "мягкое слабительное (лактулоза)", "x_en": "mild laxative (lactulose)", "x_fi": "mieto ulostuslääke", "d": "Лактулоза (сироп) — мягкое слабительное при запоре. Обычно 15–45 мл утром во время завтрака. Эффект через 1–2 дня.", "ind": "• Запор, регуляция работы кишечника.\n• Размягчение стула по медицинским причинам: геморрой, после операций на толстой кишке и в области заднего прохода.\n• Печёночная энцефалопатия (лечение и профилактика прекомы/комы) у взрослых. Осмотическое слабительное: в толстой кишке лактулоза расщепляется бактериями до органических кислот, они удерживают воду, увеличивают объём содержимого и мягко стимулируют перистальтику. Практически не всасывается. Работает и как пребиотик — поддерживает рост бифидо- и лактобактерий. При печёночной энцефалопатии снижает образование и всасывание аммиака.", "u": "med/duphalac-large-bottle.html", "d_en": "Lactulose (syrup) – a mild laxative for constipation. Usually 15–45 ml in the morning with breakfast. Takes effect in 1–2 days.", "d_fi": "Laktuloosi (siirappi) – mieto ummetuslääke. Tavallisesti 15–45 ml aamulla aamiaisen yhteydessä. Vaikutus 1–2 vuorokauden kuluttua."}, {"ru": "R-липоевая кислота (Life Extension)", "en": "Super R-Lipoic Acid (Life Extension)", "fi": "R-lipoiinihappo (Life Extension)", "x": "добавка, альфа-липоевая кислота", "x_en": "supplement, alpha-lipoic acid", "x_fi": "ravintolisä", "d": "R-форма альфа-липоевой кислоты (БАД, США). Аналог Берлитиона/Тиоктацида — вместе не дублировать.", "ind": "Как пищевая добавка для поддержки антиоксидантной защиты и клеточного энергообмена. Заявления не оценивались FDA; продукт не предназначен для диагностики, лечения или профилактики заболеваний. R-липоевая кислота — природная («активная») форма альфа-липоевой кислоты. Производитель описывает её как антиоксидант, поддерживающий работу митохондрий, выработку энергии в клетках и защиту от окислительного стресса.", "u": "med/super-r-lipoic-acid.html", "d_en": "R-form of alpha-lipoic acid (dietary supplement, USA). Equivalent of Berlithion/Thioctacid — do not take both together (duplication).", "d_fi": "Alfalipoiinihapon R-muoto (ravintolisä, USA). Vastaa Berlithionia/Thioctacidia — ei päällekkäin samanaikaisesti."}, {"ru": "Bethover B12 Vahva", "en": "Bethover B12 Vahva", "fi": "Bethover B12 Vahva", "x": "B12 + фолиевая кислота + B1, B6", "x_en": "B12 + folic acid + B1, B6", "x_fi": "B12 + foolihappo", "d": "B12 1,3 мг + фолиевая кислота + B1, B3, B6, биотин. Жевательные таблетки со вкусом малины-лимона. 1 таблетка в день.", "ind": " ", "u": "https://www.google.com/search?q=Bethover%20B12%20Vahva%20pakkausseloste", "d_en": "B12 1.3 mg + folic acid + B1, B3, B6, biotin. Chewable tablets, raspberry-lemon flavour. 1 tablet a day.", "d_fi": "B12 1,3 mg + foolihappo + B1, B3, B6, biotiini. Vadelma-sitruunanmakuiset purutabletit. 1 tabletti päivässä."}, {"ru": "Тантум Верде, спрей", "en": "Tantum Verde spray", "fi": "Tantum Verde -suihke", "x": "спрей для горла", "x_en": "throat spray", "x_fi": "kurkkusuihke", "d": "Бензидамин — спрей от боли и воспаления в горле и во рту. 4–8 впрыскиваний 2–6 раз в день.", "ind": "Симптоматическое лечение раздражения и воспаления ротоглотки: • боль в горле при фарингите; • гингивит, стоматит; • в стоматологии — после удаления зуба и для профилактики. Бензидамин — нестероидный противовоспалительный препарат местного действия: уменьшает воспаление и отёк, обезболивает и оказывает местноанестезирующий эффект. Подавляет выработку воспалительных медиаторов (ФНО-α, ИЛ-1β) и стабилизирует клеточные мембраны. Через слизистую всасывается мало, системного действия практически нет; выводится в основном с мочой.", "u": "med/tantum-verde-spray.html", "d_en": "Benzydamine — spray for pain and inflammation in the throat and mouth. 4–8 sprays 2–6 times a day.", "d_fi": "Bentsydamiini — suihke kurkun ja suun kipuun ja tulehdukseen. 4–8 suihkausta 2–6 kertaa päivässä."}, {"ru": "Палочки для чистки IQOS (30 шт.)", "en": "IQOS cleaning sticks (30)", "fi": "IQOS-puhdistustikut (30)", "x": "для чистки держателя IQOS", "x_en": "for cleaning the IQOS holder", "x_fi": "IQOS-pidikkeen puhdistukseen", "d": "Чистящие палочки со спиртовой пропиткой для держателя IQOS.", "d_en": "Alcohol-soaked cleaning sticks for the IQOS holder.", "d_fi": "Alkoholilla kostutetut puhdistuspuikot IQOS-pidikkeelle."}, {"ru": "Вольтарен Форте гель 23,2 мг/г, 50 г", "en": "Voltaren Forte gel 23.2 mg/g (diclofenac)", "fi": "Voltaren Forte geeli 23,2 mg/g", "x": "мазь от боли в мышцах и суставах", "x_en": "gel for muscle and joint pain", "x_fi": "lihas- ja nivelkipuun", "d": "Диклофенак в геле (двойная сила) — местно при боли в мышцах, суставах, ушибах, растяжениях. Втирать 2 раза в день (утром и вечером), не более 2 недель. Не на повреждённую кожу.", "ind": "• Взрослые и подростки с 14 лет: кратковременное местное лечение боли в мышцах и суставах при растяжениях, ушибах, спортивных травмах, перенапряжении.\n• Взрослые с 18 лет: кратковременное лечение боли при остеоартрите коленных суставов и суставов пальцев рук, если диагноз подтверждён врачом. Диклофенак — нестероидный противовоспалительный препарат (НПВП). При нанесении на кожу проникает к месту воспаления, уменьшает боль, воспаление и отёк в мышцах и суставах.", "u": "med/voltaren-forte-gel-23-2-mg-g.html", "d_en": "Diclofenac gel (double strength) — locally for pain in muscles and joints, bruises, sprains. Rub in twice a day (morning and evening), no longer than 2 weeks. Not on broken skin.", "d_fi": "Diklofenaakkigeeli (kaksinkertainen vahvuus) — paikallisesti lihas- ja nivelkipuun, ruhjeisiin ja nyrjähdyksiin. Hiero iholle 2 kertaa päivässä (aamulla ja illalla), enintään 2 viikon ajan. Ei rikkoutuneelle iholle."}, {"ru": "Аквалор Экстра Форте Дуо, 150 мл", "en": "Aqualor Extra Forte Duo 150 ml (nasal spray)", "fi": "Aqualor Extra Forte Duo 150 ml", "x": "промывание носа, гипертонический", "x_en": "nasal wash, hypertonic", "x_fi": "nenähuuhde, hypertoninen", "d": "Гипертонический раствор морской воды с алоэ и ромашкой — промывание и снятие заложенности носа при насморке и синусите. Без привыкания, можно вместе с каплями.", "ind": "• Профилактика и комплексное лечение острых и хронических воспалительных заболеваний носа, пазух и носоглотки: ринит (в т.ч. аллергический и вазомоторный), синусит (в т.ч. гайморит), аденоидит.\n• Профилактика и комплексное лечение ОРВИ и гриппа.\n• Уход за полостью носа после операций на носу и пазухах. ", "u": "med/aqualor-extra-forte-duo-150-ml.html", "d_en": "Hypertonic seawater solution with aloe and chamomile — for rinsing and relieving nasal congestion in a runny nose and sinusitis. Not habit-forming, can be used together with nasal drops.", "d_fi": "Hypertoninen merivesiliuos aloella ja kamomillalla — nenän huuhteluun ja tukkoisuuden lievitykseen nuhassa ja poskiontelotulehduksessa. Ei aiheuta tottumista, voidaan käyttää yhdessä nenätippojen kanssa."}, {"ru": "Стеримар «Заложенный нос» (Stérimar Blocked Nose)", "en": "Sterimar Blocked Nose (hypertonic nasal spray)", "fi": "Stérimar Blocked Nose (nenäsuihke)", "x": "морская вода, гипертонический, с медью", "x_en": "seawater, hypertonic, with copper", "x_fi": "merivesi, hypertoninen, kupari", "d": "Гипертоническая морская вода с медью — уменьшает отёк и заложенность носа при простуде. Безопасен, без привыкания.", "ind": "• Заложенность носа при простуде, синусите, аллергическом насморке.\n• Бактериальный (инфекционный) насморк с густыми выделениями — как вспомогательное средство.\n• Промывание носа в составе лечения простуды. ", "u": "med/sterimar-blocked-nose.html", "d_en": "Hypertonic seawater with copper — reduces nasal swelling and congestion during a cold. Safe, not habit-forming.", "d_fi": "Hypertoninen merivesi kuparilla — vähentää nenän limakalvojen turvotusta ja tukkoisuutta flunssassa. Turvallinen, ei aiheuta tottumista."}, {"ru": "Отривин Ментол 1 мг/мл, спрей", "en": "Otrivin Menthol 1 mg/ml (xylometazoline)", "fi": "Otrivin Menthol 1 mg/ml", "x": "сосудосуживающий спрей в нос", "x_en": "decongestant nasal spray", "x_fi": "tukkoisuuteen, nenäsuihke", "d": "Ксилометазолин — сосудосуживающий спрей при заложенности носа. 1 впрыск в каждую ноздрю до 3 раз в день, не дольше 7–10 дней (привыкание).", "ind": "Облегчение заложенности носа при простуде и синусите. Может применяться при воспалении среднего уха (для облегчения), а также по назначению врача при эндоскопии носа. Для взрослых и детей с 12 лет. Ксилометазолин — сосудосуживающее средство (альфа-адреномиметик). Сужает сосуды слизистой носа, уменьшает её отёк и облегчает носовое дыхание. Ментол и эвкалиптол дают ощущение свежести.", "u": "med/otrivin-menthol-1-mg-ml.html", "d_en": "Xylometazoline — decongestant nasal spray for a blocked nose. 1 spray in each nostril up to 3 times a day, no longer than 7–10 days (habit-forming).", "d_fi": "Ksylometatsoliini — limakalvoja supistava nenäsuihke nenän tukkoisuuteen. 1 suihkaus kumpaankin sieraimeen enintään 3 kertaa päivässä, korkeintaan 7–10 päivän ajan (tottumisen vaara)."}, {"ru": "Ливостин, глазные капли 0,5 мг/мл", "en": "Livostin eye drops 0.5 mg/ml (levocabastine)", "fi": "Livostin silmätipat 0,5 mg/ml", "x": "от аллергии в глазах", "x_en": "allergy eye drops", "x_fi": "allergiaan, silmätipat", "d": "Левокабастин — антигистаминные глазные капли при аллергическом конъюнктивите (зуд, слезотечение). По 1 капле 2 раза в день, при необходимости до 4. Перед применением взбалтывать.", "ind": "Облегчение симптомов аллергического конъюнктивита — зуда, покраснения, отёка век, слезотечения — вызванных пыльцой трав и деревьев, плесенью, пылью и другими аллергенами. Для взрослых и детей старше 4 лет. Левокабастин — противоаллергическое средство, блокатор H1-гистаминовых рецепторов. Быстро (в течение нескольких минут) и надолго снимает аллергические симптомы со стороны глаз.", "u": "med/livostin-eye-drops-0-5-mg-ml.html", "d_en": "Levocabastine – antihistamine eye drops for allergic conjunctivitis (itching, watery eyes). 1 drop twice a day, up to 4 times if needed. Shake before use.", "d_fi": "Levokabastiini – antihistamiinisilmätipat allergiseen sidekalvotulehdukseen (kutina, vuotavat silmät). 1 tippa 2 kertaa päivässä, tarvittaessa enintään 4 kertaa. Ravista ennen käyttöä."}, {"ru": "Визин классический, капли 0,05%", "en": "Visine Classic eye drops 0.05% (tetryzoline)", "fi": "Visine Classic silmätipat 0,05%", "x": "от покраснения глаз", "x_en": "for red eyes", "x_fi": "silmien punoitukseen", "d": "Тетризолин — сосудосуживающие капли от покраснения и отёка глаз. 1–2 капли до 3 раз в день, не дольше 4 дней. Снимать контактные линзы.", "ind": "Отёк и покраснение конъюнктивы (покраснение глаз) при аллергии и при раздражении глаз дымом, пылью, хлорированной водой, ярким светом, косметикой, контактными линзами. Взрослым и детям старше 2 лет (детям до 6 лет — под наблюдением врача). Тетризолин — альфа-адреномиметик, сужает сосуды конъюнктивы и уменьшает отёк тканей. Эффект наступает примерно через минуту и сохраняется 4–8 часов. При местном применении практически не всасывается.", "u": "med/visine-classic-eye-drops-0-05.html", "d_en": "Tetryzoline – vasoconstrictor eye drops for red, swollen eyes. 1–2 drops up to 3 times a day, no longer than 4 days. Remove contact lenses.", "d_fi": "Tetrytsoliini – verisuonia supistavat silmätipat silmien punoitukseen ja turvotukseen. 1–2 tippaa enintään 3 kertaa päivässä, enintään 4 päivän ajan. Poista piilolinssit."}, {"ru": "Аллпрезан, пена для ног (Allpresan fuß spezial)", "en": "Allpresan foot foam", "fi": "Allpresan jalkavaahto", "x": "сухая кожа ног, без мочевины", "x_en": "dry foot skin, urea-free", "x_fi": "kuiva jalkojen iho", "d": "Крем-пена для сухой и чувствительной кожи ног (с пантенолом, без мочевины). Наносить на чистую кожу, впитывается быстро.", "ind": "Ежедневный уход за сухой, чувствительной, раздражённой кожей ног, склонной к покраснению, зуду и стянутости; подходит тем, кому не подходят средства с мочевиной. ", "u": "med/allpresan-foot-foam.html", "d_en": "Cream foam for dry and sensitive skin of the feet (with panthenol, urea-free). Apply to clean skin; absorbs quickly.", "d_fi": "Voidevaahto jalkojen kuivalle ja herkälle iholle (sisältää pantenolia, ei ureaa). Levitä puhtaalle iholle, imeytyy nopeasti."}, {"ru": "Нитрогина, бальзам для губ SPF 20 (Neutrogena Lipcare)", "en": "Neutrogena Lipcare lip balm SPF 20", "fi": "Neutrogena Lipcare huulivoide SPF 20", "x": "гигиеническая помада, 2 шт.", "x_en": "lip balm, 2 pcs", "x_fi": "huulivoide, 2 kpl", "d": "Защитный бальзам для сухих и обветренных губ, SPF 20.", "u": "https://www.google.com/search?q=%D0%9D%D0%B8%D1%82%D1%80%D0%BE%D0%B3%D0%B8%D0%BD%D0%B0%2C%20%D0%B1%D0%B0%D0%BB%D1%8C%D0%B7%D0%B0%D0%BC%20%D0%B4%D0%BB%D1%8F%20%D0%B3%D1%83%D0%B1%20SPF%2020%20%28Neutrogena%20Lipcare%29%20%D0%B8%D0%BD%D1%81%D1%82%D1%80%D1%83%D0%BA%D1%86%D0%B8%D1%8F%20%D0%BF%D0%BE%20%D0%BF%D1%80%D0%B8%D0%BC%D0%B5%D0%BD%D0%B5%D0%BD%D0%B8%D1%8E", "d_en": "Protective balm for dry and chapped lips, SPF 20.", "d_fi": "Suojaava huulivoide kuiville ja rohtuneille huulille, SPF 20."}, {"ru": "Акилдия, защитный крем для ног (Akildia)", "en": "Akildia protective foot cream", "fi": "Akildia jalkojen suojavoide", "x": "для уязвимой кожи стоп (диабетическая стопа)", "x_en": "for fragile feet (diabetic foot care)", "x_fi": "herkille jaloille (diabeetikon jalat)", "d": "Защитный крем для уязвимых стоп (уход при диабете, Asepta, Монако): увлажняет, укрепляет защитный барьер кожи, смягчает мозоли, с антибактериальными и противогрибковыми компонентами. 2 раза в день на всю стопу, не на раны.", "ind": "Ежедневный уход за уязвимой, сухой кожей стоп, в первую очередь при диабете («pied fragilisé» — ослабленная стопа). Это косметическое средство, не лекарство. ", "u": "med/akildia-protective-foot-cream.html", "d_en": "Protective cream for vulnerable feet (diabetic foot care, Asepta, Monaco): moisturises, strengthens the skin's protective barrier, softens calluses, contains antibacterial and antifungal components. Twice a day on the whole foot, not on wounds.", "d_fi": "Suojaava voide herkille jaloille (diabeetikon jalkojenhoito, Asepta, Monaco): kosteuttaa, vahvistaa ihon suojakerrosta, pehmentää kovettumia, sisältää antibakteerisia ja sienenvastaisia ainesosia. 2 kertaa päivässä koko jalkaterään, ei haavoihin."}], "where_fi": "Hylly kaapissa lääkelaatikoiden 008 ja 009 välissä"}, {"code": "008-1", "title": "Запас сверху", "title_en": "Spare stock on top", "title_fi": "Varasto päällä", "zone": "Дом", "room": "Кухня", "room_en": "Kitchen", "room_fi": "Keittiö", "cab": "Аптека", "where": "Аптечка 008 «Когда заболел», лоток сверху (запас)", "where_en": "Medicine organizer 008 “When sick”, top tray (spare stock)", "items": [{"ru": "Мукофальк, пакетики (запас)", "en": "Mucofalk sachets (spare)", "fi": "Mucofalk-annospussit (vara)", "x": "остаток, что не влез в ящик 9", "x_en": "overflow from drawer 9", "x_fi": "laatikon 9 ylijäämä", "d": "Оболочка семян подорожника (клетчатка). При запоре и для нормализации стула: 1 пакетик 2–6 раз в день, размешать в стакане воды и сразу выпить, запить ещё водой. Запас — основная пачка в ящике 008-9.", "ind": "• Запоры (в т.ч. при беременности)\n• Анальные трещины и геморрой\n• После операций в аноректальной области — для смягчения стула\n• Функциональная диарея\n• Синдром раздражённого кишечника Растительное слабительное на основе пищевых волокон. Волокна оболочки семян связывают воду в кишечнике, увеличивают объём стула и размягчают его, что нормализует работу кишечника и облегчает опорожнение; при диарее, наоборот, загущает жидкий стул.", "u": "med/mucofalk-sachets.html", "d_en": "Psyllium seed husk (fibre). For constipation and to regulate bowel movements: 1 sachet 2–6 times a day, stir into a glass of water and drink at once, then drink more water. Spare stock – the main pack is in box 008-9.", "d_fi": "Psylliumsiemenen kuori (kuitu). Ummetukseen ja suolen toiminnan säätelyyn: 1 annospussi 2–6 kertaa päivässä, sekoita lasilliseen vettä ja juo heti, juo perään vielä vettä. Varasto – pääpakkaus on laatikossa 008-9."}, {"ru": "Пенталгин (запас)", "en": "Pentalgin (spare)", "fi": "Pentalgin (vara)", "x": "запас; основная пачка — в ящике 008-8", "x_en": "spare; main pack in drawer 008-8", "x_fi": "vara; pääpakkaus laatikossa 008-8", "d": "Парацетамол + напроксен + кофеин + дротаверин + фенирамин. От головной, зубной, мышечной боли, болезненных спазмов, при простуде. Обычно 1 таблетка 1–3 раза в день, не более 4 в сутки, не дольше 5 дней. Не сочетать с другими средствами с парацетамолом (Терафлю, Парацетамол). Не принимать с алкоголем. Запас — основная пачка в ящике 008-8.", "ind": "• Боли разного происхождения: суставные и мышечные, радикулит, болезненные менструации, невралгия, зубная и головная боль (в т.ч. при спазме сосудов мозга).\n• Боли, связанные со спазмом гладкой мускулатуры: хронический холецистит, желчнокаменная болезнь, постхолецистэктомический синдром, почечная колика.\n• Боль после травм и операций, в т.ч. с воспалением.\n• Простуда с температурой (симптоматически). Комбинированное средство: обезболивает, снимает воспаление, спазм и снижает температуру.\n• Парацетамол — жаропонижающее и обезболивающее.\n• Напроксен (НПВС) — противовоспалительное и обезболивающее за счёт подавления ЦОГ.\n• Кофеин — тонизирует, усиливает действие анальгетиков.\n• Дротаверин — снимает спазм гладких мышц (ЖКТ, желчные и мочевые пути, сосуды).\n• Фенирамин — антигистаминный компонент с лёгким седативным эффектом, усиливает обезболивание.", "u": "med/pentalgin.html", "d_en": "Paracetamol + naproxen + caffeine + drotaverine + pheniramine. For headache, toothache, muscle pain, painful spasms, colds. Usually 1 tablet 1–3 times a day, no more than 4 a day, no longer than 5 days. Do not combine with other paracetamol products (Theraflu, Paracetamol). Do not take with alcohol. Spare stock – the main pack is in box 008-8.", "d_fi": "Parasetamoli + naprokseeni + kofeiini + drotaveriini + feniramiini. Päänsärkyyn, hammassärkyyn, lihaskipuun, kivuliaisiin kouristuksiin, flunssaan. Tavallisesti 1 tabletti 1–3 kertaa päivässä, enintään 4 vuorokaudessa, enintään 5 päivän ajan. Ei yhdessä muiden parasetamolia sisältävien valmisteiden kanssa (Theraflu, Paracetamol). Ei alkoholin kanssa. Varasto – pääpakkaus on laatikossa 008-8."}], "where_fi": "Lääkekaappi 008 ”Kun sairastuu”, päällä oleva tarjotin (varastoa)"}, {"code": "008-7", "title": "Первая помощь", "title_en": "First aid", "title_fi": "Ensiapu", "zone": "Дом", "room": "Кухня", "room_en": "Kitchen", "room_fi": "Keittiö", "cab": "Аптека", "where": "Аптечка 008 «Когда заболел», ящик широкий", "where_en": "Medicine organizer 008 “When sick”, wide drawer", "items": [{"ru": "Пластыри Salvequick и др.", "en": "Plasters (Salvequick etc.)", "fi": "Laastarit (Salvequick ym.)", "d": "Пластыри для мелких п мокнущие раны, швы, эпизиотомия, трещины кожи. Комбинация двух антибиотиков: бацитрацин нарушает построение клеточной стенки бактерий (в основном грамположительных), неомицин блокирует синтез белка у грамположительных и грамотрицательных бактерий. Вместе действуют шире и сильнее, в том числе против стафилококков. Через кожу почти не всасываются, но при больших площадях всасывание возможно.", "u": "med/baneocin-powder.html", "d_en": "Bacitracin + neomycin (antibiotics). For small infected wounds, abrasions and burns: sprinkle a thin layer 2–4 times a day. Do not apply to large areas. No longer than 7 days.", "d_fi": "Basitrasiini + neomysiini (antibiootteja). Pieniin tulehtuneisiin haavoihin, naarmuihin ja palovammoihin: ripottele ohut kerros 2–4 kertaa päivässä. Ei laajoille alueille. Enintään 7 päivää."}, {"ru": "Зелёнка (бриллиантовый зелёный)", "en": "Brilliant green antiseptic", "fi": "Briljanttivihreä antiseptinen liuos", "x": "обработать края ранки", "x_en": "antiseptic for small wounds", "x_fi": "antiseptinen haavoille", "d": "Антисептик 1% спиртовой. Обрабатывать края ранки, а не саму рану. Сильно окрашивает кожу и ткани.", "ind": "• Свежие ссадины, порезы, царапины и другие нарушения целостности кожи.\n• Свежие послеоперационные и посттравматические раны и рубцы.\n• Гнойничковые поражения кожи (пиодермия).\n• Блефарит, мейбомит (обработка края века — осторожно, не допуская попадания в глаз). Антисептик: подавляет преимущественно грамположительные бактерии (в т.ч. стафилококки), подсушивает поверхность ранки.", "u": "med/brilliant-green-antiseptic.html", "d_en": "Antiseptic, 1% alcohol solution. Treat the edges of the wound, not the wound itself. Strongly stains skin and fabrics.", "d_fi": "Antiseptinen 1-prosenttinen alkoholiliuos. Käsittele haavan reunat, ei itse haavaa. Värjää voimakkaasti ihoa ja tekstiilejä."}, {"ru": "Градусник", "en": "Thermometer", "fi": "Kuumemittari", "d": "Электронный термометр. Температура выше 38,5 °C — повод принять жаропонижающее; выше 39,5 °C или держится больше 3 дней — к врачу.", "d_en": "Electronic thermometer. A temperature above 38.5 °C is a reason to take a fever reducer; above 39.5 °C or lasting more than 3 days – see a doctor.", "d_fi": "Digitaalinen kuumemittari. Yli 38,5 °C:n lämpö on syy ottaa kuumetta alentava lääke; yli 39,5 °C tai yli 3 päivää jatkunut kuume – lääkäriin."}, {"ru": "Пластыри Teneris", "en": "Teneris plasters", "fi": "Teneris-laastarit", "d": "Пластыри для мелких ранок и мозолей.", "d_en": "Plasters for small wounds and blisters.", "d_fi": "Laastarit pieniin haavoihin ja rakkoihin."}], "where_fi": "Lääkekaappi 008 ”Kun sairastuu”, leveä laatikko"}, {"code": "008-8", "title": "Боль, аллергия, по рецепту", "title_en": "Pain, allergy, prescription", "title_fi": "Kipu, allergia, resepti", "zone": "Дом", "room": "Кухня", "room_en": "Kitchen", "room_fi": "Keittiö", "cab": "Аптека", "where": "Аптечка 008 «Когда заболел», ящик малый верхний", "where_en": "Medicine organizer 008 “When sick”, small drawer, top", "items": [{"ru": "Пенталгин", "en": "Pentalgin", "fi": "Pentalgin", "x": "от боли и спазмов", "x_en": "pain & cramps", "x_fi": "kipu ja kouristukset", "d": "Парацетамол + напроксен + кофеин + дротаверин + фенирамин. От головной, зубной, мышечной боли, болезненных спазмов, при простуде. Обычно 1 таблетка 1–3 раза в день, не более 4 в сутки, не дольше 5 дней. Не сочетать с другими средствами с парацетамолом (Терафлю, Парацетамол). Не принимать с алкоголем.", "ind": "• Боли разного происхождения: суставные и мышечные, радикулит, болезненные менструации, невралгия, зубная и головная боль (в т.ч. при спазме сосудов мозга).\n• Боли, связанные со спазмом гладкой мускулатуры: хронический холецистит, желчнокаменная болезнь, постхолецистэктомический синдром, почечная колика.\n• Боль после травм и операций, в т.ч. с воспалением.\n• Простуда с температурой (симптоматически). Комбинированное средство: обезболивает, снимает воспаление, спазм и снижает температуру.\n• Парацетамол — жаропонижающее и обезболивающее.\n• Напроксен (НПВС) — противовоспалительное и обезболивающее за счёт подавления ЦОГ.\n• Кофеин — тонизирует, усиливает действие анальгетиков.\n• Дротаверин — снимает спазм гладких мышц (ЖКТ, желчные и мочевые пути, сосуды).\n• Фенирамин — антигистаминный компонент с лёгким седативным эффектом, усиливает обезболивание.", "u": "med/pentalgin.html", "d_en": "Paracetamol + naproxen + caffeine + drotaverine + pheniramine. For headache, toothache, muscle pain, painful spasms, colds. Usually 1 tablet 1–3 times a day, no more than 4 a day, no longer than 5 days. Do not combine with other paracetamol products (Theraflu, Paracetamol). Do not take with alcohol.", "d_fi": "Parasetamoli + naprokseeni + kofeiini + drotaveriini + feniramiini. Päänsärkyyn, hammassärkyyn, lihaskipuun, kivuliaisiin kouristuksiin, flunssaan. Tavallisesti 1 tabletti 1–3 kertaa päivässä, enintään 4 vuorokaudessa, enintään 5 päivän ajan. Ei yhdessä muiden parasetamolia sisältävien valmisteiden kanssa (Theraflu, Paracetamol). Ei alkoholin kanssa."}, {"ru": "Burana-C", "en": "Burana-C (ibuprofen + vit C)", "fi": "Burana-C", "x": "от боли и температуры (ибупрофен)", "x_en": "pain & fever (ibuprofen)", "x_fi": "kipu ja kuume (ibuprofeeni)", "d": "Ибупрофен 400 мг + витамин C. От боли и температуры: 1 таблетка до 3 раз в день, лучше после еды. Не при язве желудка; осторожно при приёме средств для давления и разжижения крови.", "ind": "Облегчение симптомов простуды и гриппа вирусного происхождения: температура, ломота в мышцах и суставах, головная боль. Длительно — только по назначению врача. Ибупрофен — нестероидное противовоспалительное средство (НПВС): уменьшает образование веществ, вызывающих воспаление, боль и жар, поэтому снимает боль и снижает температуру. Витамин C участвует в ферментных реакциях и работает как антиоксидант.", "u": "med/burana-c.html", "d_en": "Ibuprofen 400 mg + vitamin C. For pain and fever: 1 tablet up to 3 times a day, preferably after meals. Not with a stomach ulcer; use with caution when taking blood pressure medicines or blood thinners.", "d_fi": "Ibuprofeeni 400 mg + C-vitamiini. Kipuun ja kuumeeseen: 1 tabletti enintään 3 kertaa päivässä, mieluiten aterian jälkeen. Ei mahahaavassa; varovaisuutta, jos käytät verenpainelääkkeitä tai verenohennuslääkkeitä."}, {"ru": "Цетрин 10 мг", "en": "Zetrin (cetirizine) 10 mg", "fi": "Zetrin (setiritsiini) 10 mg", "x": "от аллергии, 1 раз в день", "x_en": "antihistamine, once daily", "x_fi": "allergialääke, kerran päivässä", "d": "Цетиризин — от аллергии (насморк, чихание, зуд, крапивница). 1 таблетка 1 раз в день, лучше вечером. Может слегка вызывать сонливость.", "ind": "• Сезонный и круглогодичный аллергический ринит; • аллергический конъюнктивит; • поллиноз (сенная лихорадка); • крапивница, в т.ч. хроническая идиопатическая; • зудящие аллергические дерматозы (атопический дерматит, нейродермит); • отёк Квинке. Цетиризин — противоаллергическое средство, блокатор H1-гистаминовых рецепторов (метаболит гидроксизина). Уменьшает отёк, зуд, проницаемость капилляров и миграцию клеток воспаления, облегчает течение аллергических реакций. Почти не обладает снотворным и холинолитическим действием в терапевтических дозах. Начинает действовать примерно через 20 минут после приёма 10 мг, эффект длится более 24 часов и сохраняется до 3 суток после отмены; привыкания не развивается.", "u": "med/zetrin.html", "d_en": "Cetirizine – for allergies (runny nose, sneezing, itching, hives). 1 tablet once a day, preferably in the evening. May cause slight drowsiness.", "d_fi": "Setiritsiini – allergiaan (nuha, aivastelu, kutina, nokkosihottuma). 1 tabletti kerran päivässä, mieluiten illalla. Voi aiheuttaa lievää uneliaisuutta."}, {"ru": "Цетиризин-ратиофарм 10 мг", "en": "Cetirizin-ratiopharm 10 mg", "fi": "Cetirizin-ratiopharm 10 mg", "x": "от аллергии, 1 раз в день", "x_en": "antihistamine, once daily", "x_fi": "allergialääke, kerran päivässä", "d": "То же, что Цетрин (цетиризин). 1 таблетка 1 раз в день. Два вместе не принимать.", "ind": "• Сезонный и круглогодичный аллергический ринит и аллергический конъюнктивит\n• Поллиноз (сенная лихорадка)\n• Крапивница, в т.ч. хроническая идиопатическая; отёк Квинке\n• Зудящие аллергические дерматозы, включая атопический дерматит Противоаллергическое средство — блокатор H1-гистаминовых рецепторов второго поколения. Уменьшает зуд, отёк, чихание, насморк и слезотечение. Действие начинается через 20–60 минут после приёма и длится 24 часа; в терапевтических дозах практически не вызывает сонливости, привыкания не развивается.", "u": "med/cetirizin-ratiopharm-10-mg.html", "d_en": "The same as Cetrin (cetirizine). 1 tablet once a day. Do not take the two together.", "d_fi": "Sama kuin Cetrin (setiritsiini). 1 tabletti kerran päivässä. Näitä kahta ei oteta yhdessä."}, {"ru": "Супракс 400 мг (цефиксим)", "en": "Suprax 400 mg (cefixime)", "fi": "Suprax 400 mg (kefiksiimi)", "x": "антибиотик — по назначению врача", "x_en": "antibiotic — as prescribed", "x_fi": "antibiootti — lääkärin ohjeen mukaan", "d": "Антибиотик (цефиксим) — при бактериальных инфекциях (ухо, горло, мочевые пути, бронхи). Обычно 1 капсула 1 раз в день. Рецептурное: доза и длительность — только по назначению врача. Курс не прерывать.", "ind": "Бактериальные инфекции, вызванные чувствительными микробами:\n• фарингит, тонзиллит, синусит;\n• острый и хронический бронхит;\n• средний отит;\n• неосложнённые инфекции мочевых путей;\n• неосложнённая гонорея. Антибиотик-цефалоспорин III поколения широкого спектра: убивает бактерии, нарушая синтез их клеточной стенки; устойчив к большинству бета-лактамаз. Не действует на синегнойную палочку, энтерококки, листерии, большинство стафилококков (включая MRSA), энтеробактер, бактероиды и клостридии. Всасывание не зависит от еды; период полувыведения 3–4 ч (дольше при болезни почек).", "u": "med/suprax-400-mg.html", "d_en": "Antibiotic (cefixime) — for bacterial infections (ear, throat, urinary tract, bronchi). mation", "x_fi": "kipu ja tulehdus", "d": "Диклофенак — от боли и воспаления (суставы, спина, мышцы). Принимать после еды, коротким курсом. Не при язве; не вместе с другими НПВС. Рецептурное: доза и длительность — только по назначению врача.", "ind": "• Воспалительные и дегенеративные болезни суставов и позвоночника: ревматоидный, псориатический, реактивный, подагрический артрит, анкилозирующий спондилит, остеоартроз, бурсит, тендовагинит, ревматическое поражение мягких тканей.\n• Боли в спине и позвоночнике: люмбаго, ишиас, радикулит, невралгия, миалгия, артралгия.\n• Боль с воспалением после травм и операций (в т.ч. стоматологических и ортопедических).\n• Болезненные менструации. Нестероидный противовоспалительный препарат: подавляет ферменты ЦОГ-1 и ЦОГ-2 и синтез простагландинов, снимая воспаление, боль и температуру. Лечит симптомы, но не влияет на течение болезни. Пролонгированная форма даёт пик концентрации примерно через 4 ч, препарат накапливается в суставной жидкости.", "u": "med/diclofenac.html", "d_en": "Diclofenac — for pain and inflammation (joints, back, muscles). Take after meals, as a short course. Not with an ulcer; not together with other NSAIDs. Prescription-only: dose and duration only as prescribed by a doctor.", "d_fi": "Diklofenaakki — kipuun ja tulehdukseen (nivelet, selkä, lihakset). Ota aterian jälkeen, lyhyenä kuurina. Ei mahahaavassa; ei yhdessä muiden tulehduskipulääkkeiden kanssa. Reseptilääke: annos ja hoidon kesto vain lääkärin määräyksen mukaan."}, {"ru": "Нитроксолин", "en": "Nitroxoline", "fi": "Nitroksoliini", "x": "при инфекции мочевых путей — по назначению врача", "x_en": "urinary infection — as prescribed", "x_fi": "virtsatieinfektio — lääkärin ohjeen mukaan", "d": "Антибактериальное при инфекциях мочевых путей (цистит). Окрашивает мочу в жёлто-оранжевый цвет — это нормально. Рецептурное: доза и длительность — только по назначению врача.", "ind": "• Инфекции мочеполовых путей: пиелонефрит, цистит, уретрит, эпидидимит, инфицированная аденома или опухоль простаты.\n• Профилактика инфекций при катетеризации, цистоскопии, после операций на почках и мочевых путях. Противомикробное средство из группы оксихинолинов: подавляет синтез ДНК бактерий. Действует на многие грамположительные и грамотрицательные бактерии, некоторые грибы и трихомонады. Хорошо всасывается и выводится почками в неизменённом виде, поэтому создаёт высокие концентрации в моче.", "u": "med/nitroxoline.html", "d_en": "Antibacterial for urinary tract infections (cystitis). Colours urine yellow-orange — this is normal. Prescription-only: dose and duration only as prescribed by a doctor.", "d_fi": "Antibakteerinen lääke virtsatieinfektioihin (virtsarakkotulehdus). Värjää virtsan kelta-oranssiksi — tämä on normaalia. Reseptilääke: annos ja hoidon kesto vain lääkärin määräyksen mukaan."}], "where_fi": "Lääkekaappi 008 ”Kun sairastuu”, pieni ylälaatikko"}, {"code": "008-9", "title": "Живот, кишечник, печень", "title_en": "Stomach, bowel & liver", "title_fi": "Vatsa, suolisto ja maksa", "zone": "Дом", "room": "Кухня", "room_en": "Kitchen", "room_fi": "Keittiö", "cab": "Аптека", "where": "Аптечка 008 «Когда заболел», ящик малый нижний", "where_en": "Medicine organizer 008 “When sick”, small drawer, bottom", "items": [{"ru": "Фитолакс", "en": "Fitolax", "fi": "Fitolaks", "x": "мягкое слабительное (растительное)", "x_en": "mild herbal laxative", "x_fi": "mieto kasvipohjainen ulostuslääke", "d": "Растительное мягкое слабительное (БАД, жевательные таблетки). Обычно 2 таблетки вечером во время еды. Курс до 14 дней.", "ind": "Нарушение работы кишечника с запорами, затруднённая или нерегулярная дефекация. Мягкое растительное слабительное: антрагликозиды сенны усиливают перистальтику толстой кишки, абрикос размягчает стул; укроп и подорожник уменьшают спазмы и газообразование, облегчают отхождение газов при вздутии.", "u": "med/fitolax.html", "d_en": "Herbal mild laxative (food supplement, chewable tablets). Usually 2 tablets in the evening with a meal. Course up to 14 days.", "d_fi": "Kasviperäinen mieto ummetuslääke (ravintolisä, purutabletit). Tavallisesti 2 tablettia illalla aterian yhteydessä. Kuuri enintään 14 päivää."}, {"ru": "Гутталакс", "en": "Guttalax", "fi": "Guttalax", "x": "слабительное", "x_en": "laxative", "x_fi": "ulostuslääke", "d": "Слабительное (пикосульфат натрия). Действует через 6–12 часов: принимать на ночь. Не при болях в животе неясной причины.", "ind": "• Запор при вялости (атонии, гипотонии) толстой кишки — в том числе у пожилых, лежачих, после операций и родов, при кормлении грудью.\n• Запор от приёма лекарств, от нарушений питания или дисбиоза.\n• Размягчение стула при геморрое, проктите, анальной трещине.\n• Синдром раздражённого кишечника с преобладанием запоров, заболевания желчного пузыря. Стимулирующее слабительное, действует только в толстой кишке и не мешает всасыванию пищи в тонкой. Бактерии толстой кишки превращают его в активный метаболит, который усиливает перистальтику и задерживает воду в просвете кишки, размягчая стул. Эффект наступает через 6–12 часов (в среднем около 10 часов); в кровь всасывается очень мало.", "u": "med/guttalax.html", "d_en": "Laxative (sodium picosulfate). Works in 6–12 hours: take at bedtime. Not for abdominal pain of unclear cause.", "d_fi": "Ummetuslääke (natriumpikosulfaatti). Vaikuttaa 6–12 tunnissa: ota illalla ennen nukkumaanmenoa. Ei epäselvästä syystä johtuvaan vatsakipuun."}, {"ru": "Микролакс", "en": "Microlax", "fi": "Microlax", "x": "микроклизма, быстро от запора", "x_en": "mini enema for constipation", "x_fi": "peräruiske ummetukseen", "d": "Микроклизма — быстрое средство от запора, действует через 5–15 минут. Одна тюбик-клизма; наконечник ввести полностью.", "ind": "• Запор, в том числе энкопрез (недержание кала). • Подготовка к эндоскопическому (ректоскопия) и рентгенологическому исследованию кишечника. Комбинированное слабительное местного действия. Натрия цитрат вытесняет связанную воду из каловых масс, натрия лаурилсульфоацетат разжижает содержимое кишечника, сорбитол притягивает воду в кишку. Стул размягчается, опорожнение облегчается. Эффект наступает через 5–15 минут.", "u": "med/microlax.html", "d_en": "Micro-enema – a fast remedy for constipation, works in 5–15 minutes. One tube enema; insert the nozzle fully.", "d_fi": "Pienoisperäruiske – nopea apu ummetukseen, vaikuttaa 5–15 minuutissa. Yksi tuubiperäruiske; vie kärki kokonaan sisään."}, {"ru": "Мукофальк, пакетики", "en": "Mucofalk sachets (psyllium)", "fi": "Mucofalk-annospussit (psyllium)", "x": "пищевые волокна для кишечника", "x_en": "fibre for the bowel", "x_fi": "kuitu suolistolle", "d": "Оболочка семян подорожника (клетчатка). При запоре и для нормализации стула: 1 пакетик 2–6 раз в день, размешать в стакане воды и сразу выпить, запить ещё водой.", "ind": "• Запоры (в т.ч. при беременности)\n• Анальные трещины и геморрой\n• После операций в аноректальной области — для смягчения стула\n• Функциональная диарея\n• Синдром раздражённого кишечника Растительное слабительное на основе пищевых волокон. Волокна оболочки семян связывают воду в кишечнике, увеличивают объём стула и размягчают его, что нормализует работу кишечника и облегчает опорожнение; при диарее, наоборот, загущает жидкий стул.", "u": "med/mucofalk-sachets.html", "d_en": "Psyllium seed husk (fibre). For constipation and to regulate bowel movements: 1 sachet 2–6 times a day, stir into a glass of water and drink at once, then drink more water.", "d_fi": "Psylliumsiemenen kuori (kuitu). Ummetukseen ja suolen toiminnan säätelyyn: 1 annospussi 2–6 kertaa päivässä, sekoita lasilliseen vettä ja juo heti, juo perään vielä vettä."}, {"ru": "Уголь активированный", "en": "Activated charcoal", "fi": "Lääkehiili", "x": "при отравлении", "x_en": "for food poisoning", "x_fi": "ruokamyrkytykseen", "d": "Сорбент — при отравлении, диарее. Примерно 1 таблетка на 10 кг веса за приём. Принимать отдельно от других лекарств (за 1–2 часа), иначе ослабит их действие.", "ind": "• Отравления (пищевые токсикоинфекции, лекарства, алкалоиды, соли тяжёлых металлов и др.), в т.ч. в комплексе при дизентерии и сальмонеллёзе\n• Диспепсия, метеоризм (вздутие)\n• Пищевая и лекарственная аллергия\n• Гипербилирубинемия и гиперазотемия (в составе комплексного лечения)\n• Подготовка к УЗИ и рентгену (уменьшение газов) Энтеросорбент: на своей огромной поверхности связывает в ЖКТ токсины, яды, лекарства, соли тяжёлых металлов, бактериальные токсины и газы, препятствуя их всасыванию, и выводит их с калом. Также связывает избыток билирубина, мочевины, холестерина. Плохо связывает кислоты, щёлочи, соли железа, цианиды, метанол, этиленгликоль. Сам не всасывается и полностью выводится за 24 часа.", "u": "med/activated-charcoal.html", "d_en": "Adsorbent – for poisoning, diarrhoea. About 1 tablet per 10 kg of body weight per dose. Take separately from other medicines (1–2 hours apart), otherwise it will weaken their effect.", "d_fi": "Imeyttävä lääke (adsorbentti) – myrkytyksiin, ripuliin. Noin 1 tabletti 10 painokiloa kohti kerta-annoksena. Ota eri aikaan kuin muut lääkkeet (1–2 tunnin välein), muuten se heikentää niiden tehoa."}, {"ru": "Фамотидин 40 мг", "en": "Famotidine 40 mg", "fi": "Famotidiini 40 mg", "x": "от изжоги и кислотности", "x_en": "heartburn & acid", "x_fi": "närästykseen", "d": "Снижает кислотность желудка — изжога, гастрит, язва. Обычно 1 таблетка на ночь. Рецептурное: доза и длительность — только по назначению врача.", "ind": "• Язвенная болезнь желудка и 12-перстной кишки — лечение и профилактика обострений.\n• Язвы от НПВП, стрессовые и послеоперационные.\n• Эрозивный гастродуоденит; диспепсия с повышенной кислотностью (изжога, кислая отрыжка).\n• Рефлюкс-эзофагит; синдром Золлингера–Эллисона.\n• Профилактика повторных кровотечений из верхних отделов ЖКТ и аспирации желудочного сока при наркозе. Блокатор H2-гистаминовых рецепторов: снижает выработку соляной кислоты в желудке (базальную и стимулированную) и активность пепсина. Начинает действовать через 1 ч, максимум через 3 ч, эффект длится 12–24 ч.", "u": "med/famotidine-40-mg.html", "d_en": "Reduces stomach acid – heartburn, gastritis, ulcer. Usually 1 tablet at bedtime. Prescription-only: dose and duration only as prescribed by a doctor.", "d_fi": "Vähentää mahahappoa – närästys, mahakatarri, haava. Tavallisesti 1 tabletti illalla. Reseptilääke: annos ja hoidon kesto vain lääkärin määräyksen mukaan."}, {"ru": "Дюспаталин 200 мг", "en": "Duspatalin 200 mg (mebeverine)", "fi": "Duspatalin 200 mg (mebeveriini)", "x": "от спазмов и болей в животе", "x_en": "abdominal cramps", "x_fi": "vatsakrampit", "d": "Мебеверин — снимает спазмы кишечника, боли и вздутие (синдром раздражённого кишечника). 1 капсула 2 раза в день за 20 минут до еды, не разжёвывать.", "ind": "Боль, спазмы, дискомфорт и нарушения работы кишечника при синдроме раздражённого кишечника; спазмы ЖКТ, в том числе на фоне органических заболеваний. Спазмолитик: прямо расслабляет гладкие мышцы кишечника, снимая спазм, но не подавляя нормальную перистальтику. Не имеет атропиноподобных побочных эффектов. Почти полностью расщепляется в организме, метаболиты выводятся с мочой, не накапливается.", "u": "med/duspatalin-200-mg.html", "d_en": "Mebeverine – relieves intestinal spasms, pain and bloating (irritable bowel syndrome). 1 capsule twice a day 20 minutes before meals, do not chew.", "d_fi": "Mebeveriini – lievittää suolen kouristuksia, kipua ja turvotusta (ärtyvän suolen oireyhtymä). 1 kapseli 2 kertaa päivässä 20 minuuttia ennen ateriaa, ei saa pureskella."}, {"ru": "Ребагит 100 мг", "en": "Rebagit 100 mg (rebamipide)", "fi": "Rebagit 100 mg (rebamipidi)", "x": "защита желудка — по назначению врача", "x_en": "stomach protection — as prescribed", "x_fi": "mahan suoja — lääkärin ohjeen mukaan", "d": "Ребамипид — защищает слизистую желудка (гастрит, язва, при приёме НПВС). Обычно 1 таблетка 3 раза в день. Рецептурное: доза и длительность — только по назначению врача.", "ind": "• Язва желудка.\n• Хронический гастрит с повышенной кислотностью в стадии обострения.\n• Эрозивный гастрит.\n• Профилактика поражения слизистой желудка при приёме НПВП.\nМожет применяться в составе комбинированной терапии. Гастропротектор: повышает содержание простагландина E2 в слизистой желудка, усиливает выработку защитной слизи и кровоток в слизистой, обладает антиоксидантным действием. Защищает слизистую от повреждения алкоголем, кислотами, щелочами, аспирином и другими НПВП. Пик концентрации — через ~2 ч, период полувыведения ~1 ч, не накапливается.", "u": "med/rebagit-100-mg.html", "d_en": "Rebamipide – protects the stomach lining (gastritis, ulcer, when taking NSAIDs). Usually 1 tablet 3 times a day. Prescription-only: dose and duration only as prescribed by a doctor.", "d_fi": "Rebamipidi – suojaa mahan limakalvoa (mahakatarri, haava, tulehduskipulääkkeiden käytön aikana). Tavallisesti 1 tabletti 3 kertaa päivässä. Reseptilääke: annos ja hoidon kesto vain lääkärin määräyksen mukaan."}, {"ru": "Ультоп (омепразол)", "en": "Ultop (omeprazole)", "fi": "Ultop (omepratsoli)", "x": "от изжоги, для желудка", "x_en": "heartburn, stomach acid", "x_fi": "närästys", "d": "Омепразол — снижает кислотность: изжога, гастрит, язва; защита желудка при приёме обезболивающих. Обычно 1 капсула утром за 30 минут до еды.", "ind": "• Язва желудка и двенадцатиперстной кишки (лечение и профилактика рецидивов), в том числе в схемах уничтожения Helicobacter pylori.\n• Гастроэзофагеальная рефлюксная болезнь (ГЭРБ), рефлюкс-эзофагит, изжога.\n• Эрозии и язвы от приёма НПВС, стрессовые язвы.\n• Синдром Золлингера–Эллисона и другие состояния с избытком кислоты. Ингибитор протонной помпы: блокирует последний этап выработки соляной кислоты в желудке. Действие начинается примерно через час, максимум — через 2 часа, длится около 24 часов; после отмены выработка кислоты восстанавливается за 3–5 дней.", "u": "med/ultop.html", "d_en": "Omeprazole – reduces stomach acid: heartburn, gastritis, ulcer; protects the stomach when taking painkillers. Usually 1 capsule in the morning 30 minutes before meals.", "d_fi": "Omepratsoli – vähentää mahahappoa: närästys, mahakatarri, haava; suojaa mahaa kipulääkkeitä käytettäessä. Tavallisesti 1 kapseli aamulla 30 minuuttia ennen ateriaa."}, {"ru": "Фестал", "en": "Festal", "fi": "Festal", "x": "ферменты, при тяжести после еды", "x_en": "digestive enzymes", "x_fi": "ruoansulatusentsyymit", "d": "Ферменты поджелудочной железы — при тяжести после жирной/обильной еды. 1–2 драже во время или сразу после еды, не разжёвывать.", "ind": "• Недостаточность внешнесекреторной функции поджелудочной железы (хронический панкреатит) с нарушением пищеварения, вздутием, склонностью к запорам — в составе комплексной терапии при болезнях печени, после удаления жёлчного пузыря, при дискинезии желчевыводящих путей, хроническом гастрите, дуодените, холецистите. • Улучшение переваривания пищи при нормальной работе ЖКТ — при погрешностях в диете (переедание, жирная пища), нарушении жевания, малоподвижном образе жизни. • Подготовка к УЗИ и рентгену органов брюшной полости. Ферментный препарат: восполняет недостаток ферментов поджелудочной железы и жёлчи. Амилаза, липаза и протеаза помогают переваривать углеводы, жиры и белки и улучшают их всасывание. Компоненты жёлчи улучшают переваривание жиров и всасывание витаминов A, E, K, оказывают желчегонное действие. Гемицеллюлаза расщепляет растительную клетчатку и уменьшает газообразование.", "u": "med/festal.html", "d_en": "Pancreatic enzymes – for a heavy feeling after fatty/large meals. 1–2 coated tablets during or immediately after a meal, do not chew.", "d_fi": "Haimaentsyymit – raskaan olon hoitoon rasvaisen/runsaan aterian jälkeen. 1–2 päällystettyä tablettia aterian aikana tai heti sen jälkeen, ei saa pureskella."}, {"ru": "Эспумизан экстра", "en": "Espumisan extra (simethicone)", "fi": "Espumisan extra (simetikoni)", "x": "от вздутия", "x_en": "bloating", "x_fi": "ilmavaivat", "d": "Симетикон — от вздутия и газов. Пакетик с гранулами — высыпать на язык, проглотить; можно после еды и перед сном.", "ind": "• Метеоризм (повышенное газообразование и вздутие), в т.ч. после операций\n• Симптомы функциональной диспепсии, связанные с газами\n• Подготовка к УЗИ и рентгену органов брюшной полости и малого таза Ветрогонное средство. Симетикон снижает поверхностное натяжение пузырьков газа в кишечнике — пена разрушается, газ всасывается стенкой кишечника или выводится естественным путём. Препарат химически инертен, не всасывается и выводится в неизменном виде.", "u": "med/espumisan-extra.html", "d_en": "Simethicone – for bloating and wind. Sachet of granules – pour onto the tongue and swallow; can be taken after meals and at bedtime.", "d_fi": "Simetikoni – turvotukseen ja ilmavaivoihin. Rakeita sisältävä annospussi – kaada kielelle ja niele; voi ottaa aterian jälkeen ja ennen nukkumaanmenoa."}, {"ru": "Бифицин форте", "en": "Bificin forte (probiotic)", "fi": "Bificin forte (probiootti)", "x": "пробиотик", "x_en": "probiotic", "x_fi": "probiootti", "d": "Пробиотик (бифидобактерии) — при дисбактериозе, после антибиотиков, при диарее. Обычно 1 капсула в день во время еды.", "ind": " ", "u": "https://www.google.com/search?q=%D0%91%D0%B8%D1%84%D0%B8%D1%86%D0%B8%D0%BD%20%D1%84%D0%BE%D1%80%D1%82%D0%B5%20%D0%B8%D0%BD%D1%81%D1%82%D1%80%D1%83%D0%BA%D1%86%D0%B8%D1%8F%20%D0%BF%D0%BE%20%D0%BF%D1%80%D0%B8%D0%BC%D0%B5%D0%BD%D0%B5%D0%BD%D0%B8%D1%8E", "d_en": "Probiotic (bifidobacteria) – for gut flora imbalance, after antibiotics, for diarrhoea. Usually 1 capsule a day with a meal.", "d_fi": "Probiootti (bifidobakteerit) – suoliston bakteeritasapainon häiriöihin, antibioottikuurin jälkeen, ripuliin. Tavallisesti 1 kapseli päivässä aterian yhteydessä."}, {"ru": "Симбиотер Альфлорекс", "en": "Alflorex probiotic", "fi": "Alflorex-probiootti", "x": "пробиотик", "x_en": "probiotic", "x_fi": "probiootti", "d": "Пробиотик (бактерии Bifidobacterium 35624) — при вздутии и дискомфорте в кишечнике, синдроме раздражённого кишечника. 1 капсула в день.", "ind": "Поддержка здоровья кишечника и микрофлоры как дополнение к питанию. Штамм B. longum 35624 — естественный обитатель кишечника человека; производитель заявляет, что он доходит до кишечника живым и поддерживает собственную микрофлору. На других рынках (Symbiosys Alflorex) продукт позиционируется для людей с симптомами синдрома раздражённого кишечника — вздутием, болью, нарушениями стула.", "u": "med/alflorex-probiotic.html", "d_en": "Probiotic (Bifidobacterium 35624 bacteria) – for bloating and intestinal discomfort, irritable bowel syndrome. 1 capsule a day.", "d_fi": "Probiootti (Bifidobacterium 35624 -bakteeri) – turvotukseen ja vatsavaivoihin, ärtyvän suolen oireyhtymään. 1 kapseli päivässä."}, {"ru": "Урсосан форте 500 мг", "en": "Ursosan forte 500 mg (ursodeoxycholic acid)", "fi": "Ursosan forte 500 mg", "x": "для печени и желчи — по назначению врача", "x_en": "liver & bile — as prescribed", "x_fi": "maksa ja sappi — lääkärin ohjeen mukaan", "d": "Урсодезоксихолевая кислота — для печени и желчного (желчные камни, застой желчи, жировой гепатоз). Обычно вечером во время еды. Рецептурное: доза и длительность — только по назначению врача.", "ind": "• Неосложнённая желчнокаменная болезнь: билиарный сладж, растворение холестериновых камней при работающем желчном пузыре.\n• Хронические гепатиты (токсический, лекарственный и др.).\n• Холестатические болезни печени: первичный билиарный холангит/цирроз (без декомпенсации), первичный склерозирующий холангит, муковисцидоз.\n• Неалкогольная жировая болезнь печени, в т.ч. стеатогепатит; алкогольная болезнь печени.\n• Дискинезия желчевыводящих путей; билиарный рефлюкс-гастрит. Гепатопротектор: защищает клетки печени, усиливает желчеотток, снижает насыщенность желчи холестерином и постепенно растворяет холестериновые камни, связывает токсичные желчные кислоты, обладает иммуномодулирующим действием.", "u": "med/ursosan-forte-500-mg.html", "d_en": "Ursodeoxycholic acid – for the liver and gallbladder (gallstones, bile stasis, fatty liver). Usually in the evening with a meal. Prescription-only: dose and duration only as prescribed by a doctor.", "d_fi": "Ursodeoksikoolihappo – maksalle ja sappirakolle (sappikivet, sapen salpautuminen, rasvamaksa). Tavallisesti illalla aterian yhteydessä. Reseptilääke: annos ja hoidon kesto vain lääkärin määräyksen mukaan."}, {"ru": "Рабепразол", "en": "Rabeprazole", "fi": "Rabepratsoli", "x": "от изжоги, для желудка — по назначению врача", "x_en": "heartburn, stomach acid — as prescribed", "x_fi": "närästys — lääkärin ohjeen mukaan", "d": "Как омепразол — снижает выработку кислоты (изжога, ГЭРБ, язва). Обычно 1 таблетка утром. Вместе с Ультопом не принимать. Рецептурное: доза и длительность — только по назначению врача.", "ind": "• Активная язва желудка или анастомоза, язва двенадцатиперстной кишки.\n• Эрозивная ГЭРБ (рефлюкс-эзофагит) и её поддерживающее лечение, неэрозивная ГЭРБ (изжога).\n• Синдром Золлингера–Эллисона и другие состояния с избытком кислоты.\n• В сочетании с антибиотиками — уничтожение Helicobacter pylori при язвенной болезни. Ингибитор протонной помпы: блокирует выработку соляной кислоты клетками желудка, подавляя как базальную, так и стимулированную секрецию. Действие начинается в течение часа и сохраняется до 48 часов; полный эффект — примерно через 3 дня, после отмены кислотность восстанавливается за 1–2 дня.", "u": "med/rabeprazole.html", "d_en": "Like omeprazole — reduces acid production (heartburn, GERD, ulcer). Usually 1 tablet in the morning. Do not take together with Ultop. Prescription-only: dose and duration only as prescribed by a doctor.", "d_fi": "Kuten omepratsoli — vähentää mahahapon eritystä (närästys, refluksitauti, haava). Yleensä 1 tabletti aamulla. Ei yhdessä Ultopin kanssa. Reseptilääke: annos ja hoidon kesto vain lääkärin määräyksen mukaan."}], "where_fi": "Lääkekaappi 008 ”Kun sairastuu”, pieni alalaatikko"}, {"code": "008-10", "title": "Простуда, горло, кашель", "title_en": "Cold, throat & cough", "title_fi": "Flunssa, kurkku ja yskä", "zone": "Дом", "room": "Кухня", "room_en": "Kitchen", "room_fi": "Keittiö", "cab": "Аптека", "where": "Аптечка 008 «Когда заболел», ящик высокий", "where_en": "Medicine organizer 008 “When sick”, tall drawer", "items": [{"ru": "Терафлю (порошок)", "en": "Theraflu powder", "fi": "Theraflu-jauhe", "x": "от гриппа и простуды, жар и насморк", "x_en": "flu & cold: fever, runny nose", "x_fi": "flunssa: kuume, nuha", "d": "Парацетамол + фенилэфрин + фенирамин. От симптомов гриппа и простуды (жар, насморк, ломота). 1 пакетик растворить в горячей воде, до 3 раз в день, не дольше 5 дней. Не сочетать с другими средствами с парацетамолом. Может вызывать сонливость.", "ind": "Симптоматическое лечение ОРВИ и гриппа: повышенная температура, озноб, ломота в теле, головная и мышечная боль, насморк, заложенность носа, чихание. Комбинированное средство от симптомов простуды и гриппа. Парацетамол снижает температуру и обезболивает; фенилэфрин сужает сосуды носа и уменьшает заложенность; фенирамин — противоаллергический компонент, уменьшает насморк, чихание и слезотечение (обладает седативным действием); витамин C восполняет его потребность при простуде.", "u": "med/theraflu-powder.html", "d_en": "Paracetamol + phenylephrine + pheniramine. For flu and cold symptoms (fever, runny nose, aches). Dissolve 1 sachet in hot water, up to 3 times a day, no longer than 5 days. Do not combine with other paracetamol products. May cause drowsiness.", "d_fi": "Parasetamoli + fenyyliefriini + feniramiini. Influenssan ja flunssan oireisiin (kuume, nuha, särky). Liuota 1 annospussi kuumaan veteen, enintään 3 kertaa päivässä, enintään 5 päivän ajan. Ei yhdessä muiden parasetamolia sisältävien valmisteiden kanssa. Voi aiheuttaa uneliaisuutta."}, {"ru": "Тамифлю 75 мг", "en": "Tamiflu 75 mg", "fi": "Tamiflu 75 mg", "x": "противовирусное от гриппа — по назначению врача", "x_en": "flu antiviral — as prescribed", "x_fi": "influenssalääke — lääkärin ohjeen mukaan", "d": "Осельтамивир — противовирусное от гриппа. Начать в первые 48 часов болезни. Обычно 1 капсула 2 раза в день 5 дней. Рецептурное: доза и длительность — только по назначению врача.", "ind": "• Лечение гриппа у взрослых и детей старше 1 года\n• Профилактика гриппа после контакта с больным и в период эпидемии у взрослых, подростков и детей старше 1 года Противовирусное средство против гриппа A и B. В организме превращается в активный метаболит, который блокирует фермент вируса нейраминидазу — новые вирусные частицы не могут выйти из заражённых клеток, и инфекция не распространяется. При начале лечения в первые 40 часов болезнь короче примерно на 1,5 суток, снижается риск осложнений. Не заменяет вакцинацию и не мешает ей; защищает только во время приёма.", "u": "med/tamiflu-75-mg.html", "d_en": "Oseltamivir – antiviral for influenza. Start within the first 48 hours of illness. Usually 1 capsule twice a day for 5 days. Prescription-only: dose and duration only as prescribed by a doctor.", "d_fi": "Oseltamiviiri – viruslääke influenssaan. Aloita 48 tunnin kuluessa sairastumisesta. Tavallisesti 1 kapseli 2 kertaa päivässä 5 päivän ajan. Reseptilääke: annos ja hoidon kesto vain lääkärin määräyksen mukaan."}, {"ru": "Осельтамивир-Акрихин 75 мг", "en": "Oseltamivir 75 mg", "fi": "Oseltamiviiri 75 mg", "x": "противовирусное от гриппа — по назначению врача", "x_en": "flu antiviral — as prescribed", "x_fi": "influenssalääke — lääkärin ohjeen mukaan", "d": "То же, что Тамифлю (осельтамивир). Вместе с Тамифлю не принимать. Рецептурное: доза и длительность — только по назначению врача.", "ind": "• Лечение гриппа у взрослых и детей старше 1 года.\n• Профилактика гриппа у взрослых и подростков старше 12 лет из групп риска (воинские части, крупные коллективы, ослабленные больные).\n• Профилактика гриппа у детей старше 1 года.\nНа другие ОРВИ (не грипп) не действует и вакцинацию не заменяет. Противовирусное средство против гриппа. В организме превращается в активный метаболит, который блокирует фермент нейраминидазу вирусов гриппа A и B и мешает вирусу распространяться. Не мешает выработке иммунитета, в т.ч. после вакцинации.", "u": "med/oseltamivir-75-mg.html", "d_en": "The same as Tamiflu (oseltamivir). Do not take together with Tamiflu. Prescription-only: dose and duration only as prescribed by a doctor.", "d_fi": "Sama kuin Tamiflu (oseltamiviiri). Ei yhdessä Tamiflun kanssa. Reseptilääke: annos ja hoidon kesto vain lääkärin määräyksen mukaan."}, {"ru": "Амиксин 125 мг", "en": "Amixin 125 mg", "fi": "Amiksin 125 mg", "x": "противовирусное, иммуномодулятор", "x_en": "antiviral, immune support", "x_fi": "viruslääke", "d": "Тилорон — противовирусное и иммуномодулирующее средство при гриппе и ОРВИ. Схема приёма — по инструкции (обычно 1 таблетка в первые 2 дня, затем через день).", "ind": "Взрослым в составе комплексной терапии:\n• лечение гриппа и других ОРВИ;\n• профилактика гриппа и ОРВИ;\n• лечение герпетической инфекции. Индуктор интерферонов: стимулирует организм вырабатывать собственные интерфероны (альфа, бета, гамма, лямбда), максимум через 4–24 ч. Подавляет размножение вирусов в заражённых клетках, оказывает иммуномодулирующее действие. Период полувыведения около 48 ч, выводится в основном с калом.", "u": "med/amixin-125-mg.html", "d_en": "Tilorone – antiviral and immunomodulating agent for influenza and acute respiratory infections. Dosing as per the leaflet (usually 1 tablet on the first 2 days, then every other day).", "d_fi": "Tiloroni – viruslääke ja immuunivastetta muokkaava valmiste influenssaan ja hengitystieinfektioihin. Annostus pakkausselosteen mukaan (tavallisesti 1 tabletti 2 ensimmäisenä päivänä, sitten joka toinen päivä)."}, {"ru": "Burana 40 мг/мл, сироп", "en": "Burana 40 mg/ml oral suspension", "fi": "Burana 40 mg/ml oraalisuspensio", "x": "ибупрофен жидкий, детский; взбалтывать", "x_en": "liquid ibuprofen; shake well", "x_fi": "ibuprofeeni; ravista", "d": "Ибупрофен 40 мг в 1 мл, клубничная суспензия (детская форма, подходит и взрослым, кто не глотает таблетки). Взбалтывать. Доза по весу — по шприцу-дозатору в инструкции. Интервал не меньше 6 часов.", "ind": "• Дети до 12 лет: лёгкая и умеренная боль (мышечная, головная, зубная, при прорезывании зубов), лихорадка, в т.ч. после прививки.\n• Взрослые и дети старше 12 лет: также боль в спине, мигрень, невралгия, симптомы нетяжёлых воспалительных заболеваний суставов. Нестероидный противовоспалительный препарат (НПВП): уменьшает боль, снижает температуру, оказывает противовоспалительное действие.", "u": "med/burana-40-mg-ml-oral-suspension.html", "d_en": "Ibuprofen 40 mg in 1 ml, strawberry suspension (children's formulation, also suitable for adults who cannot swallow tablets). Shake well. Dose by body weight — using the dosing syringe as described in the leaflet. Interval at least 6 hours.", "d_fi": "Ibuprofeeni 40 mg/1 ml, mansikanmakuinen oraalisuspensio (lasten valmiste, sopii myös aikuisille, jotka eivät pysty nielemään tabletteja). Ravista. Annos painon mukaan annosteluruiskulla pakkausselosteen ohjeen mukaan. Annosväli vähintään 6 tuntia."}, {"ru": "Септолете тотал", "en": "Septolete total lozenges", "fi": "Septolete total -imeskelytabletit", "x": "рассасывать при боли в горле", "x_en": "lozenges for sore throat", "x_fi": "kurkkukipuun", "d": "Пастилки от боли в горле (бензидамин + цетилпиридиний). Рассасывать по 1 пастилке каждые 3–6 часов, не более 3 в сутки.", "ind": "Симптоматическое лечение воспалительных и инфекционных заболеваний горла и полости рта: боль в горле при фарингите, ларингите, тонзиллите; гингивит, стоматит; состояния до и после удаления зуба. Бензидамин — местное нестероидное противовоспалительное средство: уменьшает боль, отёк и покраснение, обладает лёгким обезболивающим (анестезирующим) действием. Цетилпиридиний — антисептик широкого спектра: действует на бактерии (особенно грамположительные), грибки и некоторые вирусы. В кровь всасывается лишь ничтожное количество бензидамина.", "u": "med/septolete-total-lozenges.html", "d_en": "Sore throat lozenges (benzydamine + cetylpyridinium). Dissolve 1 lozenge in the mouth every 3–6 hours, no more than 3 a day.", "d_fi": "Imeskelytabletit kurkkukipuun (bentsydamiini + setyylipyridinium). Imeskele 1 tabletti 3–6 tunnin välein, enintään 3 vuorokaudessa."}, {"ru": "АЦЦ лонг 600", "en": "ACC long 600 (acetylcysteine)", "fi": "ACC long 600 (asetyylikysteiini)", "x": "разжижает мокроту, шипучая", "x_en": "thins mucus, effervescent", "x_fi": "limaa irrottava poretabletti", "d": "Ацетилцистеин — разжижает густую мокроту при кашле. 1 шипучая таблетка в стакане воды 1 раз в день, лучше утром. Не принимать на ночь и вместе со средствами, подавляющими кашель.", "ind": "Заболевания, сопровождающиеся образованием вязкой, трудноотделяемой мокроты: • острый и хронический бронхит, обструктивный бронхит, трахеит, ларинготрахеит; • пневмония, абсцесс лёгкого, бронхоэктазы, бронхиолит, ХОБЛ, бронхиальная астма; • муковисцидоз; • острый и хронический синусит, средний отит. Муколитик: разрывает связи в молекулах мокроты, делая её менее вязкой и облегчая откашливание; действует и при гнойной мокроте. Обладает антиоксидантным действием и поддерживает синтез глутатиона. При длительном приёме уменьшает частоту и тяжесть обострений хронического бронхита и муковисцидоза.", "u": "med/acc-long-600.html", "d_en": "Acetylcysteine — thins thick phlegm in a cough. 1 effervescent tablet in a glass of water once a day, preferably in the morning. Do not take at night or together with cough suppressants.", "d_fi": "Asetyylikysteiini — ohentaa sitkeää limaa yskässä. 1 poretabletti lasilliseen vettä kerran päivässä, mieluiten aamulla. Ei illalla ennen nukkumaanmenoa eikä yhdessä yskänärsytystä hillitsevien lääkkeiden kanssa."}, {"ru": "Флуимуцил 600", "en": "Fluimucil 600", "fi": "Fluimucil 600", "x": "разжижает мокроту", "x_en": "thins mucus", "x_fi": "limaa irrottava", "d": "Ацетилцистеин, как АЦЦ. 1 шипучая таблетка 1 раз в день. Вместе с АЦЦ/Mucomyst не принимать.", "ind": "• Заболевания дыхательных путей с густой, трудно отделяемой мокротой: бронхит, трахеит, бронхиолит, пневмония, бронхоэктазы, муковисцидоз, эмфизема, ларинготрахеит\n• Синусит, гайморит, отит — для облегчения отхождения секрета\n• Удаление вязкого секрета после травм и операций Муколитик: разрывает связи в молекулах слизи, разжижает мокроту и облегчает её откашливание (в т.ч. гнойную). Уменьшает прилипание бактерий к слизистой бронхов. Обладает антиоксидантным действием (поддерживает синтез глутатиона) — поэтому используется и как противоядие при отравлении парацетамолом.", "u": "med/fluimucil-600.html", "d_en": "Acetylcysteine, like ACC. 1 effervescent tablet once a day. Do not take together with ACC/Mucomyst.", "d_fi": "Asetyylikysteiini, kuten ACC. 1 poretabletti kerran päivässä. Ei yhdessä ACC:n/Mucomystin kanssa."}, {"ru": "Mucomyst 200 мг", "en": "Mucomyst 200 mg", "fi": "Mucomyst 200 mg", "x": "разжижает мокроту", "x_en": "thins mucus", "x_fi": "limaa irrottava", "d": "Ацетилцистеин 200 мг (Финляндия), шипучие. Обычно 1 таблетка 3 раза в день. Не вместе с АЦЦ/Флуимуцилом.", "ind": "Разжижение густой мокроты при заболеваниях дыхательных путей (бронхит, простуда с вязкой мокротой и т.п.). Муколитик: разжижает густую, вязкую мокроту в дыхательных путях и облегчает её откашливание.", "u": "med/mucomyst-200-mg.html", "d_en": "Acetylcysteine 200 mg (Finland), effervescent. Usually 1 tablet 3 times a day. Not together with ACC/Fluimucil.", "d_fi": "Asetyylikysteiini 200 mg (Suomi), poretabletit. Yleensä 1 tabletti 3 kertaa päivässä. Ei yhdessä ACC:n/Fluimucilin kanssa."}, {"ru": "Лазолван", "en": "Lasolvan (ambroxol)", "fi": "Lasolvan (ambroksoli)", "x": "от кашля с мокротой", "x_en": "wet cough", "x_fi": "limaiseen yskään", "d": "Амброксол — при влажном кашле, помогает отхождению мокроты. Дозировка — по инструкции на упаковке (сироп/таблетки/раствор).", "ind": "Острые и хронические заболевания бронхов и лёгких с вязкой мокротой: острый и хронический бронхит, пневмония, ХОБЛ, бронхиальная астма с трудноотделяемой мокротой, бронхоэктатическая болезнь. Муколитик и отхаркивающее: разжижает мокроту, усиливает выработку сурфактанта в лёгких и работу ресничек бронхов, поэтому мокрота легче откашливается. Период полувыведения около 10 ч.", "u": "med/lasolvan.html", "d_en": "Ambroxol — for wet (productive) cough, helps bring up phlegm. Dosage — as per the instructions on the package (syrup/tablets/solution).", "d_fi": "Ambroksoli — limaiseen yskään, helpottaa liman irtoamista. Annostus pakkauksen ohjeen mukaan (siirappi/tabletit/liuos)."}, {"ru": "Сальбутамол, ингалятор", "en": "Salbutamol inhaler", "fi": "Salbutamoli-inhalaattori", "x": "при одышке, приступе", "x_en": "for breathlessness", "x_fi": "hengenahdistukseen", "d": "Быстро расширяет бронхи — при приступе одышки, свистящем дыхании. 1–2 вдоха, эффект через несколько минут. Если нужен чаще 3–4 раз в день — к врачу.", "ind": "Профилактика и купирование бронхоспазма при бронхиальной астме, ХОБЛ, хроническом бронхите, эмфиземе лёгких. Селективный β2-адреномиметик короткого действия: расслабляет мускулатуру бронхов, снимает и предупреждает бронхоспазм. Действие начинается примерно через 5 минут и длится 4–6 часов.", "u": "med/salbutamol-inhaler.html", "d_en": "Quickly opens the airways — for an attack of shortness of breath, wheezing. 1–2 puffs, takes effect within a few minutes. If needed more often than 3–4 times a day — see a doctor.", "d_fi": "Avaa nopeasti keuhkoputket — hengenahdistuskohtaukseen ja vinkuvaan hengitykseen. 1–2 inhalaatiota, vaikutus muutamassa minuutissa. Jos tarvitset sitä useammin kuin 3–4 kertaa päivässä, hakeudu lääkäriin."}, {"ru": "Симбикорт 160/4,5", "en": "Symbicort 160/4.5", "fi": "Symbicort 160/4,5", "x": "ингалятор — по назначению врача", "x_en": "inhaler — as prescribed", "x_fi": "inhalaattori — lääkärin ohjeen mukaan", "d": "Будесонид + формотерол — ингалятор для постоянного лечения астмы/ХОБЛ. После вдоха
