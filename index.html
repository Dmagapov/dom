<style>
/* Layout: one phone-first column; sticky search on top; zones → rooms → boxes; box codes styled as printed label tape */
:root{
  --bg:#f6f5f1; --surface:#ffffff; --ink:#1d1f1c; --muted:#6b6e66; --line:#e2e0d8;
  --tape:#f3c623; --tape-ink:#141414; --accent:#2f5d50; --accent-soft:#e3ece8;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141613; --surface:#1d201c; --ink:#ecebe5; --muted:#9a9d94; --line:#2e322d;
  --tape:#e8bb1c; --tape-ink:#141414; --accent:#8cc5b2; --accent-soft:#22302b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141613; --surface:#1d201c; --ink:#ecebe5; --muted:#9a9d94; --line:#2e322d;
  --tape:#e8bb1c; --tape-ink:#141414; --accent:#8cc5b2; --accent-soft:#22302b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
header h1{font-size:1.9rem;font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}
header p{margin:.2rem 0 0;color:var(--muted);font-size:.95rem}
.searchbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;margin-top:8px}
.field{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:0 14px}
.field:focus-within{border-color:var(--accent)}
.field svg{flex:none;color:var(--muted)}
#q{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:1.1rem;padding:14px 0;outline:none}
#clear{border:0;background:var(--accent-soft);color:var(--accent);font:inherit;font-size:.85rem;border-radius:999px;padding:4px 10px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.9rem;border-radius:999px;padding:5px 12px;cursor:pointer}
.chip:focus-visible,#clear:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:18px}
.zone{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink)}
.zone b{font-weight:600}
.zone span{font-size:.8rem;color:var(--muted)}
.zone.empty{opacity:.6}
h2{font-size:1.25rem;margin:28px 0 4px}
h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:18px 0 8px}
.boxes{display:flex;flex-direction:column;gap:10px}
details.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
details.box summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:flex-start;padding:12px 14px}
details.box summary::-webkit-details-marker{display:none}
.tape{flex:none;font-family:var(--f-mono);font-weight:700;font-size:.85rem;background:var(--tape);color:var(--tape-ink);padding:3px 8px;border-radius:2px;letter-spacing:.04em;margin-top:2px}
.bt{min-width:0;flex:1}
.bt b{display:block;font-weight:600}
.bt small{display:block;color:var(--muted);font-size:.85rem}
.cnt{flex:none;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:3px}
.inner{border-top:1px solid var(--line);padding:10px 14px 14px;display:flex;flex-direction:column;gap:10px}
.doc{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--bg);text-decoration:none;font-weight:600;font-size:.92rem;border-radius:10px;padding:8px 12px}
ul.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.items li{padding:7px 0;border-bottom:1px dashed var(--line);min-width:0}
ul.items li:last-child{border-bottom:0}
.ru{font-weight:500}
.en{color:var(--muted);font-size:.88rem}
.x{font-size:.85rem;color:var(--muted)}
.ru a{color:var(--accent)}
.results{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.res{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
.path .tape{font-size:.75rem;margin:0}
.res a.open{color:var(--accent);font-weight:600;font-size:.9rem;text-decoration:none}
.pin{display:flex;flex-direction:column;gap:8px;padding:6px 0}
.pin p{margin:0;color:var(--muted);font-size:.9rem}
.pin form{display:flex;gap:8px}
.pin input{flex:1;min-width:0;font:inherit;font-size:1.1rem;letter-spacing:.3em;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.pin button,.relock{font:inherit;font-weight:600;padding:10px 16px;border-radius:10px;border:0;background:var(--accent);color:#fff;cursor:pointer}
.relock{background:none;color:var(--accent);padding:0;font-weight:500;font-size:.85rem;text-align:left}
.pin .err{color:#c0392b;font-size:.85rem;min-height:1em}
mark{background:var(--tape);color:var(--tape-ink);border-radius:2px;padding:0 1px}
.none{color:var(--muted);padding:12px 0}
footer{margin-top:32px;font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
footer a{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){details.box[open] .inner{animation:fade .18s ease-out}@keyframes fade{from{opacity:.4}to{opacity:1}}}
</style>

<div class="wrap">
  <header>
    <h1>Поиск во всём доме</h1>
    <p>Что где лежит · Mitä missä · Where things are</p>

  <div class="searchbar">

  </footer>
</div>

const ZONES=["Дом","Гараж","Склад","Котельная","Теплица"];
const EXAMPLES=["соль","батарейки","клей","рис","кофемашина","корм"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s??"").toLowerCase().replace(/ё/g,"е").replace(/ä/g,"a").replace(/ö/g,"o");
$("#master").href=DATA.master;

function boxHTML(b){
  const items=b.items.map(it=>`<li><div class="ru">${it.doc?`<a href="${esc(it.doc)}" target="_blank" rel="noopener">${esc(it.ru)}</a>`:esc(it.ru)}</div>${it.en?`<div class="en">${esc(it.en)}</div>`:""}${it.x?`<div class="x">${esc(it.x)}</div>`:""}</li>`).join("");
  return `<details class="box" id="b${b.code}"><summary><span class="tape">${b.code}</span><span class="bt"><b>${esc(b.title)}</b>${b.where?`<small>${esc(b.where)}</small>`:""}</span><span class="cnt">${b.items.length}</span></summary>
  <div class="inner">${b.doc?`<a class="doc" href="${esc(b.doc)}" target="_blank" rel="noopener">${esc(b.doclabel||"Открыть опись")} →</a>`:""}<ul class="items">${items}</ul></div></details>`;
}
function browse(){
  let h=`<div class="zones">`+ZONES.map(z=>{const n=DATA.boxes.filter(b=>b.zone===z).length;return n?`<a class="zone" href="#z-${ZONES.indexOf(z)}"><b>${z}</b><span>${n} ${n===1?"место":n<5?"места":"мест"}</span></a>`:`<div class="zone empty"><b>${z}</b><span>пока пусто</span></div>`}).join("")+`<a class="zone" href="#docs"><b>Документы 🔒</b><span>${UNLOCKED?DOCS.length+" папки":"по PIN-коду"}</span></a></div>`;
  ZONES.forEach((z,zi)=>{const bs=DATA.boxes.filter(b=>b.zone===z);if(!bs.length)return;
    h+=`<h2 id="z-${zi}">${z}</h2>`;
    [...new Set(bs.map(b=>b.room))].forEach(r=>{h+=`<h3>${esc(r)}</h3><div class="boxes">${bs.filter(b=>b.room===r).map(boxHTML).join("")}</div>`});
  });
  h+=`<h2 id="docs">Документы</h2>`;
  if(UNLOCKED){h+=`<div class="boxes">${DOCS.map(boxHTML).join("")}</div><button class="relock" type="button" data-relock>🔒 Закрыть документы</button>`}
  else h+=`<div class="box"><div class="inner"><div class="pin"><p>Раздел закрыт. Введите PIN-код.</p><form data-unlock><input type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" aria-label="PIN-код"><button type="submit">Открыть</button></form><div class="err" aria-live="polite"></div></div></div></div>`;
  $("#browse").innerHTML=h;
}
let INDEX=[],UNLOCKED=null;
function buildIndex(){INDEX=[];DATA.boxes.concat(DOCS).forEach(b=>{
  INDEX.push({b,it:null,text:norm([b.code,b.title,b.where,b.room,b.zone].join(" "))});
  b.items.forEach(it=>INDEX.push({b,it,text:norm([it.ru,it.en,it.x].join(" "))}));
});}
buildIndex();
function hl(s,terms){let out=esc(s);terms.forEach(t=>{if(!t)return;const re=new RegExp("("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");out=out.replace(re,"<mark>$1</mark>")});return out}
function search(q){
  const terms=norm(q).split(/\s+/).filter(Boolean);
  const hits=INDEX.filter(e=>terms.every(t=>e.text.includes(t)));
  hits.sort((a,b)=>(a.it?1:0)-(b.it?1:0));
  const R=$("#results");
  if(!hits.length){R.innerHTML=`<div class="none">Ничего не нашлось по «${esc(q)}». Попробуйте другое слово или по-английски.</div>`;return}
  R.innerHTML=`<div class="none" style="padding:4px 0">Найдено: ${hits.length}</div>`+hits.slice(0,80).map(({b,it})=>{
    const path=`<div class="path"><span>${esc(b.zone)}${b.room?" › "+esc(b.room):""} ›</span><span class="tape">${b.code}</span><span>${esc(b.title)}</span></div>`;
    if(b.zone==="Документы"&&!UNLOCKED){const lk=`<a class="open" href="#docs" data-lockopen="${b.code}">Открыть — нужен PIN 🔒</a>`;
      return `<div class="res"><div class="ru">${hl(it?it.ru:b.title,terms)}</div>${it&&it.x?`<div class="x">${hl(it.x,terms)}</div>`:""}${path}${lk}</div>`}
    const link=it&&it.doc?it.doc:b.doc;
    if(!it) return `<div class="res"><div class="ru">${hl(b.title,terms)}</div>${b.where?`<div class="x">${hl(b.where,terms)}</div>`:""}${path}${link?`<a class="open" href="${esc(link)}" target="_blank" rel="noopener">${esc(b.doclabel||"Открыть")} →</a>`:`<a class="open" href="#b${b.code}" data-box="${b.code}">Показать ящик →</a>`}</div>`;
    return `<div class="res"><div class="ru">${hl(it.ru,terms)}</div>${it.en?`<div class="en">${hl(it.en,terms)}</div>`:""}${it.x?`<div class="x">${hl(it.x,terms)}</div>`:""}${path}${link?`<a class="open" href="${esc(link)}" target="_blank" rel="noopener">${it.doc?"Инструкция":esc(b.doclabel||"Опись")} →</a>`:""}</div>`;
  }).join("");
}
function update(){const q=$("#q").value.trim();$("#clear").hidden=!q;$("#results").hidden=!q;$("#browse").hidden=!!q;if(q)search(q)}
$("#q").addEventListener("input",update);
$("#clear").addEventListener("click",()=>{$("#q").value="";update();$("#q").focus()});
$("#chips").innerHTML=EXAMPLES.map(e=>`<button class="chip" type="button">${e}</button>`).join("");
$("#chips").addEventListener("click",e=>{if(e.target.matches(".chip")){$("#q").value=e.target.textContent;update()}});
document.addEventListener("click",e=>{const a=e.target.closest("[data-box]");if(a){e.preventDefault();$("#q").value="";update();const d=document.getElementById("b"+a.dataset.box);d.open=true;d.scrollIntoView({behavior:"smooth",block:"start"})}});
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pin){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(LOCKED.salt),iterations:LOCKED.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(LOCKED.iv)},key,b64(LOCKED.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
let PENDING=null;
function applyPrivate(p){UNLOCKED=p;DOCS.forEach(b=>{b.doc=p.links[b.code]});buildIndex();browse()}
function relock(){UNLOCKED=null;DOCS.forEach(b=>{delete b.doc});try{sessionStorage.removeItem("dom-pin")}catch(e){}buildIndex();browse();update()}
document.addEventListener("submit",async e=>{const f=e.target.closest("[data-unlock]");if(!f)return;e.preventDefault();
  const pin=f.querySelector("input").value.trim(),err=f.parentNode.querySelector(".err");if(!pin)return;
  err.textContent="Проверяю…";
  try{const p=await decrypt(pin);applyPrivate(p);try{sessionStorage.setItem("dom-pin",pin)}catch(_){}
    update();const t=PENDING&&document.getElementById("b"+PENDING);if(t){t.open=true;t.scrollIntoView({block:"start"})}else document.getElementById("docs").scrollIntoView({block:"start"});PENDING=null}
  catch(_){err.textContent="Неверный PIN-код";f.querySelector("input").select()}});
document.addEventListener("click",e=>{if(e.target.closest("[data-relock]"))relock();
  const a=e.target.closest("[data-lockopen]");if(a){e.preventDefault();PENDING=a.dataset.lockopen;$("#q").value="";update();const d=document.getElementById("docs");d.scrollIntoView({block:"start"});const i=document.querySelector("[data-unlock] input");if(i)i.focus({preventScroll:true})}});
browse();
(async()=>{let pin=null;try{pin=sessionStorage.getItem("dom-pin")}catch(e){}if(pin){try{applyPrivate(await decrypt(pin));update()}catch(e){}}})();
</script>
