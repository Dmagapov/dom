ия: валсартан блокирует рецепторы ангиотензина II и расслабляет сосуды; индапамид — мягкий мочегонный, который также снижает жёсткость артерий и сопротивление сосудов.", "u": "med/valsacor-inda.html"}, {"ru": "Арифон ретард 1,5 мг", "en": "Arifon retard 1.5 mg (indapamide)", "fi": "Arifon retard 1,5 mg (indapamidi)", "x": "по назначению врача", "x_en": "as prescribed", "x_fi": "lääkärin ohjeen mukaan", "d": "Индапамид — мочегонное от давления. 1 таблетка утром, не делить. Рецептурное: доза и длительность — только по назначению врача.", "ind": "Артериальная гипертензия. Тиазидоподобный диуретик длительного действия: усиливает выведение натрия и хлора, снижает сосудистое сопротивление и повышает эластичность артерий, уменьшает гипертрофию левого желудочка. Не влияет на обмен жиров и углеводов. Период полувыведения 14–24 ч, стабильная концентрация — через 7 дней.", "u": "med/arifon-retard-1-5-mg.html"}, {"ru": "Беталок ЗОК 50 мг", "en": "Betaloc ZOK 50 mg (metoprolol)", "fi": "Betaloc ZOK 50 mg (metoprololi)", "x": "по назначению врача", "x_en": "as prescribed", "x_fi": "lääkärin ohjeen mukaan", "d": "Метопролол — снижает пульс и давление, при стенокардии и аритмии. Не отменять резко. Рецептурное: доза и длительность — только по назначению врача.", "ind": "• Артериальная гипертония.\n• Стенокардия.\n• Хроническая сердечная недостаточность со сниженной функцией левого желудочка (в дополнение к основной терапии).\n• Снижение риска смерти и повторного инфаркта после инфаркта миокарда.\n• Нарушения ритма: наджелудочковая тахикардия, урежение пульса при мерцательной аритмии, желудочковые экстрасистолы.\n• Функциональные нарушения работы сердца с тахикардией.\n• Профилактика приступов мигрени. Селективный бета1-адреноблокатор: защищает сердце от действия адреналина, урежает пульс, снижает силу сокращений и артериальное давление. Благодаря форме замедленного высвобождения концентрация в крови равномерна и эффект держится более 24 ч при приёме 1 раз в сутки.", "u": "med/betaloc-zok-50-mg.html"}, {"ru": "Дилтиазем 90 мг", "en": "Diltiazem 90 mg", "fi": "Diltiatseemi 90 mg", "x": "по назначению врача", "x_en": "as prescribed", "x_fi": "lääkärin ohjeen mukaan", "d": "Снижает давление и пульс, при стенокардии и аритмии. Таблетки пролонгированные — не разжёвывать. Рецептурное: доза и длительность — только по назначению врача.", "ind": "• Артериальная гипертензия.\n• Профилактика приступов стенокардии, в том числе вазоспастической (Принцметала).\n• Профилактика наджелудочковых аритмий (пароксизмальная тахикардия, фибрилляция и трепетание предсердий). Блокатор медленных кальциевых каналов: расширяет коронарные и периферические артерии, снижает давление, урежает пульс, замедляет проводимость в сердце (противоаритмический эффект) и уменьшает потребность сердца в кислороде — поэтому помогает при стенокардии. Полный эффект на давление развивается примерно за 2 недели; привыкания нет. Еда усиливает всасывание на 20–30%.", "u": "med/diltiazem-90-mg.html"}, {"ru": "Детралекс 1000 мг", "en": "Detralex 1000 mg", "fi": "Detralex 1000 mg", "x": "для вен, от тяжести в ногах", "x_en": "for veins, heavy legs", "x_fi": "laskimoille", "d": "Диосмин + гесперидин — для вен: тяжесть и отёки ног, варикоз, геморрой. Обычно 1 таблетка в день во время еды, курсами.", "ind": "• Хроническая венозная недостаточность (варикоз) и её симптомы: боль, тяжесть, отёки, усталость ног, ночные судороги; трофические изменения кожи, венозные язвы. • Острый и хронический геморрой. Венотонизирующее и ангиопротекторное средство: уменьшает растяжимость вен и застой крови в них, снижает проницаемость и повышает прочность капилляров, улучшает лимфоотток. Оптимальный эффект — при дозе 1000 мг в сутки. Период полувыведения около 11 часов.", "u": "med/detralex-1000-mg.html"}, {"ru": "Карведилол-Тева 12,5 мг", "en": "Carvedilol-Teva 12.5 mg", "fi": "Karvediloli-Teva 12,5 mg", "x": "по назначению врача", "x_en": "as prescribed", "x_fi": "lääkärin ohjeen mukaan", "d": "Карведилол — снижает давление и пульс, при сердечной недостаточности. Принимать во время еды. Не сочетать с Беталоком без указания врача. Рецептурное: доза и длительность — только по назначению врача.", "ind": "• Артериальная гипертензия (отдельно или с другими препаратами)\n• Профилактика приступов стабильной стенокардии\n• Хроническая сердечная недостаточность II–III ФК (вместе с диуретиками, дигоксином, ингибиторами АПФ) Альфа- и бета-адреноблокатор: замедляет пульс, снижает нагрузку на сердце и расширяет сосуды, что снижает давление. При сердечной недостаточности улучшает работу левого желудочка. Максимальный эффект на давление и пульс — через 1–2 часа после приёма.", "u": "med/carvedilol-teva-12-5-mg.html"}, {"ru": "Тромбо АСС 50 мг", "en": "Thrombo ASS 50 mg (aspirin)", "fi": "Thrombo ASS 50 mg (asetyylisalisyylihappo)", "x": "разжижение крови — по назначению врача", "x_en": "blood thinner — as prescribed", "x_fi": "verenohennus — lääkärin ohjeen mukaan", "d": "Аспирин в малой дозе — для профилактики тромбов, инфаркта, инсульта. 1 таблетка в день после еды. Повышает кровоточивость. Рецептурное: доза и длительность — только по назначению врача.", "ind": "• Профилактика инфаркта миокарда при факторах риска (диабет, повышенный холестерин, гипертония, ожирение, курение, пожилой возраст) и профилактика повторного инфаркта.\n• Стабильная и нестабильная стенокардия.\n• Профилактика инсульта, в т.ч. после преходящих нарушений мозгового кровообращения.\n• Профилактика тромбоэмболий после операций на сосудах (шунтирование, стентирование, ангиопластика, эндартерэктомия).\n• Профилактика тромбоза глубоких вен и ТЭЛА (в т.ч. при длительной неподвижности после операций). Антиагрегант: в малых дозах необратимо блокирует фермент ЦОГ-1 в тромбоцитах, снижая образование тромбоксана и склеивание тромбоцитов, то есть уменьшает риск тромбов. Эффект после одной дозы сохраняется около 7 суток. Кишечнорастворимая оболочка уменьшает раздражение желудка.", "u": "med/thrombo-ass-50-mg.html"}]}, {"code": "011",
