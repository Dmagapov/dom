<style>
/* Layout: one phone-first column; sticky search on top; zones → rooms → boxes; box codes styled as printed label tape */
:root{
  --bg:#f6f5f1; --surface:#ffffff; --ink:#1d1f1c; --muted:#6b6e66; --line:#e2e0d8;
  --tape:#f3c623; --tape-ink:#141414; --accent:#2f5d50; --accent-soft:#e3ece8;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141613; --surface:#1d201c; --ink:#ecebe5; --muted:#9a9d94; --line:#2e322d;
  --tape:#e8bb1c; --tape-ink:#141414; --accent:#8cc5b2; --accent-soft:#22302b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141613; --surface:#1d201c; --ink:#ecebe5; --muted:#9a9d94; --line:#2e322d;
  --tape:#e8bb1c; --tape-ink:#141414; --accent:#8cc5b2; --accent-soft:#22302b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
header h1{font-size:1.9rem;font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}
header p{margin:.2rem 0 0;color:var(--muted);font-size:.95rem}
.searchbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;margin-top:8px}
.field{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:0 14px}
.field:focus-within{border-color:var(--accent)}
.field svg{flex:none;color:var(--muted)}
#q{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:1.1rem;padding:14px 0;outline:none}
#clear{border:0;background:var(--accent-soft);color:var(--accent);font:inherit;font-size:.85rem;border-radius:999px;padding:4px 10px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.9rem;border-radius:999px;padding:5px 12px;cursor:pointer}
.chip:focus-visible,#clear:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:18px}
.zone{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink)}
.zone b{font-weight:600}
.zone span{font-size:.8rem;color:var(--muted)}
.zone.empty{opacity:.6}
h2{font-size:1.25rem;margin:28px 0 4px}
h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:18px 0 8px}
.boxes{display:flex;flex-direction:column;gap:10px}
details.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
details.box>summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:flex-start;padding:12px 14px}
details.box>summary::-webkit-details-marker{display:none}
.tape{flex:none;font-family:var(--f-mono);font-weight:700;font-size:.85rem;background:var(--tape);color:var(--tape-ink);padding:3px 8px;border-radius:2px;letter-spacing:.04em;margin-top:2px}
.bt{min-width:0;flex:1}
.bt b{display:block;font-weight:600}
.bt small{display:block;color:var(--muted);font-size:.85rem}
.cnt{flex:none;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:3px}
.inner{border-top:1px solid var(--line);padding:10px 14px 14px;display:flex;flex-direction:column;gap:10px}
.doc{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--bg);text-decoration:none;font-weight:600;font-size:.92rem;border-radius:10px;padding:8px 12px}
ul.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.items li{padding:7px 0;border-bottom:1px dashed var(--line);min-width:0}
ul.items li:last-child{border-bottom:0}
.ru{font-weight:500}
.en{color:var(--muted);font-size:.88rem}
.x{font-size:.85rem;color:var(--muted)}
.ru a{color:var(--accent)}
.results{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.res{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
.path .tape{font-size:.75rem;margin:0}
.res a.open{color:var(--accent);font-weight:600;font-size:.9rem;text-decoration:none}
.pin{display:flex;flex-direction:column;gap:8px;padding:6px 0}
.pin p{margin:0;color:var(--muted);font-size:.9rem}
.pin form{display:flex;gap:8px}
.pin input{flex:1;min-width:0;font:inherit;font-size:1.1rem;letter-spacing:.3em;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.pin button,.relock{font:inherit;font-weight:600;padding:10px 16px;border-radius:10px;border:0;background:var(--accent);color:#fff;cursor:pointer}
.relock{background:none;color:var(--accent);padding:0;font-weight:500;font-size:.85rem;text-align:left}
.pin .err{color:#c0392b;font-size:.85rem;min-height:1em}
mark{background:var(--tape);color:var(--tape-ink);border-radius:2px;padding:0 1px}
.none{color:var(--muted);padding:12px 0}
footer{margin-top:32px;font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
footer a{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){details.box[open] .inner{animation:fade .18s ease-out}@keyframes fade{from{opacity:.4}to{opacity:1}}}
details.box,h2{scroll-margin-top:150px}
.l2{color:var(--muted);font-size:.86rem;line-height:1.35}
.l3{color:var(--muted);font-size:.78rem;line-height:1.3;opacity:.85}
.bt .l2{display:block}
.zone .l2{font-size:.75rem}
h2 .l2,h3 .l2{font-weight:400;font-size:.8rem;text-transform:none;letter-spacing:0;margin-left:6px}
.en{font-weight:500;color:var(--ink);font-size:1rem}
input[type=search]::-webkit-search-cancel-button{display:none}
.en a{color:var(--accent)}
details.med summary{list-style:none;cursor:pointer}details.med summary::-webkit-details-marker{display:none}
.instr{display:inline-block;margin-top:8px;font-weight:600;color:var(--accent)}
.more{color:var(--accent);font-size:.85rem;font-weight:600}
.desc{margin:6px 0 2px;padding:8px 10px;background:var(--accent-soft);border-radius:8px;font-size:.9rem;line-height:1.45}
</style>

<div class="wrap">
  <header>
    <h1>Поиск во всём доме</h1>
    <p>Find anything in the house · Etsi koko talosta</p>
  </header>
  <div class="searchbar">
    <label class="field" for="q">

    <div class="chips" id="chips"></div>
  </div>
  <div id="results" class="results" hidden></div>
  <div id="browse"></div>
  <footer>
    <span>Каждый ящик подписан номером, как на этикетке. Нажмите на ящик — увидите, что внутри; на лекарство — описание.</span>
    <span class="l3">Every box has a number like on its label · Jokaisessa laatikossa on numero kuten tarrassa</span>
  </footer>
</div>

 hood, 65 cm", "fi": "Falmec Mirabilia LED -saarekeliesituuletin, 65 cm", "x": "код CJRI65.E50P2#ZZZI431F, 280 Вт, 2016", "x_en": "code CJRI65.E50P2#ZZZI431F, 280 W, 2016", "x_fi": "koodi CJRI65.E50P2#ZZZI431F", "d": "Кнопки: ⏻ вкл/выкл; + / − скорость 1–4 (4 — интенсив, сама вернётся на 3); ☀ свет (удержание 3 с — фоновая подсветка); таймер — выкл. через 15 мин. Постоянный красный при выключенном моторе — пора мыть жировые фильтры (≈ каждые 30 ч работы, в посудомойке ≤55 °C); сброс — удержание кнопки 3 с.", "u": "man/falmec-mirabilia.html"}, {"ru": "Мусорное ведро с датчиком Fromm & Starck STAR_BIN_40", "en": "Fromm & Starck automatic sensor bin STAR_BIN_40", "fi": "Fromm & Starck anturiroska-astia STAR_BIN_40", "x": "кухня; батарейки 4×AA", "x_en": "kitchen; 4×AA batteries", "x_fi": "keittiö; 4×AA paristot", "u": "man/fromm-starck-bin-40.html"}], "title_en": "Kitchen appliances", "title_fi": "Keittiökoneet", "room_en": "Kitchen", "room_fi": "Keittiö"}, {"code": "010", "title": "Между аптечками", "title_en": "Middle shelf", "title_fi": "Välihylly", "zone": "Дом", "room": "Кухня", "room_en": "Kitchen", "room_fi": "Keittiö", "cab": "Аптека", "where": "Полка в шкафчике между аптечками 008 и 009", "where_en": "Cabinet shelf, between organizers 008 and 009", "items": [{"ru": "Дюфалак, большая бутылка", "en": "Duphalac, large bottle (lactulose)", "fi": "Duphalac, iso pullo (laktuloosi)", "x": "мягкое слабительное (лактулоза)", "x_en": "mild laxative (lactulose)", "x_fi": "mieto ulostuslääke", "d": "Лактулоза (сироп) — мягкое слабительное при запоре. Обычно 15–45 мл утром во время завтрака. Эффект через 1–2 дня.", "ind": "• Запор, регуляция работы кишечника.\n• Размягчение стула по медицинским причинам: геморрой, после операций на толстой кишке и в области заднего прохода.\n• Печёночная энцефалопатия (лечение и профилактика прекомы/комы) у взрослых. Осмотическое слабительное: в толстой кишке лактулоза расщепляется бактериями до органических кислот, они удерживают воду, увеличивают объём содержимого и мягко стимулируют перистальтику. Практически не всасывается. Работает и как пребиотик — поддерживает рост бифидо- и лактобактерий. При печёночной энцефалопатии снижает образование и всасывание аммиака.", "u": "med/duphalac-large-bottle.html"}, {"ru": "R-липоевая кислота (Life Extension)", "en": "Super R-Lipoic Acid (Life Extension)", "fi": "R-lipoiinihappo (Life Extension)", "x": "добавка, альфа-липоевая кислота", "x_en": "supplement, alpha-lipoic acid", "x_fi": "ravintolisä", "d": "R-форма альфа-липоевой кислоты (БАД, США). Аналог Берлитиона/Тиоктацида — вместе не дублировать.", "ind": "Как пищевая добавка для поддержки антиоксидантной защиты и клеточного энергообмена. Заявления не оценивались FDA; продукт не предназначен для диагностики, лечения или профилактики заболеваний. R-липоевая кислота — природная («активная») форма альфа-липоевой кислоты. Производитель описывает её как антиоксидант, поддерживающий работу митохондрий, выработку энергии в клетках и защиту от окислительного стресса.", "u": "med/super-r-lipoic-acid.html"}, {"ru": "Bethover B12 Vahva", "en": "Bethover B12 Vahva", "fi": "Bethover B12 Vahva", "x": "B12 + фолиевая кислота + B1, B6", "x_en": "B12 + folic acid + B1, B6", "x_fi": "B12 + foolihappo", "d": "B12 1,3 мг + фолиевая кислота + B1, B3, B6, биотин. Жевательные таблетки со вкусом малины-лимона. 1 таблетка в день.", "ind": " ", "u": "https://www.google.com/search?q=Bethover%20B12%20Vahva%20pakkausseloste"}, {"ru": "Тантум Верде, спрей", "en": "Tantum Verde spray", "fi": "Tantum Verde -suihke", "x": "спрей для горла", "x_en": "throat spray", "x_fi": "kurkkusuihke", "d": "Бензидамин — спрей от боли и воспаления в горле и во рту. 4–8 впрыскиваний 2–6 раз в день.", "ind": "Симптоматическое лечение раздражения и воспаления ротоглотки: • боль в горле при фарингите; • гингивит, стоматит; • в стоматологии — после удаления зуба и для профилактики. Бензидамин — нестероидный противовоспалительный препарат местного действия: уменьшает воспаление и отёк, обезболивает и оказывает местноанестезирующий эффект. Подавляет выработку воспалительных медиаторов (ФНО-α, ИЛ-1β) и стабилизирует клеточные мембраны. Через слизистую всасывается мало, системного действия практически нет; выводится в основном с мочой.", "u": "med/tantum-verde-spray.html"}, {"ru": "Палочки для чистки IQOS (30 шт.)", "en": "IQOS cleaning sticks (30)", "fi": "IQOS-puhdistustikut (30)", "x": "для чистки держателя IQOS", "x_en": "for cleaning the IQOS holder", "x_fi": "IQOS-pidikkeen puhdistukseen", "d": "Чистящие палочки со спиртовой пропиткой для держателя IQOS."}, {"ru": "Вольтарен Форте гель 23,2 мг/г, 50 г", "en": "Voltaren Forte gel 23.2 mg/g (diclofenac)", "fi": "Voltaren Forte geeli 23,2 mg/g", "x": "мазь от боли в мышцах и суставах", "x_en": "gel for muscle and joint pain", "x_fi": "lihas- ja nivelkipuun", "d": "Диклофенак в геле (двойная сила) — местно при боли в мышцах, суставах, ушибах, растяжениях. Втирать 2 раза в день (утром и вечером), не более 2 недель. Не на повреждённую кожу.", "ind": "• Взрослые и подростки с 14 лет: кратковременное местное лечение боли в мышцах и суставах при растяжениях, ушибах, спортивных травмах, перенапряжении.\n• Взрослые с 18 лет: кратковременное лечение боли при остеоартрите коленных суставов и суставов пальцев рук, если диагноз подтверждён врачом. Диклофенак — нестероидный противовоспалительный препарат (НПВП). При нанесении на кожу проникает к месту воспаления, уменьшает боль, воспаление и отёк в мышцах и суставах.", "u": "med/voltaren-forte-gel-23-2-mg-g.html"}, {"ru": "Аквалор Экстра Форте Дуо, 150 мл", "en": "Aqualor Extra Forte Duo 150 ml (nasal spray)", "fi": "Aqualor Extra Forte Duo 150 ml", "x": "промывание носа, гипертонический", "x_en": "nasal wash, hypertonic", "x_fi": "nenähuuhde, hypertoninen", "d": "Гипертонический раствор морской воды с алоэ и ромашкой — промывание и снятие заложенности носа при насморке и синусите. Без привыкания, можно вместе с каплями.", "ind": "• Профилактика и комплексное лечение острых и хронических воспалительных заболеваний носа, пазух и носоглотки: ринит (в т.ч. аллергический и вазомоторный), синусит (в т.ч. гайморит), аденоидит.\n• Профилактика и комплексное лечение ОРВИ и гриппа.\n• Уход за полостью носа после операций на носу и пазухах. ", "u": "med/aqualor-extra-forte-duo-150-ml.html"}, {"ru": "Стеримар «Заложенный нос» (Stérimar Blocked Nose)", "en": "Sterimar Blocked Nose (hypertonic nasal spray)", "fi": "Stérimar Blocked Nose (nenäsuihke)", "x": "морская вода, гипертонический, с медью", "x_en": "seawater, hypertonic, with copper", "x_fi": "merivesi, hypertoninen, kupari", "d": "Гипертоническая морская вода с медью — уменьшает отёк и заложенность носа при простуде. Безопасен, без привыкания.", "ind": "• Заложенность носа при простуде, синусите, аллергическом насморке.\n• Бактериальный (инфекционный) насморк с густыми выделениями — как вспомогательное средство.\n• Промывание носа в составе лечения простуды. ", "u": "med/sterimar-blocked-nose.html"}, {"ru": "Отривин Ментол 1 мг/мл, спрей", "en": "Otrivin Menthol 1 mg/ml (xylometazoline)", "fi": "Otrivin Menthol 1 mg/ml", "x": "сосудосуживающий спрей в нос", "x_en": "decongestant nasal spray", "x_fi": "tukkoisuuteen, nenäsuihke", "d": "Ксилометазолин — сосудосуживающий спрей при заложенности носа. 1 впрыск в каждую ноздрю до 3 раз в день, не дольше 7–10 дней (привыкание).", "ind": "Облегчение заложенности носа при простуде и синусите. Может применяться при воспалении среднего уха (для облегчения), а также по назначению врача при эндоскопии носа. Для взрослых и детей с 12 лет. Ксилометазолин — сосудосуживающее средство (альфа-адреномиметик). Сужает сосуды слизистой носа, уменьшает её отёк и облегчает носовое дыхание. Ментол и эвкалиптол дают ощущение свежести.", "u": "med/otrivin-menthol-1-mg-ml.html"}, {"ru": "Ливостин, глазные капли 0,5 мг/мл", "en": "Livostin eye drops 0.5 mg/ml (levocabastine)", "fi": "Livostin silmätipat 0,5 mg/ml", "x": "от аллергии в глазах", "x_en": "allergy eye drops", "x_fi": "allergiaan, silmätipat", "d": "Левокабастин — антигистаминные глазные капли при аллергическом конъюнктивите (зуд, слезотечение). По 1 капле 2 раза в день, при необходимости до 4. Перед применением взбалтывать.", "ind": "Облегчение симптомов аллергического конъюнктивита — зуда, покраснения, отёка век, слезотечения — вызванных пыльцой трав и деревьев, плесенью, пылью и другими аллергенами. Для взрослых и детей старше 4 лет. Левокабастин — противоаллергическое средство, блокатор H1-гистаминовых рецепторов. Быстро (в течение нескольких минут) и надолго снимает аллергические симптомы со стороны глаз.", "u": "med/livostin-eye-drops-0-5-mg-ml.html"}, {"ru": "Визин классический, капли 0,05%", "en": "Visine Classic eye drops 0.05% (tetryzoline)", "fi": "Visine Classic silmätipat 0,05%", "x": "от покраснения глаз", "x_en": "for red eyes", "x_fi": "silmien punoitukseen", "d": "Тетризолин — сосудосуживающие капли от покраснения и отёка глаз. 1–2 капли до 3 раз в день, не дольше 4 дней. Снимать контактные линзы.", "ind": "Отёк и покраснение конъюнктивы (покраснение глаз) при аллергии и при раздражении глаз дымом, пылью, хлорированной водой, ярким светом, косметикой, контактными линзами. Взрослым и детям старше 2 лет (детям до 6 лет — под наблюдением врача). Тетризолин — альфа-адреномиметик, сужает сосуды конъюнктивы и уменьшает отёк тканей. Эффект наступает примерно через минуту и сохраняется 4–8 часов. При местном применении практически не всасывается.", "u": "med/visine-classic-eye-drops-0-05.html"}, {"ru": "Аллпрезан, пена для ног (Allpresan fuß spezial)", "en": "Allpresan foot foam", "fi": "Allpresan jalkavaahto", "x": "сухая кожа ног, без мочевины", "x_en": "dry foot skin, urea-free", "x_fi": "kuiva jalkojen iho", "d": "Крем-пена для сухой и чувствительной кожи ног (с пантенолом, без мочевины). Наносить на чистую кожу, впитывается быстро.", "ind": "Ежедневный уход за сухой, чувствительной, раздражённой кожей ног, склонной к покраснению, зуду и стянутости; подходит тем, кому не подходят средства с мочевиной. ", "u": "med/allpresan-foot-foam.html"}, {"ru": "Нитрогина, бальзам для губ SPF 20 (Neutrogena Lipcare)", "en": "Neutrogena Lipcare lip balm SPF 20", "fi": "Neutrogena Lipcare huulivoide SPF 20", "x": "гигиеническая помада, 2 шт.", "x_en": "lip balm, 2 pcs", "x_fi": "huulivoide, 2 kpl", "d": "Защитный бальзам для сухих и обветренных губ, SPF 20.", "u": "https://www.google.com/search?q=%D0%9D%D0%B8%D1%82%D1%80%D0%BE%D0%B3%D0%B8%D0%BD%D0%B0%2C%20%D0%B1%D0%B0%D0%BB%D1%8C%D0%B7%D0%B0%D0%BC%20%D0%B4%D0%BB%D1%8F%20%D0%B3%D1%83%D0%B1%20SPF%2020%20%28Neutrogena%20Lipcare%29%20%D0%B8%D0%BD%D1%81%D1%82%D1%80%D1%83%D0%BA%D1%86%D0%B8%D1%8F%20%D0%BF%D0%BE%20%D0%BF%D1%80%D0%B8%D0%BC%D0%B5%D0%BD%D0%B5%D0%BD%D0%B8%D1%8E"}, {"ru": "Акилдия, защитный крем для ног (Akildia)", "en": "Akildia protective foot cream", "fi": "Akildia jalkojen suojavoide", "x": "для уязвимой кожи стоп (диабетическая стопа)", "x_en": "for fragile feet (diabetic foot care)", "x_fi": "herkille jaloille (diabeetikon jalat)", "d": "Защитный крем для уязвимых стоп (уход при диабете, Asepta, Монако): увлажняет, укрепляет защитный барьер кожи, смягчает мозоли, с антибактериальными и противогрибковыми компонентами. 2 раза в день на всю стопу, не на раны.", "ind": "Ежедневный уход за уязвимой, сухой кожей стоп, в первую очередь при диабете («pied fragilisé» — ослабленная стопа). Это косметическое средство, не лекарство. ", "u": "med/akildia-protective-foot-cream.html"}]}, {"code": "008-1", "title": "Запас сверху", "title_en": "Spare stock on top", "title_fi": "Varasto päällä", "zone": "Дом", "room": "Кухня", "room_en": "Kitchen", "room_fi": "Keittiö", "cab": "Аптека", "where": "Аптечка 008 «Когда заболел», лоток сверху (запас)", "where_en": "Medicine organizer 008 “When sick”, top tray (spare stock)", "items": [{"ru": "Мукофальк, пакетики (запас)", "en": "Mucofalk sachets (spare)", "fi": "Mucofalk-annospussit (vara)", "x": "остаток, что не влез в ящик 9", "x_en": "overflow from drawer 9", "x_fi": "laatikon 9 ylijäämä", "d": "Оболочка семян подорожника (клетчатка). При запоре и для нормализации стула: 1 пакетик 2–6 раз в день, размешать в стакане воды и сразу выпить, запить ещё водой. Запас — основная пачка в ящике 008-9.", "ind": "• Запоры (в т.ч. при беременности)\n• Анальные трещины и геморрой\n• После операций в аноректальной области — для смягчения стула\n• Функциональная диарея\n• Синдром раздражённого кишечника Растительное слабительное на основе пищевых волокон. Волокна оболочки семян связывают воду в кишечнике, увеличивают объём стула и размягчают его, что нормализует работу кишечника и облегчает опорожнение; при диарее, наоборот, загущает жидкий стул.", "u": "med/mucofalk-sachets.html"}, {"ru": "Пенталгин (запас)", "en": "Pentalgin (spare)", "fi": "Pentalgin (vara)", "x": "запас; основная пачка — в ящике 008-8", "x_en": "spare; main pack in drawer 008-8", "x_fi": "vara; pääpakkaus laatikossa 008-8", "d": "Парацетамол + напроксен + кофеин + дротаверин + фенирамин. От головной, зубной, мышечной боли, болезненных спазмов, при простуде. Обычно 1 таблетка 1–3 раза в день, не более 4 в сутки, не дольше 5 дней. Не сочетать с другими средствами с парацетамолом (Терафлю, Парацетамол). Не принимать с алкоголем. Запас — основная пачка в ящике 008-8.", "ind": "• Боли разного происхождения: суставные и мышечные, радикулит, болезненные менструации, невралгия, зубная и головная боль (в т.ч. при спазме сосудов мозга).\n• Боли, связанные со спазмом гладкой мускулатуры: хронический холецистит, желчнокаменная болезнь, постхолецистэктомический синдром, почечная колика.\n• Боль после травм и операций, в т.ч. с воспалением.\n• Простуда с температурой (симптоматически). Комбинированное средство: обезболивает, снимает воспаление, спазм и снижает температуру.\n• Парацетамол — жаропонижающее и обезболивающее.\n• Напроксен (НПВС) — противовоспалительное и обезболивающее за счёт подавления ЦОГ.\n• Кофеин — х процедур: мокнущие раны, швы, эпизиотомия, трещины кожи. Комбинация двух антибиотиков: бацитрацин нарушает построение клеточной стенки бактерий (в основном грамположительных), неомицин блокирует синтез белка у грамположительных и грамотрицательных бактерий. Вместе действуют шире и сильнее, в том числе против стафилококков. Через кожу почти не всасываются, но при больших площадях всасывание возможно.", "u": "med/baneocin-powder.html"}, {"ru": "Зелёнка (бриллиантовый зелёный)", "en": "Brilliant green antiseptic", "fi": "Briljanttivihreä antiseptinen liuos", "x": "обработать края ранки", "x_en": "antiseptic for small wounds", "x_fi": "antiseptinen haavoille", "d": "Антисептик 1% спиртовой. Обрабатывать края ранки, а не саму рану. Сильно окрашивает кожу и ткани.", "ind": "• Свежие ссадины, порезы, царапины и другие нарушения целостности кожи.\n• Свежие послеоперационные и посттравматические раны и рубцы.\n• Гнойничковые поражения кожи (пиодермия).\n• Блефарит, мейбомит (обработка края века — осторожно, не допуская попадания в глаз). Антисептик: подавляет преимущественно грамположительные бактерии (в т.ч. стафилококки), подсушивает поверхность ранки.", "u": "med/brilliant-green-antiseptic.html"}, {"ru": "Градусник", "en": "Thermometer", "fi": "Kuumemittari", "d": "Электронный термометр. Температура выше 38,5 °C — повод принять жаропонижающее; выше 39,5 °C или держится больше 3 дней — к врачу."}, {"ru": "Пластыри Teneris", "en": "Teneris plasters", "fi": "Teneris-laastarit", "d": "Пластыри для мелких ранок и мозолей."}]}, {"code": "008-8", "title": "Боль, аллергия, по рецепту", "title_en": "Pain, allergy, prescription", "title_fi": "Kipu, allergia, resepti", "zone": "Дом", "room": "Кухня", "room_en": "Kitchen", "room_fi": "Keittiö", "cab": "Аптека", "where": "Аптечка 008 «Когда заболел», ящик малый верхний", "where_en": "Medicine organizer 008 “When sick”, small drawer, top", "items": [{"ru": "Пенталгин", "en": "Pentalgin", "fi": "Pentalgin", "x": "от боли и спазмов", "x_en": "pain & cramps", "x_fi": "kipu ja kouristukset", "d": "Парацетамол + напроксен + кофеин + дротаверин + фенирамин. От головной, зубной, мышечной боли, болезненных спазмов, при простуде. Обычно 1 таблетка 1–3 раза в день, не более 4 в сутки, не дольше 5 дней. Не сочетать с другими средствами с парацетамолом (Терафлю, Парацетамол). Не принимать с алкоголем.", "ind": "• Боли разного происхождения: суставные и мышечные, радикулит, болезненные менструации, невралгия, зубная и головная боль (в т.ч. при спазме сосудов мозга).\n• Боли, связанные со спазмом гладкой мускулатуры: хронический холецистит, желчнокаменная болезнь, постхолецистэктомический синдром, почечная колика.\n• Боль после травм и операций, в т.ч. с воспалением.\n• Простуда с температурой (симптоматически). Комбинированное средство: обезболивает, снимает воспаление, спазм и снижает температуру.\n• Парацетамол — жаропонижающее и обезболивающее.\n• Напроксен (НПВС) — противовоспалительное и обезболивающее за счёт подавления ЦОГ.\n• Кофеин — тонизирует, усиливает действие анальгетиков.\n• Дротаверин — снимает спазм гладких мышц (ЖКТ, желчные и мочевые пути, сосуды).\n• Фенирамин — антигистаминный компонент с лёгким седативным эффектом, усиливает обезболивание.", "u": "med/pentalgin.html"}, {"ru": "Burana-C", "en": "Burana-C (ibuprofen + vit C)", "fi": "Burana-C", "x": "от боли и температуры (ибупрофен)", "x_en": "pain & fever (ibuprofen)", "x_fi": "kipu ja kuume (ibuprofeeni)", "d": "Ибупрофен 400 мг + витамин C. От боли и температуры: 1 таблетка до 3 раз в день, лучше после еды. Не при язве желудка; осторожно при приёме средств для давления и разжижения крови.", "ind": "Облегчение симптомов простуды и гриппа вирусного происхождения: температура, ломота в мышцах и суставах, головная боль. Длительно — только по назначению врача. Ибупрофен — нестероидное противовоспалительное средство (НПВС): уменьшает образование веществ, вызывающих воспаление, боль и жар, поэтому снимает боль и снижает температуру. Витамин C участвует в ферментных реакциях и работает как антиоксидант.", "u": "med/burana-c.html"}, {"ru": "Цетрин 10 мг", "en": "Zetrin (cetirizine) 10 mg", "fi": "Zetrin (setiritsiini) 10 mg", "x": "от аллергии, 1 раз в день", "x_en": "antihistamine, once daily", "x_fi": "allergialääke, kerran päivässä", "d": "Цетиризин — от аллергии (насморк, чихание, зуд, крапивница). 1 таблетка 1 раз в день, лучше вечером. Может слегка вызывать сонливость.", "ind": "• Сезонный и круглогодичный аллергический ринит; • аллергический конъюнктивит; • поллиноз (сенная лихорадка); • крапивница, в т.ч. хроническая идиопатическая; • зудящие аллергические дерматозы (атопический дерматит, нейродермит); • отёк Квинке. Цетиризин — противоаллергическое средство, блокатор H1-гистаминовых рецепторов (метаболит гидроксизина). Уменьшает отёк, зуд, проницаемость капилляров и миграцию клеток воспаления, облегчает течение аллергических реакций. Почти не обладает снотворным и холинолитическим действием в терапевтических дозах. Начинает действовать примерно через 20 минут после приёма 10 мг, эффект длится более 24 часов и сохраняется до 3 суток после отмены; привыкания не развивается.", "u": "med/zetrin.html"}, {"ru": "Цетиризин-ратиофарм 10 мг", "en": "Cetirizin-ratiopharm 10 mg", "fi": "Cetirizin-ratiopharm 10 mg", "x": "от аллергии, 1 раз в день", "x_en": "antihistamine, once daily", "x_fi": "allergialääke, kerran päivässä", "d": "То же, что Цетрин (цетиризин). 1 таблетка 1 раз в день. Два вместе не принимать.", "ind": "• Сезонный и круглогодичный аллергический ринит и аллергический конъюнктивит\n• Поллиноз (сенная лихорадка)\n• Крапивница, в т.ч. хроническая идиопатическая; отёк Квинке\n• Зудящие аллергические дерматозы, включая атопический дерматит Противоаллергическое средство — блокатор H1-гистаминовых рецепторов второго поколения. Уменьшает зуд, отёк, чихание, насморк и слезотечение. Действие начинается через 20–60 минут после приёма и длится 24 часа; в терапевтических дозах практически не вызывает сонливости, привыкания не развивается.", "u": "med/cetirizin-ratiopharm-10-mg.html"}, {"ru": "Супракс 400 мг (цефиксим)", "en": "Suprax 400 mg (cefixime)", "fi": "Suprax 400 mg (kefiksiimi)", "x": "антибиотик — по назначению врача", "x_en": "antibiotic — as prescribed", "x_fi": "antibiootti — lääkärin ohjeen mukaan", "d": "Антибиотик (цефиксим) — при бактериальных инфекциях (ухо, горло, мочевые пути, бронхи). Обычно 1 капсула 1 раз в день. Рецептурное: доза и длительность — только по назначению врача. Курс не прерывать.", "ind": "Бактериальные инфекции, вызванные чувствительными микробами:\n• фарингит, тонзиллит, синусит;\n• острый и хронический бронхит;\n• средний отит;\n• неосложнённые инфекции мочевых путей;\n• неосложнённая гонорея. Антибиотик-цефалоспорин III поколения широкого спектра: убивает бактерии, нарушая синтез их клеточной стенки; устойчив к большинству бета-лактамаз. Не действует на синегнойную палочку, энтерококки, листерии, большинство стафилококков (включая MRSA), энтеробактер, бактероиды и клостридии. Всасывание не зависит от еды; период полувыведения 3–4 ч (дольше при болезни почек).", "u": "med/suprax-400-mg.html"}, {"ru": "Панцеф 400 мг (цефиксим)", "en": "Pancef 400 mg (cefixime)", "fi": "Pancef 400 mg (kefiksiimi)", "x": "антибиотик — по назначению врача", "x_en": "antibiotic — as prescribed", "x_fi": "antibiootti — lääkärin ohjeen mukaan", "d": "Антибиотик, то же действующее вещество, что Супракс (цефиксим). Вместе с Супраксом не принимать. Рецептурное: доза и длительность — только по назначению врача.", "ind": "• Тонзиллит, фарингит, синусит.\n• Средний отит.\n• Бронхит, трахеобронхит.\n• Инфекции мочевыводящих путей.\n• Неосложнённая гонорея. Разрушает бактерии, нарушая синтез их клеточной стенки; устойчив к бета-лактамазам. Действует на многие грамположительные и грамотрицательные бактерии, но не на синегнойную палочку, энтерококки, листерии, большинство стафилококков и клостридий. Всасывается на 40–50% независимо от еды, выводится в основном почками, период полувыведения 3–4 ч.", "u": "med/pancef-400-mg.html"}, {"ru": "Валтрекс 500 мг", "en": "Valtrex 500 mg (valaciclovir)", "fi": "Valtrex 500 mg (valasikloviiri)", "x": "от герпеса — по назначению врача", "x_en": "herpes — as prescribed", "x_fi": "herpes — lääkärin ohjeen mukaan", "d": "Валацикловир — противовирусное от герпеса (губы, опоясывающий лишай). Начать как можно раньше при первых признаках. Рецептурное: доза и длительность — только по назначению врача.", "ind": "• Взрослые и подростки 12–18 лет: лечение герпеса кожи и слизистых (генитальный и лабиальный — «на губах»), первичного и рецидивирующего; профилактика (подавление) рецидивов герпеса; профилактика ЦМВ-инфекции после трансплантации органов.\n• Только взрослые: опоясывающий лишай (в т.ч. офтальмический). Противовирусное средство. В организме валацикловир быстро и почти полностью превращается в ацикловир, который блокирует синтез ДНК вирусов герпеса. Активен против вируса простого герпеса 1 и 2 типов, вируса ветряной оспы/опоясывающего лишая, цитомегаловируса, вируса Эпштейна–Барр. При опоясывающем лишае сокращает продолжительность боли, в т.ч. постгерпетической невралгии. Период полувыведения ацикловира ~3 ч (при тяжёлой почечной недостаточности ~14 ч).", "u": "med/valtrex-500-mg.html"}, {"ru": "Дексаметазон, ампулы 4 мг/мл", "en": "Dexamethasone 4 mg/ml ampoules", "fi": "Deksametasoni 4 mg/ml ampullit", "x": "гормон, уколы — по назначению врача", "x_en": "steroid injections — as prescribed", "x_fi": "kortisoni-injektio — lääkärin ohjeen mukaan", "d": "Гормон (кортикостероид) для уколов — при тяжёлой аллергической реакции, отёках, воспалении. Только по назначению врача.", "ind": "Состояния, когда нужен быстрый гормональный эффект или нельзя принять таблетки:\n• шок (травматический, ожоговый, операционный, токсический) при неэффективности других мер;\n• тяжёлые аллергические реакции, анафилаксия, астматический статус, тяжёлый бронхоспазм;\n• отёк мозга;\n• острая надпочечниковая недостаточность и другие эндокринные болезни;\n• обострения ревматических и системных заболеваний, тяжёлые дерматозы, болезни крови, онкогематология (паллиативно), тяжёлые инфекции (вместе с антибиотиками);\n• местно — глазные воспалительные болезни, келоиды и др. Синтетический глюкокортикостероид (гормон коры надпочечников): мощно подавляет воспаление, аллергию и иммунные реакции, повышает чувствительность сосудов к адреналину (помогает при шоке). Минералокортикоидная активность (задержка соли и воды) очень слабая. Период полувыведения из крови 3–5 часов; проникает через плаценту и гематоэнцефалический барьер.", "u": "med/dexamethasone-4-mg-ml-ampoules.html"}, {"ru": "Парацетамол 500 мг", "en": "Paracetamol 500 mg", "fi": "Parasetamoli 500 mg", "x": "от боли и температуры", "x_en": "pain & fever", "x_fi": "kipu ja kuume", "d": "От температуры и боли. 1–2 таблетки, не чаще чем каждые 4–6 часов, не более 8 таблеток (4 г) в сутки. Не сочетать с Пенталгином/Терафлю (там тоже парацетамол). Не с алкоголем.", "ind": "• Боль слабой и умеренной интенсивности: головная и зубная боль, мигрень, боли в мышцах и суставах, невралгия, болезненные менструации. • Повышенная температура при простуде, гриппе и других инфекционно-воспалительных заболеваниях. Ненаркотический анальгетик и жаропонижающее средство. Блокирует фермент циклооксигеназу в центральной нервной системе, воздействуя на центры боли и терморегуляции. Противовоспалительного действия практически не имеет и не раздражает слизистую желудка. Максимальная концентрация в крови — через 0,5–2 часа, период полувыведения 1–4 часа.", "u": "med/paracetamol-500-mg.html"}, {"ru": "Кетанов 10 мг (кеторолак)", "en": "Ketanov 10 mg (ketorolac)", "fi": "Ketanov 10 mg (ketorolaakki)", "x": "сильное обезболивающее, коротко", "x_en": "strong painkiller, short use", "x_fi": "vahva kipulääke, lyhytaikaisesti", "d": "Сильное обезболивающее (кеторолак). 1 таблетка до 4 раз в день, не дольше 5 дней. Раздражает желудок: после еды. Не при язве, проблемах с почками, не вместе с другими НПВС (ибупрофен, диклофенак, аспирин).", "ind": "Кратковременное снятие боли средней и сильной интенсивности разного происхождения (в т.ч. после операций, при онкологических заболеваниях). Не предназначен для лечения хронической боли и для обезболивания перед/во время крупных операций. Нестероидный противовоспалительный препарат с сильным обезболивающим действием (а также противовоспалительным и умеренным жаропонижающим). Подавляет ферменты ЦОГ-1 и ЦОГ-2 и синтез простагландинов. Не действует на опиоидные рецепторы, не угнетает дыхание и не вызывает зависимости. Обезболивание начинается примерно через 1 час, максимум — через 1–2 часа.", "u": "med/ketanov-10-mg.html"}, {"ru": "Диклофенак Реневал", "en": "Diclofenac", "fi": "Diklofenaakki", "x": "от боли и воспаления", "x_en": "pain & inflammation", "x_fi": "kipu ja tulehdus", "d": "Диклофенак — от боли и воспаления (суставы, спина, мышцы). Принимать после еды, коротким курсом. Не при язве; не вместе с другими НПВС. Рецептурное: доза и длительность — только по назначению врача.", "ind": "• Воспалительные и дегенеративные болезни суставов и позвоночника: ревматоидный, псориатический, реактивный, подагрический артрит, анкилозирующий спондилит, остеоартроз, бурсит, тендовагинит, ревматическое поражение мягких тканей.\n• Боли в спине и позвоночнике: люмбаго, ишиас, радикулит, невралгия, миалгия, артралгия.\n• Боль с воспалением после травм и операций (в т.ч. стоматологических и ортопедических).\n• Болезненные менструации. Нестероидный противовоспалительный препарат: подавляет ферменты ЦОГ-1 и ЦОГ-2 и синтез простагландинов, снимая воспаление, боль и температуру. Лечит симптомы, но не влияет на течение болезни. Пролонгированная форма даёт пик концентрации примерно через 4 ч, препарат накапливается в суставной жидкости.", "u": "med/diclofenac.html"}, {"ru": "Нитроксолин", "en": "Nitroxoline", "fi": "Nitroksoliini", "x": "при инфекции мочевых путей — по назначению врача", "x_en": "urinary infection — as prescribed", "x_fi": "virtsatieinfektio — lääkärin ohjeen mukaan", "d": "Антибактериальное при инфекциях мочевых путей (цистит). Окрашивает мочу в жёлто-оранжевый цвет — это нормально. Рецептурное: доза и длительность — только по назначению врача.", "ind": "• Инфекции мочеполовых путей: пиелонефрит, цистит, уретрит, эпидидимит, инфицированная аденома или опухоль простаты.\n• Профилактика инфекций при катетеризации, цистоскопии, после операций на почках и мочевых путях. Противомикробное средство из группы оксихинолинов: подавляет синтез ДНК бактерий. Действует на многие грамположительные и грамотрицательные бактерии, некоторые грибы и трихомонады. Хорошо всасывается и выводится почками в неизменённом виде, поэтому создаёт высокие концентрации в моче.", "u": "med/nitroxoline.html"}]}, {"code": "008-9", "title": "Живот, кишечник, печень", "title_en": "Stomach, bowel & liver", "title_fi": "Vatsa, suolisto ja maksa", "zone": "Дом", "room": "Кухня", "room_en": "Kitchen", "room_fi": "Keittiö", "cab": "Аптека", "where": "Аптечка 008 «Когда заболел», ящик малый нижний", "where_en": "Medicine organizer 008 “When sick”, small drawer, bottom", "items": [{"ru": "Фитолакс", "en": "Fitolax", "fi": "Fitolaks", "x": "мягкое слабительное (растительное)", "x_en": "mild herbal laxative", "x_fi": "mieto kasvipohjainen ulostuslääke", "d": "Растительное мягкое слабительное (БАД, жевательные таблетки). Обычно 2 таблетки вечером во время еды. Курс до 14 дней.", "ind": "Нарушение работы кишечника с запорами, затруднённая или нерегулярная дефекация. Мягкое растительное слабительное: антрагликозиды сенны усиливают перистальтику толстой кишки, абрикос размягчает стул; укроп и подорожник уменьшают спазмы и газообразование, облегчают отхождение газов при вздутии.", "u": "med/fitolax.html"}, {"ru": "Гутталакс", "en": "Guttalax", "fi": "Guttalax", "x": "слабительное", "x_en": "laxative", "x_fi": "ulostuslääke", "d": "Слабительное (пикосульфат натрия). Действует через 6–12 часов: принимать на ночь. Не при болях в животе неясной причины.", "ind": "• Запор при вялости (атонии, гипотонии) толстой кишки — в том числе у пожилых, лежачих, после операций и родов, при кормлении грудью.\n• Запор от приёма лекарств, от нарушений питания или дисбиоза.\n• Размягчение стула при геморрое, проктите, анальной трещине.\n• Синдром раздражённого кишечника с преобладанием запоров, заболевания желчного пузыря. Стимулирующее слабительное, действует только в толстой кишке и не мешает всасыванию пищи в тонкой. Бактерии толстой кишки превращают его в активный метаболит, который усиливает перистальтику и задерживает воду в просвете кишки, размягчая стул. Эффект наступает через 6–12 часов (в среднем около 10 часов); в кровь всасывается очень мало.", "u": "med/guttalax.html"}, {"ru": "Микролакс", "en": "Microlax", "fi": "Microlax", "x": "микроклизма, быстро от запора", "x_en": "mini enema for constipation", "x_fi": "peräruiske ummetukseen", "d": "Микроклизма — быстрое средство от запора, действует через 5–15 минут. Одна тюбик-клизма; наконечник ввести полностью.", "ind": "• Запор, в том числе энкопрез (недержание кала). • Подготовка к эндоскопическому (ректоскопия) и рентгенологическому исследованию кишечника. Комбинированное слабительное местного действия. Натрия цитрат вытесняет связанную воду из каловых масс, натрия лаурилсульфоацетат разжижает содержимое кишечника, сорбитол притягивает воду в кишку. Стул размягчается, опорожнение облегчается. Эффект наступает через 5–15 минут.", "u": "med/microlax.html"}, {"ru": "Мукофальк, пакетики", "en": "Mucofalk sachets (psyllium)", "fi": "Mucofalk-annospussit (psyllium)", "x": "пищевые волокна для кишечника", "x_en": "fibre for the bowel", "x_fi": "kuitu suolistolle", "d": "Оболочка семян подорожника (клетчатка). При запоре и для нормализации стула: 1 пакетик 2–6 раз в день, размешать в стакане воды и сразу выпить, запить ещё водой.", "ind": "• Запоры (в т.ч. при беременности)\n• Анальные трещины и геморрой\n• После операций в аноректальной области — для смягчения стула\n• Функциональная диарея\n• Синдром раздражённого кишечника Растительное слабительное на основе пищевых волокон. Волокна оболочки семян связывают воду в кишечнике, увеличивают объём стула и размягчают его, что нормализует работу кишечника и облегчает опорожнение; при диарее, наоборот, загущает жидкий стул.", "u": "med/mucofalk-sachets.html"}, {"ru": "Уголь активированный", "en": "Activated charcoal", "fi": "Lääkehiili", "x": "при отравлении", "x_en": "for food poisoning", "x_fi": "ruokamyrkytykseen", "d": "Сорбент — при отравлении, диарее. Примерно 1 таблетка на 10 кг веса за приём. Принимать отдельно от других лекарств (за 1–2 часа), иначе ослабит их действие.", "ind": "• Отравления (пищевые токсикоинфекции, лекарства, алкалоиды, соли тяжёлых металлов и др.), в т.ч. в комплексе при дизентерии и сальмонеллёзе\n• Диспепсия, метеоризм (вздутие)\n• Пищевая и лекарственная аллергия\n• Гипербилирубинемия и гиперазотемия (в составе комплексного лечения)\n• Подготовка к УЗИ и рентгену (уменьшение газов) Энтеросорбент: на своей огромной поверхности связывает в ЖКТ токсины, яды, лекарства, соли тяжёлых металлов, бактериальные токсины и газы, препятствуя их всасыванию, и выводит их с калом. Также связывает избыток билирубина, мочевины, холестерина. Плохо связывает кислоты, щёлочи, соли железа, цианиды, метанол, этиленгликоль. Сам не всасывается и полностью выводится за 24 часа.", "u": "med/activated-charcoal.html"}, {"ru": "Фамотидин 40 мг", "en": "Famotidine 40 mg", "fi": "Famotidiini 40 mg", "x": "от изжоги и кислотности", "x_en": "heartburn & acid", "x_fi": "närästykseen", "d": "Снижает кислотность желудка — изжога, гастрит, язва. Обычно 1 таблетка на ночь. Рецептурное: доза и длительность — только по назначению врача.", "ind": "• Язвенная болезнь желудка и 12-перстной кишки — лечение и профилактика обострений.\n• Язвы от НПВП, стрессовые и послеоперационные.\n• Эрозивный гастродуоденит; диспепсия с повышенной кислотностью (изжога, кислая отрыжка).\n• Рефлюкс-эзофагит; синдром Золлингера–Эллисона.\n• Профилактика повторных кровотечений из верхних отделов ЖКТ и аспирации желудочного сока при наркозе. Блокатор H2-гистаминовых рецепторов: снижает выработку соляной кислоты в желудке (базальную и стимулированную) и активность пепсина. Начинает действовать через 1 ч, максимум через 3 ч, эффект длится 12–24 ч.", "u": "med/famotidine-40-mg.html"}, {"ru": "Дюспаталин 200 мг", "en": "Duspatalin 200 mg (mebeverine)", "fi": "Duspatalin 200 mg (mebeveriini)", "x": "от спазмов и болей в животе", "x_en": "abdominal cramps", "x_fi": "vatsakrampit", "d": "Мебеверин — снимает спазмы кишечника, боли и вздутие (синдром раздражённого кишечника). 1 капсула 2 раза в день за 20 минут до еды, не разжёвывать.", "ind": "Боль, спазмы, дискомфорт и нарушения работы кишечника при синдроме раздражённого кишечника; спазмы ЖКТ, в том числе на фоне органических заболеваний. Спазмолитик: прямо расслабляет гладкие мышцы кишечника, снимая спазм, но не подавляя нормальную перистальтику. Не имеет атропиноподобных побочных эффектов. Почти полностью расщепляется в организме, метаболиты выводятся с мочой, не накапливается.", "u": "med/duspatalin-200-mg.html"}, {"ru": "Ребагит 100 мг", "en": "Rebagit 100 mg (rebamipide)", "fi": "Rebagit 100 mg (rebamipidi)", "x": "защита желудка — по назначению врача", "x_en": "stomach protection — as prescribed", "x_fi": "mahan suoja — lääkärin ohjeen mukaan", "d": "Ребамипид — защищает слизистую желудка (гастрит, язва, при приёме НПВС). Обычно 1 таблетка 3 раза в день. Рецептурное: доза и длительность — только по назначению врача.", "ind": "• Язва желудка.\n• Хронический гастрит с повышенной кислотностью в стадии обострения.\n• Эрозивный гастрит.\n• Профилактика поражения слизистой желудка при приёме НПВП.\nМожет применяться в составе комбинированной терапии. Гастропротектор: повышает содержание простагландина E2 в слизистой желудка, усиливает выработку защитной слизи и кровоток в слизистой, обладает антиоксидантным действием. Защищает слизистую от повреждения алкоголем, кислотами, щелочами, аспирином и другими НПВП. Пик концентрации — через ~2 ч, период полувыведения ~1 ч, не накапливается.", "u": "med/rebagit-100-mg.html"}, {"ru": "Ультоп (омепразол)", "en": "Ultop (omeprazole)", "fi": "Ultop (omepratsoli)", "x": "от изжоги, для желудка", "x_en": "heartburn, stomach acid", "x_fi": "närästys", "d": "Омепразол — снижает кислотность: изжога, гастрит, язва; защита желудка при приёме обезболивающих. Обычно 1 капсула утром за 30 минут до еды.", "ind": "• Язва желудка и двенадцатиперстной кишки (лечение и профилактика рецидивов), в том числе в схемах уничтожения Helicobacter pylori.\n• Гастроэзофагеальная рефлюксная болезнь (ГЭРБ), рефлюкс-эзофагит, изжога.\n• Эрозии и язвы от приёма НПВС, стрессовые язвы.\n• Синдром Золлингера–Эллисона и другие состояния с избытком кислоты. Ингибитор протонной помпы: блокирует последний этап выработки соляной кислоты в желудке. Действие начинается примерно через час, максимум — через 2 часа, длится около 24 часов; после отмены выработка кислоты восстанавливается за 3–5 дней.", "u": "med/ultop.html"}, {"ru": "Фестал", "en": "Festal", "fi": "Festal", "x": "ферменты, при тяжести после еды", "x_en": "digestive enzymes", "x_fi": "ruoansulatusentsyymit", "d": "Ферменты поджелудочной железы — при тяжести после жирной/обильной еды. 1–2 драже во время или сразу после еды, не разжёвывать.", "ind": "• Недостаточность внешнесекреторной функции поджелудочной железы (хронический панкреатит) с нарушением пищеварения, вздутием, склонностью к запорам — в составе комплексной терапии при болезнях печени, после удаления жёлчного пузыря, при дискинезии желчевыводящих путей, хроническом гастрите, дуодените, холецистите. • Улучшение переваривания пищи при нормальной работе ЖКТ — при погрешностях в диете (переедание, жирная пища), нарушении жевания, малоподвижном образе жизни. • Подготовка к УЗИ и рентгену органов брюшной полости. Ферментный препарат: восполняет недостаток ферментов поджелудочной железы и жёлчи. Амилаза, липаза и протеаза помогают переваривать углеводы, жиры и белки и улучшают их всасывание. Компоненты жёлчи улучшают переваривание жиров и всасывание витаминов A, E, K, оказывают желчегонное действие. Гемицеллюлаза расщепляет растительную клетчатку и уменьшает газообразование.", "u": "med/festal.html"}, {"ru": "Эспумизан экстра", "en": "Espumisan extra (simethicone)", "fi": "Espumisan extra (simetikoni)", "x": "от вздутия", "x_en": "bloating", "x_fi": "ilmavaivat", "d": "Симетикон — от вздутия и газов. Пакетик с гранулами — высыпать на язык, проглотить; можно после еды и перед сном.", "ind": "• Метеоризм (повышенное газообразование и вздутие), в т.ч. после операций\n• Симптомы функциональной диспепсии, связанные с газами\n• Подготовка к УЗИ и рентгену органов брюшной полости и малого таза Ветрогонное средство. Симетикон снижает поверхностное натяжение пузырьков газа в кишечнике — пена разрушается, газ всасывается стенкой кишечника или выводится естественным путём. Препарат химически инертен, не всасывается и выводится в неизменном виде.", "u": "med/espumisan-extra.html"}, {"ru": "Бифицин форте", "en": "Bificin forte (probiotic)", "fi": "Bificin forte (probiootti)", "x": "пробиотик", "x_en": "probiotic", "x_fi": "probiootti", "d": "Пробиотик (бифидобактерии) — при дисбактериозе, после антибиотиков, при диарее. Обычно 1 капсула в день во время еды.", "ind": " ", "u": "https://www.google.com/search?q=%D0%91%D0%B8%D1%84%D0%B8%D1%86%D0%B8%D0%BD%20%D1%84%D0%BE%D1%80%D1%82%D0%B5%20%D0%B8%D0%BD%D1%81%D1%82%D1%80%D1%83%D0%BA%D1%86%D0%B8%D1%8F%20%D0%BF%D0%BE%20%D0%BF%D1%80%D0%B8%D0%BC%D0%B5%D0%BD%D0%B5%D0%BD%D0%B8%D1%8E"}, {"ru": "Симбиотер Альфлорекс", "en": "Alflorex probiotic", "fi": "Alflorex-probiootti", "x": "пробиотик", "x_en": "probiotic", "x_fi": "probiootti", "d": "Пробиотик (бактерии Bifidobacterium 35624) — при вздутии и дискомфорте в кишечнике, синдроме раздражённого кишечника. 1 капсула в день.", "ind": "Поддержка здоровья кишечника и микрофлоры как дополнение к питанию. Штамм B. longum 35624 — естественный обитатель кишечника человека; производитель заявляет, что он доходит до кишечника живым и поддерживает собственную микрофлору. На других рынках (Symbiosys Alflorex) продукт позиционируется для людей с симптомами синдрома раздражённого кишечника — вздутием, болью, нарушениями стула.", "u": "med/alflorex-probiotic.html"}, {"ru": "Урсосан форте 500 мг", "en": "Ursosan forte 500 mg (ursodeoxycholic acid)", "fi": "Ursosan forte 500 mg", "x": "для печени и желчи — по назначению врача", "x_en": "liver & bile — as prescribed", "x_fi": "maksa ja sappi — lääkärin ohjeen mukaan", "d": "Урсодезоксихолевая кислота — для печени и желчного (желчные камни, застой желчи, жировой гепатоз). Обычно вечером во время еды. Рецептурное: доза и длительность — только по назначению врача.", "ind": "• Неосложнённая желчнокаменная болезнь: билиарный сладж, растворение холестериновых камней при работающем желчном пузыре.\n• Хронические гепатиты (токсический, лекарственный и др.).\n• Холестатические болезни печени: первичный билиарный холангит/цирроз (без декомпенсации), первичный склерозирующий холангит, муковисцидоз.\n• Неалкогольная жировая болезнь печени, в т.ч. стеатогепатит; алкогольная болезнь печени.\n• Дискинезия желчевыводящих путей; билиарный рефлюкс-гастрит. Гепатопротектор: защищает клетки печени, усиливает желчеотток, снижает насыщенность желчи холестерином и постепенно растворяет холестериновые камни, связывает токсичные желчные кислоты, обладает иммуномодулирующим действием.", "u": "med/ursosan-forte-500-mg.html"}, {"ru": "Рабепразол", "en": "Rabeprazole", "fi": "Rabepratsoli", "x": "от изжоги, для желудка — по назначению врача", "x_en": "heartburn, stomach acid — as prescribed", "x_fi": "närästys — lääkärin ohjeen mukaan", "d": "Как омепразол — снижает выработку кислоты (изжога, ГЭРБ, язва). Обычно 1 таблетка утром. Вместе с Ультопом не принимать. Рецептурное: доза и длительность — только по назначению врача.", "ind": "• Активная язва желудка или анастомоза, язва двенадцатиперстной кишки.\n• Эрозивная ГЭРБ (рефлюкс-эзофагит) и её поддерживающее лечение, неэрозивная ГЭРБ (изжога).\n• Синдром Золлингера–Эллисона и другие состояния с избытком кислоты.\n• В сочетании с антибиотиками — уничтожение Helicobacter pylori при язвенной болезни. Ингибитор протонной помпы: блокирует выработку соляной кислоты клетками желудка, подавляя как базальную, так и стимулированную секрецию. Действие начинается в течение часа и сохраняется до 48 часов; полный эффект — примерно через 3 дня, после отмены кислотность восстанавливается за 1–2 дня.", "u": "med/rabeprazole.html"}]}, {"code": "008-10", "title": "Простуда, горло, кашель", "title_en": "Cold, throat & cough", "title_fi": "Flunssa, kurkku ja yskä", "zone": "Дом", "room": "Кухня", "room_en": "Kitchen", "room_fi": "Keittiö", "cab": "Аптека", "where": "Аптечка 008 «Когда заболел», ящик высокий", "where_en": "Medicine organizer 008 “When sick”, tall drawer", "items": [{"ru": "Терафлю (порошок)", "en": "Theraflu powder", "fi": "Theraflu-jauhe", "x": "от гриппа и простуды, жар и насморк", "x_en": "flu & cold: fever, runny nose", "x_fi": "flunssa: kuume, nuha", "d": "Парацетамол + фенилэфрин + фенирамин. От симптомов гриппа и простуды (жар, насморк, ломота). 1 пакетик растворить в горячей воде, до 3 раз в день, не дольше 5 дней. Не сочетать с другими средствами с парацетамолом. Может вызывать сонливость.", "ind": "Симптоматическое лечение ОРВИ и гриппа: повышенная температура, озноб, ломота в теле, головная и мышечная боль, насморк, заложенность носа, чихание. Комбинированное средство от симптомов простуды и гриппа. Парацетамол снижает температуру и обезболивает; фенилэфрин сужает сосуды носа и уменьшает заложенность; фенирамин — противоаллергический компонент, уменьшает насморк, чихание и слезотечение (обладает седативным действием); витамин C восполняет его потребность при простуде.", "u": "med/theraflu-powder.html"}, {"ru": "Тамифлю 75 мг", "en": "Tamiflu 75 mg", "fi": "Tamiflu 75 mg", "x": "противовирусное от гриппа — по назначению врача", "x_en": "flu antiviral — as prescribed", "x_fi": "influenssalääke — lääkärin ohjeen mukaan", "d": "Осельтамивир — противовирусное от гриппа. Начать в первые 48 часов болезни. Обычно 1 капсула 2 раза в день 5 дней. Рецептурное: доза и длительность — только по назначению врача.", "ind": "• Лечение гриппа у взрослых и детей старше 1 года\n• Профилактика гриппа после контакта с больным и в период эпидемии у взрослых, подростков и детей старше 1 года Противовирусное средство против гриппа A и B. В организме превращается в активный метаболит, который блокирует фермент вируса нейраминидазу — новые вирусные частицы не могут выйти из заражённых клеток, и инфекция не распространяется. При начале лечения в первые 40 часов болезнь короче примерно на 1,5 суток, снижается риск осложнений. Не заменяет вакцинацию и не мешает ей; защищает только во время приёма.", "u": "med/tamiflu-75-mg.html"}, {"ru": "Осельтамивир-Акрихин 75 мг", "en": "Oseltamivir 75 mg", "fi": "Oseltamiviiri 75 mg", "x": "противовирусное от гриппа — по назначению врача", "x_en": "flu antiviral — as prescribed", "x_fi": "influenssalääke — lääkärin ohjeen mukaan", "d": "То же, что Тамифлю (осельтамивир). Вместе с Тамифлю не принимать. Рецептурное: доза и длительность — только по назначению врача.", "ind": "• Лечение гриппа у взрослых и детей старше 1 года.\n• Профилактика гриппа у взрослых и подростков старше 12 лет из групп риска (воинские части, крупные коллективы, ослабленные больные).\n• Профилактика гриппа у детей старше 1 года.\nНа другие ОРВИ (не грипп) не действует и вакцинацию не заменяет. Противовирусное средство против гриппа. В организме превращается в активный метаболит, который блокирует фермент нейраминидазу вирусов гриппа A и B и мешает вирусу распространяться. Не мешает выработке иммунитета, в т.ч. после вакцинации.", "u": "med/oseltamivir-75-mg.html"}, {"ru": "Амиксин 125 мг", "en": "Amixin 125 mg", "fi": "Amiksin 125 mg", "x": "противовирусное, иммуномодулятор", "x_en": "antiviral, immune support", "x_fi": "viruslääke", "d": "Тилорон — противовирусное и иммуномодулирующее средство при гриппе и ОРВИ. Схема приёма — по инструкции (обычно 1 таблетка в первые 2 дня, затем через день).", "ind": "Взрослым в составе комплексной терапии:\n• лечение гриппа и других ОРВИ;\n• профилактика гриппа и ОРВИ;\n• лечение герпетической инфекции. Индуктор интерферонов: стимулирует организм вырабатывать собственные интерфероны (альфа, бета, гамма, лямбда), максимум через 4–24 ч. Подавляет размножение вирусов в заражённых клетках, оказывает иммуномодулирующее действие. Период полувыведения около 48 ч, выводится в основном с калом.", "u": "med/amixin-125-mg.html"}, {"ru": "Burana 40 мг/мл, сироп", "en": "Burana 40 mg/ml oral suspension", "fi": "Burana 40 mg/ml oraalisuspensio", "x": "ибупрофен жидкий, детский; взбалтывать", "x_en": "liquid ibuprofen; shake well", "x_fi": "ibuprofeeni; ravista", "d": "Ибупрофен 40 мг в 1 мл, клубничная суспензия (детская форма, подходит и взрослым, кто не глотает таблетки). Взбалтывать. Доза по весу — по шприцу-дозатору в инструкции. Интервал не меньше 6 часов.", "ind": "• Дети до 12 лет: лёгкая и умеренная боль (мышечная, головная, зубная, при прорезывании зубов), лихорадка, в т.ч. после прививки.\n• Взрослые и дети старше 12 лет: также боль в спине, мигрень, невралгия, симптомы нетяжёлых воспалительных заболеваний суставов. Нестероидный противовоспалительный препарат (НПВП): уменьшает боль, снижает температуру, оказывает противовоспалительное действие.", "u": "med/burana-40-mg-ml-oral-suspension.html"}, {"ru": "Септолете тотал", "en": "Septolete total lozenges", "fi": "Septolete total -imeskelytabletit", "x": "рассасывать при боли в горле", "x_en": "lozenges for sore throat", "x_fi": "kurkkukipuun", "d": "Пастилки от боли в горле (бензидамин + цетилпиридиний). Рассасывать по 1 пастилке каждые 3–6 часов, не более 3 в сутки.", "ind": "Симптоматическое лечение воспалительных и инфекционных заболеваний горла и полости рта: боль в горле при фарингите, ларингите, тонзиллите; гингивит, стоматит; состояния до и после удаления зуба. Бензидамин — местное нестероидное противовоспалительное средство: уменьшает боль, отёк и покраснение, обладает лёгким обезболивающим (анестезирующим) действием. Цетилпиридиний — антисептик широкого спектра: действует на бактерии (особенно грамположительные), грибки и некоторые вирусы. В кровь всасывается лишь ничтожное количество бензидамина.", "u": "med/septolete-total-lozenges.html"}, {"ru": "АЦЦ лонг 600", "en": "ACC long 600 (acetylcysteine)", "fi": "ACC long 600 (asetyylikysteiini)", "x": "разжижает мокроту, шипучая", "x_en": "thins mucus, effervescent", "x_fi": "limaa irrottava poretabletti", "d": "Ацетилцистеин — разжижает густую мокроту при кашле. 1 шипучая таблетка в стакане воды 1 раз в день, лучше утром. Не принимать на ночь и вместе со средствами, подавляющими кашель.", "ind": "Заболевания, сопровождающиеся образованием вязкой, трудноотделяемой мокроты: • острый и хронический бронхит, обструктивный бронхит, трахеит, ларинготрахеит; • пневмония, абсцесс лёгкого, бронхоэктазы, бронхиолит, ХОБЛ, бронхиальная астма; • муковисцидоз; • острый и хронический синусит, средний отит. Муколитик: разрывает связи в молекулах мокроты, делая её менее вязкой и облегчая откашливание; действует и при гнойной мокроте. Обладает антиоксидантным действием и поддерживает синтез глутатиона. При длительном приёме уменьшает частоту и тяжесть обострений хронического бронхита и муковисцидоза.", "u": "med/acc-long-600.html"}, {"ru": "Флуимуцил 600", "en": "Fluimucil 600", "fi": "Fluimucil 600", "x": "разжижает мокроту", "x_en": "thins mucus", "x_fi": "limaa irrottava", "d": "Ацетилцистеин, как АЦЦ. 1 шипучая таблетка 1 раз в день. Вместе с АЦЦ/Mucomyst не принимать.", "ind": "• Заболевания дыхательных путей с густой, трудно отделяемой мокротой: бронхит, трахеит, бронхиолит, пневмония, бронхоэктазы, муковисцидоз, эмфизема, ларинготрахеит\n• Синусит, гайморит, отит — для облегчения отхождения секрета\n• Удаление вязкого секрета после травм и операций Муколитик: разрывает связи в молекулах слизи, разжижает мокроту и облегчает её откашливание (в т.ч. гнойную). Уменьшает прилипание бактерий к слизистой бронхов. Обладает антиоксидантным действием (поддерживает синтез глутатиона) — поэтому используется и как противоядие при отравлении парацетамолом.", "u": "med/fluimucil-600.html"}, {"ru": "Mucomyst 200 мг", "en": "Mucomyst 200 mg", "fi": "Mucomyst 200 mg", "x": "разжижает мокроту", "x_en": "thins mucus", "x_fi": "limaa irrottava", "d": "Ацетилцистеин 200 мг (Финляндия), шипучие. Обычно 1 таблетка 3 раза в день. Не вместе с АЦЦ/Флуимуцилом.", "ind": "Разжижение густой мокроты при заболеваниях дыхательных путей (бронхит, простуда с вязкой мокротой и т.п.). Муколитик: разжижает густую, вязкую мокроту в дыхательных путях и облегчает её откашливание.", "u": "med/mucomyst-200-mg.html"}, {"ru": "Лазолван", "en": "Lasolvan (ambroxol)", "fi": "Lasolvan (ambroksoli)", "x": "от кашля с мокротой", "x_en": "wet cough", "x_fi": "limaiseen yskään", "d": "Амброксол — при влажном кашле, помогает отхождению мокроты. Дозировка — по инструкции на упаковке (сироп/таблетки/раствор).", "ind": "Острые и хронические заболевания бронхов и лёгких с вязкой мокротой: острый и хронический бронхит, пневмония, ХОБЛ, бронхиальная астма с трудноотделяемой мокротой, бронхоэктатическая болезнь. Муколитик и отхаркивающее: разжижает мокроту, усиливает выработку сурфактанта в лёгких и работу ресничек бронхов, поэтому мокрота легче откашливается. Период полувыведения около 10 ч.", "u": "med/lasolvan.html"}, {"ru": "Сальбутамол, ингалятор", "en": "Salbutamol inhaler", "fi": "Salbutamoli-inhalaattori", "x": "при одышке, приступе", "x_en": "for breathlessness", "x_fi": "hengenahdistukseen", "d": "Быстро расширяет бронхи — при приступе одышки, свистящем дыхании. 1–2 вдоха, эффект через несколько минут. Если нужен чаще 3–4 раз в день — к врачу.", "ind": "Профилактика и купирование бронхоспазма при бронхиальной астме, ХОБЛ, хроническом бронхите, эмфиземе лёгких. Селективный β2-адреномиметик короткого действия: расслабляет мускулатуру бронхов, снимает и предупреждает бронхоспазм. Действие начинается примерно через 5 минут и длится 4–6 часов.", "u": "med/salbutamol-inhaler.html"}, {"ru": "Симбикорт 160/4,5", "en": "Symbicort 160/4.5", "fi": "Symbicort 160/4,5", "x": "ингалятор — по назначению врача", "x_en": "inhaler — as prescribed", "x_fi": "inhalaattori — lääkärin ohjeen mukaan", "d": "Будесонид + формотерол — ингалятор для постоянного лечения астмы/ХОБЛ. После вдоха прополоскать рот. Рецептурное: доза и длительность — только по назначению врача.", "ind": "• Бронхиальная астма, когда показано лечение ингаляционными гормонами (не как самое первое лечение).\n• Хроническая обструктивная болезнь лёгких (ХОБЛ) у взрослых с выраженным нарушением дыхания и обострениями, несмотря на регулярные бронхорасширяющие средства. Будесонид — ингаляционный гормон (кортикостероид): уменьшает воспаление и отёк слизистой бронхов, их гиперчувствительность. Формотерол — бронхорасширяющее средство (бета2-агонист): расслабляет бронхи уже через 1–3 минуты, действие длится не менее 12 часов. Вместе они дополняют друг друга и снижают число обострений астмы.", "u": "med/symbicort-160-4-5.html"}, {"ru": "Монтелукаст 10 мг", "en": "Montelukast 10 mg", "fi": "Montelukasti 10 mg", "x": "астма, аллергия — по назначению врача", "x_en": "asthma, allergy — as prescribed", "x_fi": "astma, allergia — lääkärin ohjeen mukaan", "d": "При астме и аллергическом насморке. 1 таблетка 1 раз в день вечером. Рецептурное: доза и длительность — только по назначению врача.", "ind": "• Профилактика и длительное лечение бронхиальной астмы (дневные и ночные симптомы) у взрослых и детей старше 15 лет, в т.ч. при непереносимости аспирина. • Предупреждение бронхоспазма, вызванного физической нагрузкой. • Сезонный и круглогодичный аллергический ринит. Блокирует рецепторы цистеиниловых лейкотриенов (CysLT1) — веществ, вызывающих воспаление, отёк и спазм бронхов при астме и аллергическом рините. Расширение бронхов наступает в течение 2 часов, лечебный эффект развивается в первые сутки. Доза выше 10 мг в сутки эффективность не повышает.", "u": "med/montelukast-10-mg.html"}, {"ru": "Арбидол", "en": "Arbidol (umifenovir)", "fi": "Arbidol (umifenoviiri)", "x": "противовирусное от гриппа", "x_en": "flu antiviral", "x_fi": "influenssalääke", "d": "Умифеновир — противовирусное при гриппе и ОРВИ. Обычно 200 мг 4 раза в день 5 дней (смотреть дозировку на упаковке).", "ind": "• Профилактика и лечение гриппа A и B и других ОРВИ у взрослых и детей от 6 лет\n• В комплексной терапии рецидивирующего герпеса\n• Профилактика послеоперационных инфекционных осложнений\n• Ротавирусная кишечная инфекция у детей старше 6 лет (в комплексе) Противовирусное средство: мешает вирусу гриппа слиться с клеткой (ингибитор фузии). Активен против гриппа A и B и ряда других респираторных вирусов. Умеренно стимулирует иммунитет и выработку интерферона. Сокращает длительность и тяжесть симптомов гриппа и ОРВИ, снижает частоту осложнений.", "u": "med/arbidol.html"}, {"ru": "Сингуляр (монтелукаст)", "en": "Singulair (montelukast)", "fi": "Singulair (montelukasti)", "x": "астма, аллергия — по назначению врача", "x_en": "asthma, allergy — as prescribed", "x_fi": "astma, allergia — lääkärin ohjeen mukaan", "d": "То же, что Монтелукаст. Вместе с ним не принимать. Рецептурное: доза и длительность — только по назначению врача.", "ind": "• Профилактика и длительное лечение бронхиальной астмы (дневные и ночные симптомы, «аспириновая» астма, бронхоспазм при физической нагрузке) у взрослых и подростков с 15 лет.\n• Облегчение дневных и ночных симптомов сезонного и круглогодичного аллергического ринита. Блокирует рецепторы лейкотриенов (CysLT1) — веществ, вызывающих спазм бронхов, отёк и выделение слизи при астме и аллергическом рините. Расширяет бронхи в течение 2 ч после приёма, дополняет действие ингаляторов-бронходилататоров. Доза больше 10 мг в сутки эффекта не усиливает.", "u": "med/singulair.html"}, {"ru": "Пульмикорт 0,5 мг/мл, небулы 2 мл", "en": "Pulmicort 0.5 mg/ml nebules 2 ml", "fi": "Pulmicort 0,5 mg/ml sumutinliuos 2 ml", "x": "ингаляции через небулайзер — по назначению врача", "x_en": "nebulizer — as prescribed", "x_fi": "sumutin — lääkärin ohjeen mukaan", "d": "Будесонид — гормон для ингаляций через небулайзер (бронхит, астма, ложный круп). Открытую небулу использовать в течение 12 часов. После ингаляции прополоскать рот. Рецептурное: доза и длительность — только по назначению врача.", "ind": "• Бронхиальная астма, требующая постоянной гормональной терапии.\n• ХОБЛ.\n• Ложный круп (стенозирующий ларинготрахеит) у детей. Ингаляционный гормон (глюкокортикостероид) местного действия: снимает воспаление и отёк в бронхах, уменьшает выработку слизи и гиперреактивность. Действует профилактически: эффект через несколько часов, максимум через 1–2 недели. Острый приступ астмы НЕ снимает.", "u": "med/pulmicort-0-5-mg-ml-nebules-2-ml.html"}, {"ru": "Беродуал, раствор для ингаляций 20 мл", "en": "Berodual inhalation solution 20 ml", "fi": "Berodual-inhalaatioliuos 20 ml", "x": "при одышке, через небулайзер — по назначению врача", "x_en": "breathlessness, nebulizer — as prescribed", "x_fi": "hengenahdistus, sumutin — lääkärin ohjeen mukaan", "d": "Ипратропия бромид + фенотерол — расширяет бронхи, при одышке и бронхоспазме. Нужное число капель разводят физраствором до 3–4 мл и дышат через небулайзер. Рецептурное: доза и длительность — только по назначению врача.", "ind": "Профилактика и лечение удушья при хронических обструктивных заболеваниях дыхательных путей с обратимым бронхоспазмом: бронхиальная астма, ХОБЛ, хронический обструктивный бронхит с эмфиземой или без. Комбинированный бронхорасширяющий препарат: фенотерол (β2-адреномиметик) быстро снимает спазм бронхов, ипратропий (холинолитик) усиливает и продлевает эффект. Улучшение дыхания — в течение ~15 мин, максимум через 1–2 ч, действие до 6 ч.", "u": "med/berodual-inhalation-solution-20-ml.html"}, {"ru": "Натрия хлорид 0,9%, ампулы 5 мл", "en": "Sodium chloride 0.9% ampoules 5 ml", "fi": "Natriumkloridi 0,9 % ampullit 5 ml", "x": "для ингаляций через небулайзер и разведения уколов", "x_en": "for nebulizer & diluting injections", "x_fi": "sumuttimeen ja injektioiden laimennukseen", "d": "Физраствор. Для разведения лекарств в небулайзере (Беродуал, Пульмикорт) и для уколов; можно промывать нос и глаза.", "ind": "Только для растворения и разведения лекарств перед введением (например, порошков антибиотиков в флаконах). Также в быту часто используется для промывания носа или для ингаляций через небулайзер, но это не указано в инструкции к ампулам-растворителю. Раствор 0,9% изотоничен плазме крови (имеет ту же концентрацию солей), поэтому не повреждает ткани и клетки крови. Собственного лечебного действия в таком малом объёме не оказывает; выводится почками.", "u": "med/sodium-chloride-0-9-ampoules-5-ml.html"}]}, {"code": "009-1", "title": "Запас сверху", "title_en": "Spare stock on top", "title_fi": "Varasto päällä", "zone": "Дом", "room": "Кухня", "room_en": "Kitchen", "room_fi": "Keittiö", "cab": "Аптека", "where": "Аптечка 009 «Постоянный приём», лоток сверху (запас)", "where_en": "Medicine organizer 009 “Daily medicines”, top tray (spare stock)", "items": [{"ru": "Мерифатин 850 мг (метформин), большая упаковка", "en": "Merifatin 850 mg (metformin), large pack", "fi": "Merifatin 850 mg (metformiini), iso pakkaus", "x": "от сахара, как Глюкофаж — по назначению врача", "x_en": "blood sugar, same as Glucophage — as prescribed", "x_fi": "verensokeri — lääkärin ohjeen mukaan", "d": "Метформин 850 мг (обычный, не пролонгированный) — то же, что Глюкофаж. Запас. Вместе с Глюкофажем не дублировать. Рецептурное: доза и длительность — только по назначению врача.", "ind": "• Саха "spare; current pack in drawer 009-10", "x_fi": "vara; käytössä laatikossa 009-10", "d": "Метопролол — снижает пульс и давление, при стенокардии и аритмии. Не отменять резко. Рецептурное: доза и длительность — только по назначению врача. Запас — в ходу пачка в ящике 009-10.", "ind": "• Артериальная гипертония.\n• Стенокардия.\n• Хроническая сердечная недостаточность со сниженной функцией левого желудочка (в дополнение к основной терапии).\n• Снижение риска смерти и повторного инфаркта после инфаркта миокарда.\n• Нарушения ритма: наджелудочковая тахикардия, урежение пульса при мерцательной аритмии, желудочковые экстрасистолы.\n• Функциональные нарушения работы сердца с тахикардией.\n• Профилактика приступов мигрени. Селективный бета1-адреноблокатор: защищает сердце от действия адреналина, урежает пульс, снижает силу сокращений и артериальное давление. Благодаря форме замедленного высвобождения концентрация в крови равномерна и эффект держится более 24 ч при приёме 1 раз в сутки.", "u": "med/betaloc-zok-50-mg.html"}]}, {"code": "009-7", "title": "Витамины и Панангин", "title_en": "Vitamins & Panangin", "title_fi": "Vitamiinit ja Panangin", "zone": "Дом", "room": "Кухня", "room_en": "Kitchen", "room_fi": "Keittiö", "cab": "Аптека", "where": "Аптечка 009 «Постоянный приём», ящик широкий", "where_en": "Medicine organizer 009 “Daily medicines”, wide drawer", "items": [{"ru": "Витамин C 2000 мг Эвалар", "en": "Vitamin C 2000 mg (Evalar)", "fi": "C-vitamiini 2000 mg (Evalar)", "x": "шипучие", "x_en": "effervescent", "x_fi": "poretabletit", "d": "Шипучие таблетки, витамин C 2000 мг. 1 таблетка в день, растворить в воде. Высокая доза — курсами при простуде.", "ind": " ", "u": "https://www.google.com/search?q=%D0%92%D0%B8%D1%82%D0%B0%D0%BC%D0%B8%D0%BD%20C%202000%20%D0%BC%D0%B3%20%D0%AD%D0%B2%D0%B0%D0%BB%D0%B0%D1%80%20%D0%B8%D0%BD%D1%81%D1%82%D1%80%D1%83%D0%BA%D1%86%D0%B8%D1%8F%20%D0%BF%D0%BE%20%D0%BF%D1%80%D0%B8%D0%BC%D0%B5%D0%BD%D0%B5%D0%BD%D0%B8%D1%8E"}, {"ru": "Friggs C-vitamiini", "en": "Friggs vitamin C", "fi": "Friggs C-vitamiini", "x": "шипучие", "x_en": "effervescent", "x_fi": "poretabletit", "d": "Шипучий витамин C (Финляндия). 1 таблетка в день.", "ind": "Дополнительный источник витамина C в рационе. Витамин C участвует в работе иммунной системы, образовании коллагена, защите клеток от окислительного стресса и улучшает усвоение железа.", "u": "med/friggs-vitamin-c.html"}, {"ru": "Витамин C 500 мг", "en": "Vitamin C 500 mg", "fi": "C-vitamiini 500 mg", "d": "Витамин C 500 мг, 90 таблеток. 1 таблетка в день.", "ind": "• Профилактика и лечение дефицита витамина C.\n• Повышенная потребность: период роста, беременность и кормление грудью (в соответствующих дозах), большие физические и умственные нагрузки, восстановление после болезней, простуды и ОРВИ (вспомогательно), зимний сезон. Витамин C организм сам не вырабатывает. Он нужен для образования коллагена (кожа, сосуды, кости, зубы, заживление ран), участвует в окислительно-восстановительных реакциях и обмене веществ, работает как антиоксидант, поддерживает иммунитет и улучшает всасывание железа из пищи. Избыток (обычно свыше 200 мг/сут) выводится с мочой.", "u": "med/vitamin-c-500-mg.html"}, {"ru": "Vitamiini (зелёная упаковка)", "en": "Vitamin pack (green)", "fi": "Vitamiini (vihreä pakkaus)", "d": "Витаминный комплекс (финский). Принимать по инструкции на упаковке.", "ind": " ", "u": "https://www.google.com/search?q=Vitamin%20pack%20pakkausseloste"}, {"ru": "Cardiosan", "en": "Cardiosan", "fi": "Cardiosan", "x": "фолат, B6, B12, магний — для сердца", "x_en": "folate, B6, B12, magnesium", "x_fi": "folaatti, B6, B12, magnesium", "d": "Метилфолат + B6, B12, магний — для сердца, снижает гомоцистеин. 1 таблетка в день.", "ind": " ", "u": "https://www.google.com/search?q=Cardiosan%20pakkausseloste"}, {"ru": "Панангин", "en": "Panangin", "fi": "Panangin", "x": "калий + магний для сердца", "x_en": "potassium + magnesium", "x_fi": "kalium + magnesium", "d": "Калий + магний (аспарагинаты) ная утомляемость, боли и спазмы в мышцах, покалывание в мышцах. Если через месяц приёма симптомы не уменьшились, продолжать не следует. Магний нужен для передачи нервных импульсов, сокращения мышц и многих процессов в клетках; витамин B6 улучшает всасывание магния и его проникновение в клетки.", "u": "med/magnesium-b6-forte.html"}, {"ru": "Вита-энержик (витамины группы B)", "en": "Vitamin B complex", "fi": "B-vitamiinikompleksi", "d": "Комплекс витаминов группы B — для нервной системы и энергии. 1 таблетка в день.", "ind": " ", "u": "https://www.google.com/search?q=%D0%92%D0%B8%D1%82%D0%B0-%D1%8D%D0%BD%D0%B5%D1%80%D0%B6%D0%B8%D0%BA%20%28%D0%B2%D0%B8%D1%82%D0%B0%D0%BC%D0%B8%D0%BD%D1%8B%20%D0%B3%D1%80%D1%83%D0%BF%D0%BF%D1%8B%20B%29%20%D0%B8%D0%BD%D1%81%D1%82%D1%80%D1%83%D0%BA%D1%86%D0%B8%D1%8F%20%D0%BF%D0%BE%20%D0%BF%D1%80%D0%B8%D0%BC%D0%B5%D0%BD%D0%B5%D0%BD%D0%B8%D1%8E"}, {"ru": "Дигидрокверцетин", "en": "Dihydroquercetin", "fi": "Dihydrokversetiini", "x": "антиоксидант, БАД", "x_en": "antioxidant supplement", "x_fi": "antioksidantti", "d": "Антиоксидант растительного происхождения (БАД) — для сосудов. 1–2 таблетки в день во время еды.", "ind": "В качестве дополнительного источника дигидрокверцетина (флавоноида) в рационе. Дигидрокверцетин (таксифолин) — растительный флавоноид из лиственницы, природный антиоксидант и капилляропротектор (укрепляет стенки мелких сосудов). По данным производителя, помогает поддерживать нормальную вязкость крови, сердечный ритм, артериальное давление и уровень холестерина, а также функцию лёгких и бронхов.", "u": "med/dihydroquercetin.html"}, {"ru": "Калеорид (Kaleorid, калий)", "en": "Kaleorid (potassium chloride)", "fi": "Kaleorid (kaliumkloridi)", "x": "калий — по назначению врача", "x_en": "potassium — as prescribed", "x_fi": "kalium — lääkärin ohjeen mukaan", "d": "Калия хлорид — при нехватке калия (часто при мочегонных). Таблетки глотать целиком, после еды, запивая водой. Рецептурное: доза и длительность — только по назначению врача.", "ind": "• Лечение пониженного уровня калия в крови (гипокалиемии)\n• Профилактика дефицита калия при приёме мочегонных средств Восполняет калий. Калий медленно высвобождается из таблетки в кишечнике; инертная основа таблетки выходит с калом (её можно увидеть в стуле — это нормально).", "u": "med/kaleorid.html"}]}, {"code": "009-8", "title": "Нервы и сон", "title_en": "Nerves & sleep", "title_fi": "Hermot ja uni", "zone": "Дом", "room": "Кухня", "room_en": "Kitchen", "room_fi": "Keittiö", "cab": "Аптека", "where": "Аптечка 009 «Постоянный приём», ящик малый верхний", "where_en": "Medicine organizer 009 “Daily medicines”, small drawer, top", "items": [{"ru": "Мильгамма композитум", "en": "Milgamma compositum", "fi": "Milgamma compositum", "x": "витамины B1 + B6", "x_en": "vitamins B1 + B6", "x_fi": "B1- ja B6-vitamiinit", "d": "Витамины B1 (бенфотиамин) + B6 — при болях в нервах, онемении, полинейропатии. Обычно 1 таблетка 1–3 раза в день.", "ind": "Неврологические заболевания при подтверждённом дефиците витаминов B1 и B6: невриты и невралгии, полинейропатии (в т.ч. диабетическая и алкогольная), поражения нервных корешков и сплетений, радикулопатия, ишиас, люмбаго, остеохондроз позвоночника с неврологическими проявлениями. Комбинация витаминов группы B для нервной системы. Бенфотиамин всасывается лучше обычного тиамина и превращается в коферменты, участвующие в обмене глюкозы в нервных клетках. Пиридоксин участвует в обмене аминокислот и образовании нейромедиаторов (серотонин, дофамин, адреналин).", "u": "med/milgamma-compositum.html"}, {"ru": "Берлитион 300", "en": "Berlithion 300 (thioctic acid)", "fi": "Berlithion 300 (tioktaanihappo)", "x": "по назначению врача", "x_en": "as prescribed", "x_fi": "lääkärin ohjeen mukaan", "d": "Тиоктовая (альфа-липоевая) кислота — при диабетической и алкогольной нейропатии. Утром натощак за 30 минут до завтрака. Рецептурное: доза и длительность — только по назначению врача.", "ind": "• Диабетическая полинейропатия.\n• Алкоголь
