ительность — только по назначению врача.", "ind": "• Пероральная контрацепция\n• Лечение обильных и/или длительных менструальных кровотечений без органической причины у женщин, желающих применять оральную контрацепцию Подавляет овуляцию, сгущает слизь шейки матки (затрудняет прохождение сперматозоидов) и изменяет эндометрий. Эстрадиола валерат превращается в натуральный эстрадиол; диеногест — прогестаген со слабым антиандрогенным действием. Уменьшает объём менструальной кровопотери. Индекс Перля < 1 при правильном приёме.", "u": "med/qlaira.html", "d_en": "Hormonal medicine (estradiol + dienogest). Take strictly in the order of the tablets in the blister. Prescription-only: dose and duration only as prescribed by a doctor.", "d_fi": "Hormonivalmiste (estradioli + dienogesti). Ota tabletit tarkasti läpipainopakkauksen järjestyksessä. Reseptilääke: annos ja hoidon kesto vain lääkärin määräyksen mukaan."}, {"ru": "Торасемид 20 мг", "en": "Torasemide 20 mg", "fi": "Torasemidi 20 mg", "x": "по назначению врача", "x_en": "as prescribed", "x_fi": "lääkärin ohjeen mukaan", "d": "Мочегонное, более высокая дозировка, чем 5 мг. Не путать дозировки! Рецептурное: доза и длительность — только по назначению врача.", "ind": "• Отёки различного происхождения: при хронической сердечной недостаточности, заболеваниях печени, лёгких и почек. • Артериальная гипертензия. Мочегонное средство: в петле Генле почек блокирует обратное всасывание натрия, хлора и воды, увеличивая выведение мочи и уменьшая отёки. Снижает артериальное давление. По сравнению с фуросемидом действует дольше (до 18 часов) и меньше выводит калий. Максимальная концентрация — через 1–2 часа, период полувыведения 3–4 часа.", "u": "med/torasemide-20-mg.html", "d_en": "Diuretic, a higher strength than 5 mg. Do not mix up the strengths! Prescription-only: dose and duration only as prescribed by a doctor.", "d_fi": "Nesteenpoistolääke, suurempi vahvuus kuin 5 mg. Älä sekoita vahvuuksia! Reseptilääke: annos ja hoidon kesto vain lääkärin määräyksen mukaan."}], "where_fi": "Lääkekaappi 009 ”Säännöllinen lääkitys”, pieni alalaatikko"}, {"code": "009-10", "title": "Давление, сердце, вены", "title_en": "Blood pressure, heart & veins", "title_fi": "Verenpaine, sydän, laskimot", "zone": "Дом", "room": "Кухня", "room_en": "Kitchen", "room_fi": "Keittiö", "cab": "Аптека", "where": "Аптечка 009 «Постоянный приём», ящик высокий", "where_en": "Medicine organizer 009 “Daily medicines”, tall drawer", "items": [{"ru": "Вальсакор 160 мг", "en": "Valsacor 160 mg (valsartan)", "fi": "Valsacor 160 mg (valsartaani)", "x": "по назначению врача", "x_en": "as prescribed", "x_fi": "lääkärin ohjeen mukaan", "d": "Валсартан — от повышенного давления, при сердечной недостаточности. Принимать каждый день в одно время. Рецептурное: доза и длительность — только по назначению врача.", "ind": "• Артериальная гипертензия (взрослые и дети 6–18 лет)\n• Хроническая сердечная недостаточность (II–IV ФК) — у пациентов, не принимающих ингибиторы АПФ\n• После острого инфаркта миокарда с сердечной недостаточностью или снижением функции левого желудочка Блокатор рецепторов ангиотензина II (сартан): мешает гормону ангиотензину сужать сосуды, поэтому давление снижается. Эффект начинается через ~2 часа, максимум — через 4–6 часов, держится около суток; полный эффект при регулярном приёме — через 2–4 недели. Резкая отмена не вызывает скачка давления. В отличие от ингибиторов АПФ, обычно не вызывает сухого кашля.", "u": "med/valsacor-160-mg.html", "d_en": "Valsartan — for high blood pressure, in heart failure. Take every day at the same time. Prescription-only: dose and duration only as prescribed by a doctor.", "d_fi": "Valsartaani — kohonneeseen verenpaineeseen ja sydämen vajaatoimintaan. Ota joka päivä samaan aikaan. Reseptilääke: annos ja hoidon kesto vain lääkärin määräyksen mukaan."}, {"ru": "Вальсакор Н 160/12,5", "en": "Valsacor H 160/12.5", "fi": "Valsacor H 160/12,5", "x": "по назначению врача", "x_en": "as prescribed", "x_fi": "lääkärin ohjeen mukaan", "d": "Валсартан + гидрохлоротиазид (мочегонное) — от давления. Не одновременно с обычным Вальсакором, если врач не сказал. Рецептурное: доза и длительность — только по назначению врача.", "ind": "Артериальная гипертония у пациентов, которым нужна комбинированная терапия (когда одного препарата недостаточно). Комбинация двух средств от давления.\n• Валсартан блокирует рецепторы ангиотензина II (АТ1) и расширяет сосуды; эффект начинается через 2 ч, максимален через 4–6 ч и длится 24 ч.\n• Гидрохлоротиазид — мочегонное: выводит натрий и воду, уменьшая объём крови.\nВалсартан частично компенсирует потерю калия от диуретика. Полный эффект на давление — через 2–4 недели постоянного приёма.", "u": "med/valsacor-h-160-12-5.html", "d_en": "Valsartan + hydrochlorothiazide (diuretic) — for blood pressure. Not at the same time as regular Valsacor unless a doctor said so. Prescription-only: dose and duration only as prescribed by a doctor.", "d_fi": "Valsartaani + hydroklooritiatsidi (nesteenpoistolääke) — verenpaineeseen. Ei samanaikaisesti tavallisen Valsacorin kanssa, ellei lääkäri ole niin määrännyt. Reseptilääke: annos ja hoidon kesto vain lääkärin määräyksen mukaan."}, {"ru": "Вальсакор Инда", "en": "Valsacor Inda (valsartan + indapamide)", "fi": "Valsacor Inda", "x": "по назначению врача", "x_en": "as prescribed", "x_fi": "lääkärin ohjeen mukaan", "d": "Валсартан + индапамид — от давления (таблетки с модифицированным высвобождением, не делить). Рецептурное: доза и длительность — только по назначению врача.", "ind": "Первичная (эссенциальная) артериальная гипертензия у взрослых, которым подходят эти два вещества в данных дозах. Комбинация двух препаратов от давления: валсартан блокирует рецепторы ангиотензина II и расслабляет сосуды; индапамид — мягкий мочегонный, который также снижает жёсткость артерий и сопротивление сосудов.", "u": "med/valsacor-inda.html", "d_en": "Valsartan + indapamide — for blood pressure (modified-release tablets, do not split). Prescription-only: dose and duration only as prescribed by a doctor.", "d_fi": "Valsartaani + indapamidi — verenpaineeseen (säädellysti vapauttavat tabletit, ei saa puolittaa). Reseptilääke: annos ja hoidon kesto vain lääkärin määräyksen mukaan."}, {"ru": "Арифон ретард 1,5 мг", "en": "Arifon retard 1.5 mg (indapamide)", "fi": "Arifon retard 1,5 mg (indapamidi)", "x": "по назначению врача", "x_en": "as prescribed", "x_fi": "lääkärin ohjeen mukaan", "d": "Индапамид — мочегонное от давления. 1 таблетка утром, не делить. Рецептурное: доза и длительность — только по назначению врача.", "ind": "Артериальная гипертензия. Тиазидоподобный диуретик длительного действия: усиливает выведение натрия и хлора, снижает сосудистое сопротивление и повышает эластичность артерий, уменьшает гипертрофию левого желудочка. Не влияет на обмен жиров и углеводов. Период полувыведения 14–24 ч, стабильная концентрация — через 7 дней.", "u": "med/arifon-retard-1-5-mg.html", "d_en": "Indapamide — a diuretic for blood pressure. 1 tablet in the morning, do not split. Prescription-only: dose and duration only as prescribed by a doctor.", "d_fi": "Indapamidi — nesteenpoistolääke verenpaineeseen. 1 tabletti aamulla, ei saa puolittaa. Reseptilääke: annos ja hoidon kesto vain lääkärin määräyksen mukaan."}, {"ru": "Беталок ЗОК 50 мг", "en": "Betaloc ZOK 50 mg (metoprolol)", "fi": "Betaloc ZOK 50 mg (metoprololi)", "x": "по назначению врача", "x_en": "as prescribed", "x_fi": "lääkärin ohjeen mukaan", "d": "Метопролол — снижает пульс и давление, при стенокардии и аритмии. Не отменять резко. Рецептурное: доза и длительность — только по назначению врача.", "ind": "• Артериальная гипертония.\n• Стенокардия.\n• Хроническая сердечная недостаточность со сниженной функцией левого желудочка (в дополнение к основной терапии).\n• Снижение риска смерти и повторного инфаркта после инфаркта миокарда.\n• Нарушения ритма: наджелудочковая тахикардия, урежение пульса при мерцательной аритмии, желудочковые экстрасистолы.\n• Функциональные нарушения работы сердца с тахикардией.\n• Профилактика приступов мигрени. Селективный бета1-адреноблокатор: защищает сердце от действия адреналина, урежает пульс, снижает силу сокращений и артериальное давление. Благодаря форме замедленного высвобождения концентрация в крови равномерна и эффект держится более 24 ч при приёме 1 раз в сутки.", "u": "med/betaloc-zok-50-mg.html", "d_en": "Metoprolol – lowers heart rate and blood pressure, for angina and arrhythmia. Do not stop abruptly. Prescription-only: dose and duration only as prescribed by a doctor.", "d_fi": "Metoprololi – alentaa sykettä ja verenpainetta, rintakipuun (angina pectoris) ja rytmihäiriöihin. Älä lopeta äkillisesti. Reseptilääke: annos ja hoidon kesto vain lääkärin määräyksen mukaan."}, {"ru": "Дилтиазем 90 мг", "en": "Diltiazem 90 mg", "fi": "Diltiatseemi 90 mg", "x": "по назначению врача", "x_en": "as prescribed", "x_fi": "lääkärin ohjeen mukaan", "d": "Снижает давление и пульс, при стенокардии и аритмии. Таблетки пролонгированные — не разжёвывать. Рецептурное: доза и длительность — только по назначению врача.", "ind": "• Артериальная гипертензия.\n• Профилактика приступов стенокардии, в том числе вазоспастической (Принцметала).\n• Профилактика наджелудочковых аритмий (пароксизмальная тахикардия, фибрилляция и трепетание предсердий). Блокатор медленных кальциевых каналов: расширяет коронарные и периферические артерии, снижает давление, урежает пульс, замедляет проводимость в сердце (противоаритмический эффект) и уменьшает потребность сердца в кислороде — поэтому помогает при стенокардии. Полный эффект на давление развивается примерно за 2 недели; привыкания нет. Еда усиливает всасывание на 20–30%.", "u": "med/diltiazem-90-mg.html", "d_en": "Lowers blood pressure and heart rate, for angina and arrhythmia. Extended-release tablets – do not chew. Prescription-only: dose and duration only as prescribed by a doctor.", "d_fi": "Alentaa verenpainetta ja sykettä, rintakipuun (angina pectoris) ja rytmihäiriöihin. Depottabletit – ei saa pureskella. Reseptilääke: annos ja hoidon kesto vain lääkärin määräyksen mukaan."}, {"ru": "Детралекс 1000 мг", "en": "Detralex 1000 mg", "fi": "Detralex 1000 mg", "x": "для вен, от тяжести в ногах", "x_en": "for veins, heavy legs", "x_fi": "laskimoille", "d": "Диосмин + гесперидин — для вен: тяжесть и отёки ног, варикоз, геморрой. Обычно 1 таблетка в день во время еды, курсами.", "ind": "• Хроническая венозная недостаточность (варикоз) и её симптомы: боль, тяжесть, отёки, усталость ног, ночные судороги; трофические изменения кожи, венозные язвы. • Острый и хронический геморрой. Венотонизирующее и ангиопротекторное средство: уменьшает растяжимость вен и застой крови в них, снижает проницаемость и повышает прочность капилляров, улучшает лимфоотток. Оптимальный эффект — при дозе 1000 мг в сутки. Период полувыведения около 11 часов.", "u": "med/detralex-1000-mg.html", "d_en": "Diosmin + hesperidin — for the veins: heavy and swollen legs, varicose veins, haemorrhoids. Usually 1 tablet a day with a meal, in courses.", "d_fi": "Diosmiini + hesperidiini — laskimoille: jalkojen raskaus ja turvotus, suonikohjut, peräpukamat. Yleensä 1 tabletti päivässä aterian yhteydessä, kuureina."}, {"ru": "Карведилол-Тева 12,5 мг", "en": "Carvedilol-Teva 12.5 mg", "fi": "Karvediloli-Teva 12,5 mg", "x": "по назначению врача", "x_en": "as prescribed", "x_fi": "lääkärin ohjeen mukaan", "d": "Карведилол — снижает давление и пульс, при сердечной недостаточности. Принимать во время еды. Не сочетать с Беталоком без указания врача. Рецептурное: доза и длительность — только по назначению врача.", "ind": "• Артериальная гипертензия (отдельно или с другими препаратами)\n• Профилактика приступов стабильной стенокардии\n• Хроническая сердечная недостаточность II–III ФК (вместе с диуретиками, дигоксином, ингибиторами АПФ) Альфа- и бета-адреноблокатор: замедляет пульс, снижает нагрузку на сердце и расширяет сосуды, что снижает давление. При сердечной недостаточности улучшает работу левого желудочка. Максимальный эффект на давление и пульс — через 1–2 часа после приёма.", "u": "med/carvedilol-teva-12-5-mg.html", "d_en": "Carvedilol — lowers blood pressure and heart rate, in heart failure. Take with meals. Do not combine with Betaloc without a doctor's instruction. Prescription-only: dose and duration only as prescribed by a doctor.", "d_fi": "Karvediloli — alentaa verenpainetta ja sykettä, sydämen vajaatoimintaan. Ota aterian yhteydessä. Ei yhdessä Betalocin kanssa ilman lääkärin ohjetta. Reseptilääke: annos ja hoidon kesto vain lääkärin määräyksen mukaan."}, {"ru": "Тромбо АСС 50 мг", "en": "Thrombo ASS 50 mg (aspirin)", "fi": "Thrombo ASS 50 mg (asetyylisalisyylihappo)", "x": "разжижение крови — по назначению врача", "x_en": "blood thinner — as prescribed", "x_fi": "verenohennus — lääkärin ohjeen mukaan", "d": "Аспирин в малой дозе — для профилактики тромбов, инфаркта, инсульта. 1 таблетка в день после еды. Повышает кровоточивость. Рецептурное: доза и длительность — только по назначению врача.", "ind": "• Профилактика инфаркта миокарда при факторах риска (диабет, повышенный холестерин, гипертония, ожирение, курение, пожилой возраст) и профилактика повторного инфаркта.\n• Стабильная и нестабильная стенокардия.\n• Профилактика инсульта, в т.ч. после преходящих нарушений мозгового кровообращения.\n• Профилактика тромбоэмболий после операций на сосудах (шунтирование, стентирование, ангиопластика, эндартерэктомия).\n• Профилактика тромбоза глубоких вен и ТЭЛА (в т.ч. при длительной неподвижности после операций). Антиагрегант: в малых дозах необратимо блокирует фермент ЦОГ-1 в тромбоцитах, снижая образование тромбоксана и склеивание тромбоцитов, то есть уменьшает риск тромбов. Эффект после одной дозы сохраняется около 7 суток. Кишечнорастворимая оболочка уменьшает раздражение желудка.", "u": "med/thrombo-ass-50-mg.html", "d_en": "Low-dose aspirin — to prevent blood clots, heart attack and stroke. 1 tablet a day a определено", "en": "Black plastic plates with slot (several) — purpose unknown", "fi": "Mustat muovilevyt — käyttötarkoitus tuntematon", "x": "похоже на детали мебели (держатели ламелей кровати или крепления от кухни IKEA)", "x_en": "likely furniture parts", "x_fi": "todennäköisesti huonekalun osia", "d": "Не выбрасывать, пока не найдётся, от чего они. Если появится мебель без такой детали — сравнить.", "d_en": "Do not throw away until we find out what they belong to. If a piece of furniture turns up without such a part – compare.", "d_fi": "Älä heitä pois ennen kuin selviää, mihin ne kuuluvat. Jos löytyy huonekalu, josta tällainen osa puuttuu – vertaa."}, {"ru": "Крепёж IKEA в пакете, арт. 409633", "en": "IKEA fittings bag, art. 409633", "fi": "IKEA-kiinnikkeet, art. 409633", "x": "запасные детали от мебели IKEA", "x_en": "spare IKEA furniture fittings", "x_fi": "IKEA-varaosat"}], "where_fi": "Liukuovikaappi ulko-oven vieressä"}, {"code": "027", "title": "Вентиляция Vallox 110 SE", "title_en": "Vallox 110 SE ventilation unit", "title_fi": "Vallox 110 SE -ilmanvaihtokone", "zone": "Котельная", "room": "Котельная", "room_en": "Boiler room", "room_fi": "Tekninen tila", "where": "Котельная, установка под потолком; пульт на стене", "where_en": "Boiler room, unit under the ceiling; control panel on the wall", "items": [{"ru": "Приточно-вытяжная установка Vallox 110 SE (с рекуперацией тепла)", "en": "Vallox 110 SE heat-recovery ventilation unit", "fi": "Vallox 110 SE LTO-ilmanvaihtokone", "x": "под потолком котельной; автомат в щите — «IV kone»", "x_en": "under the ceiling; breaker “IV kone”", "x_fi": "katon rajassa; sulake ”IV kone”", "d": "Подаёт свежий воздух в комнаты и вытягивает из ванных/кухни, по пути нагревая приток теплом вытяжки. Работает круглосуточно — выключать нельзя (иначе сырость и плесень). Фильтры менять 2 раза в год (весной и осенью). Автомат в электрощите: левый ряд, самый верхний — «IV kone».", "doc": "man/vallox-110se.html", "u": "man/vallox-110se.html", "d_en": "Supplies fresh air to the rooms and extracts it from the bathrooms/kitchen, warming the incoming air with heat from the extract air on the way. Runs around the clock – must not be switched off (otherwise damp and mould). Replace the filters twice a year (spring and autumn). Circuit breaker in the electrical panel: left row, the very top one – “IV kone”.", "d_fi": "Tuo raitista ilmaa huoneisiin ja poistaa sitä kylpyhuoneista/keittiöstä, samalla tuloilmaa lämmitetään poistoilman lämmöllä. Toimii ympäri vuorokauden – ei saa sammuttaa (muuten kosteutta ja hometta). Suodattimet vaihdetaan 2 kertaa vuodessa (keväällä ja syksyllä). Sulake sähkökeskuksessa: vasen rivi, ylimmäinen – ”IV kone”.", "pic": "man/img/vallox-pic.png"}, {"ru": "Пульт Vallox на стене (кнопки ⏻, CO₂, %RH, нагрев °C, ▲▼ +−)", "en": "Vallox wall control panel", "fi": "Vallox-ohjauspaneeli", "x": "на экране: скорость вентилятора, температура притока, часы", "x_en": "shows fan speed, supply temp, clock", "x_fi": "puhallinnopeus, lämpötila, kello", "d": "Экран: верхняя строка — скорость вентиляции (1…8, обычно 2–3), нижняя — температура приточного воздуха (°C) и время. ▲▼ — листать меню, + / − — менять значение (например скорость). ⏻ — вкл/выкл (не выключать надолго). CO₂ и %RH — автоматическое усиление по углекислому газу и влажности (горит = включено). Значок нагрева °C — догрев приточного воздуха. При сауне/душе можно временно поднять скорость кнопкой +.\n🔥 КАМИН: перед растопкой на главном экране одновременно зажать «+» и «−» на 2 секунды — каминный режим (Takkakytkin): вытяжка останавливается на 15 минут, дом в лёгком избыточном давлении, тяга в камине лучше. На экране значок камина; через 15 минут вытяжка включится сама (тяга может ослабеть — при необходимости повторить). Если вместо этого вентиляция просто усилилась на 45 минут — в меню настроек пункт «Takka-/tehostuskytkin» стоит на «Tehostus» (усиление), переключить на «Takkakytkin».", "doc": "man/vallox-110se.html", "u": "man/vallox-110se.html", "d_en": "Display: top line – ventilation speed (1…8, usually 2–3), bottom line – supply air temperature (°C) and time. ▲▼ – scroll the menu, + / − – change a value (e.g. speed). ⏻ – on/off (do not leave off for long). CO₂ and %RH – automatic boost based on carbon dioxide and humidity (lit = on). Heating symbol °C – supply air reheating. During sauna/shower you can temporarily raise the speed with the + button.\n🔥 FIREPLACE: before lighting the fire, on the main screen press and hold “+” and “−” together for 2 seconds – fireplace mode (Takkakytkin): the extract fan stops for 15 minutes, the house is under slight overpressure, and the fireplace draws better. A fireplace symbol appears on the screen; after 15 minutes the extract fan switches back on by itself (the draught may weaken – repeat if necessary). If instead the ventilation simply boosts for 45 minutes, the settings menu item “Takka-/tehostuskytkin” is set to “Tehostus” (boost) – switch it to “Takkakytkin”.", "d_fi": "Näyttö: ylärivi – ilmanvaihdon nopeus (1…8, yleensä 2–3), alarivi – tuloilman lämpötila (°C) ja kellonaika. ▲▼ – valikon selaus, + / − – arvon muuttaminen (esim. nopeus). ⏻ – päälle/pois (ei saa olla pitkään pois päältä). CO₂ ja %RH – automaattinen tehostus hiilidioksidin ja kosteuden perusteella (palaa = päällä). Lämmityssymboli °C – tuloilman jälkilämmitys. Saunan/suihkun aikana nopeutta voi tilapäisesti nostaa +-painikkeella.\n🔥 TAKKA: ennen tulen sytyttämistä paina päänäytöllä samanaikaisesti ”+” ja ”−” 2 sekunnin ajan – takkatoiminto (Takkakytkin): poistoilmapuhallin pysähtyy 15 minuutiksi, talo on lievässä ylipaineessa ja takka vetää paremmin. Näytössä näkyy takan symboli; 15 minuutin kuluttua poisto käynnistyy itsestään (veto voi heiketä – toista tarvittaessa). Jos sen sijaan ilmanvaihto vain tehostuu 45 minuutiksi, asetusvalikon kohta ”Takka-/tehostuskytkin” on asennossa ”Tehostus” – vaihda se asentoon ”Takkakytkin”.", "pic": "man/img/vallox-pic.png"}, {"ru": "Запасные фильтры Vallox 110 SE Nr. 22, ePM1 55 %, 248×230×96 мм", "en": "Spare filters Vallox 110 SE No. 22, ePM1 55%, 248×230×96", "fi": "Vallox 110 SE varasuodattimet Nr. 22, ePM1 55 %", "x": "кассетный фильтр притока; стрелка AIRFLOW — по направлению воздуха", "x_en": "supply-air filter; mind the AIRFLOW arrow", "x_fi": "tuloilmasuodatin", "d": "Тонкий фильтр приточного воздуха (класс ePM1 55 %, бывший F7). Ставится стрелкой «AIRFLOW» по ходу воздуха. Артикул поставщика CP/00194.", "d_en": "Fine supply-air filter (class ePM1 55 %, formerly F7). Install with the “AIRFLOW” arrow pointing in the direction of the airflow. Supplier article no. CP/00194.", "d_fi": "Tuloilman hienosuodatin (luokka ePM1 55 %, entinen F7). Asennetaan niin, että ”AIRFLOW”-nuoli osoittaa ilmavirran suuntaan. Toimittajan tuotenumero CP/00194."}, {"ru": "Фильтровальное полотно (белые листы) — запас", "en": "Filter fabric sheets (spare)", "fi": "Suodatinkangas (varalla)", "x": "лежат на тепловом насосе", "x_en": "on top of the heat pump", "x_fi": "lämpöpumpun päällä", "d": "Грубые фильтры/предфильтры: вырезать по размеру старого и заменить при обслуживании.", "d_en": "Coarse filters/pre-filters: cut to the size of the old one and replace during servicing.", "d_fi": "Karkeasuodattimet/esisuodattimet: leikkaa vanhan kokoiseksi ja vaihda huollon yhteydessä."}], "where_fi": "Tekninen tila, laite katon rajassa; ohjauspaneeli seinällä"}, {"code": "028", "title": "Отопление: тепловой насос Thermia Diplomat Optimum", "title_en": "Heating: Thermia Diplomat Optimum ground-source heat pump", "title_fi": "Lämmitys: Thermia Diplomat Optimum maalämpöpumppu", "zone": "Котельная", "room": "Котельная", "room_en": "Boiler room", "room_fi": "Tekninen tila", "where": "Котельная", "where_en": "Boiler room", "items": [{"ru": "Геотермальный тепловой насос Thermia Diplomat Optimum", "en": "Thermia Diplomat Optimum ground-source heat pump", "fi": "Thermia Diplomat Optimum maalämpöpumppu", "x": "отопление дома и горячая вода; автоматы «M.L.P.» ×3", "x_en": "heating + hot water; breakers “M.L.P.” ×3", "x_fi": "lämmitys ja käyttövesi; sulakkeet M.L.P.", "d": "Берёт тепло из земли (скважина/контур) и греет тёплый пол и горячую воду. На экране: ROOM 22°C — заданная комнатная температура; HEAT PUMP OPERAT. AUTO — работает в автоматическом режиме. Кнопками на круглом джойстике меняется комнатная температура. В электрощите: левый ряд, три автомата «M.L.P.» (maalämpöpumppu).", "doc": "man/thermia-diplomat-optimum.html", "u": "man/thermia-diplomat-optimum.html", "d_en": "Takes heat from the ground (borehole/loop) and heats the underfloor heating and hot water. On the display: ROOM 22°C — set room temperature; HEAT PUMP OPERAT. AUTO — running in automatic mode. The room temperature is changed with the buttons on the round joystick. In the electrical panel: left row, three “M.L.P.” breakers (maalämpöpumppu).", "d_fi": "Ottaa lämpöä maasta (porakaivo/keruupiiri) ja lämmittää lattialämmityksen ja lämpimän käyttöveden. Näytöllä: ROOM 22°C — asetettu huonelämpötila; HEAT PUMP OPERAT. AUTO — toimii automaattitilassa. Huonelämpötilaa muutetaan pyöreän ohjainnupin painikkeilla. Sähkökeskuksessa: vasen rivi, kolme ”M.L.P.”-katkaisijaa (maalämpöpumppu).", "pic": "man/img/thermia-pic.png"}, {"ru": "Коллекторы тёплого пола (большой у насоса и малый: PH+S, WC, PESU, KHH)", "en": "Underfloor heating manifolds", "fi": "Lattialämmityksen jakotukit", "x": "красные — подача с расходомерами, синие — обратка", "x_en": "red = supply with flowmeters, blue = return", "x_fi": "punainen meno, sininen paluu", "d": "Каждый отвод — свой контур пола. Малый коллектор: PH+S — ванная и сауна, WC — туалет, PESU — моечная, KHH — постирочная. В красных колпачках — расходомеры (видно протекание), синие — регулировочные/с термоприводом. Без нужды не крутить.\n🔎 «Поплавки» в стеклянных колпачках — расходомеры (virtausmittari): поплавок показывает, сколько воды идёт по контуру (л/мин). Во время отопления поплавок приподнят; на нуле — контур закрыт (термостат комнаты закрыл или вентиль перекрыт). Регулировка: поворот красного колпачка/кольца — по часовой меньше потока (холоднее пол), против — больше. Крутить по пол-оборота и ждать сутки. Перед любой регулировкой сфотографировать положение — это настройка монтажника (балансировка). Белая головка на синем вентиле — термопривод от комнатного термостата.", "d_en": "Each outlet is a separate floor loop. Small manifold: PH+S — bathroom and sauna, WC — toilet, PESU — washroom, KHH — utility room. The red caps contain flow meters (you can see the flow), the blue ones are control valves/with a thermal actuator. Do not turn them unless necessary.\n🔎 The “floats” in the glass caps are flow meters (virtausmittari): the float shows how much water is flowing through the loop (l/min). During heating the float is raised; at zero the loop is closed (the room thermostat has closed it or the valve is shut). Adjustment: turning the red cap/ring clockwise reduces the flow (cooler floor), anticlockwise increases it. Turn half a turn at a time and wait a day. Before any adjustment, photograph the position — this is the installer's setting (balancing). The white head on the blue valve is the thermal actuator controlled by the room thermostat.", "d_fi": "Jokainen lähtö on oma lattiapiirinsä. Pieni jakotukki: PH+S — pesuhuone ja sauna, WC — wc, PESU — pesutila, KHH — kodinhoitohuone. Punaisten korkkien alla ovat virtausmittarit (virtaus näkyy), siniset ovat säätöventtiilejä/toimilaitteellisia venttiilejä. Älä käännä ilman syytä.\n🔎 Lasikupujen ”kohot” ovat virtausmittareita (virtausmittari): koho näyttää, kuinka paljon vettä piirissä virtaa (l/min). Lämmityksen aikana koho on ylhäällä; nollassa piiri on kiinni (huonetermostaatti on sulkenut sen tai venttiili on suljettu). Säätö: punaisen korkin/renkaan kääntäminen myötäpäivään pienentää virtausta (viileämpi lattia), vastapäivään suurentaa. Käännä puoli kierrosta kerrallaan ja odota vuorokausi. Valokuvaa asento ennen säätämistä — se on asentajan tekemä säätö (tasapainotus). Sinisen venttiilin valkoinen pää on huonetermostaatin ohjaama toimilaite."}, {"ru": "Канистра с жидкостью для земляного контура (UN 1987, спиртовая) и пакет запчастей", "en": "Ground-loop fluid canister (UN 1987, alcohol-based) + spare parts bag", "fi": "Keruuliuoskanisteri (UN 1987) ja varaosapussi", "x": "легковоспламеняемая — держать закрытой", "x_en": "flammable — keep closed", "x_fi": "helposti syttyvä", "d": "Незамерзающий теплоноситель для подпитки контура теплового насоса (на этикетке UN 1987 — спирты). Доливать только по инструкции/сервисом. Белый бачок над канистрой — уровневый (расширительный) бачок земляного контура.", "d_en": "Antifreeze heat-transfer fluid for topping up the heat pump circuit (label says UN 1987 – alcohols). Top up only according to the instructions/by a service technician. The white tank above the canister is the level (expansion) tank of the ground loop.", "d_fi": "Jäätymätön lämmönsiirtoneste lämpöpumpun piirin täyttöön (etiketissä UN 1987 – alkoholit). Lisää vain ohjeen mukaan/huollon toimesta. Kanisterin yläpuolella oleva valkoinen säiliö on maapiirin paisunta- eli tasaussäiliö."}, {"ru": "Расширительный бак отопления (красный) и бак горячей воды (серый)", "en": "Heating expansion vessel (red) and hot-water tank (grey)", "fi": "Paisunta-astia ja lämminvesivaraaja", "x": "", "x_en": "", "x_fi": ""}], "where_fi": "Tekninen tila"}, {"code": "029", "title": "Электрощит Ensto — какой автомат за что", "title_en": "Ensto electrical panel — breaker list", "title_fi": "Ensto-sähkökeskus — ryhmät", "zone": "Котельная", "room": "Котельная", "room_en": "Boiler room", "room_fi": "Tekninen tila", "where": "Котельная, электрощит", "where_en": "Boiler room, electrical panel", "items": [{"ru": "Щит Ensto ESBV345.36-IT, 50 А, 400 В — как пользоваться", "en": "Ensto panel ESBV345.36-IT — how to use", "fi": "Ensto-keskus — käyttö", "x": "главный рубильник «PÄÄKYTKIN» — синяя ручка внизу справа", "x_en":
