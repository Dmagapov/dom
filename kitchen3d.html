<style>
/* Layout: title, full-width 3D stage, info card */
:root{--bg:#f3f6fb;--card:#fff;--ink:#1c2740;--muted:#66718a;--blue:#2242AA;--teal:#3FA68C;--line:#dbe3ef;--tape:#f3c623;--f:"Golos Text",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#171e2e;--ink:#e8edf6;--muted:#93a0b8;--line:#28324a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#171e2e;--ink:#e8edf6;--muted:#93a0b8;--line:#28324a;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
h1{font-size:1.5rem;margin:4px 0 2px}
.sub{color:var(--muted);margin:0 0 12px;max-width:62ch;line-height:1.45}
.stage{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
#three{width:100%;height:calc(100vh - 92px);display:block;touch-action:none}
.bar{padding:10px 12px;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
.info{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:48px}
.tape{font-family:var(--mono);background:var(--tape);color:#111;padding:2px 8px;border-radius:4px;font-weight:700}
.ct{font-weight:650;margin-bottom:6px}.cl{margin:6px 0 0;padding-left:18px;max-height:42vh;overflow:auto}.cl li{margin:2px 0}.cl li.sub{list-style:none;margin-left:-18px;margin-top:8px;font-weight:600;color:#3b5a8a}.muted{opacity:.6}.mbtn{display:inline-block;margin-top:8px;padding:9px 14px;border-radius:12px;background:#1f5fbf;color:#fff;text-decoration:none;font-weight:600}
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.back,.pb{display:inline-flex;align-items:center;gap:6px;border:0;background:linear-gradient(135deg,#2242AA,#3FA68C);color:#fff;font:600 1rem var(--f);padding:9px 16px;border-radius:999px;text-decoration:none;cursor:pointer}
.pop{position:fixed;inset:0;z-index:50;background:rgba(10,16,30,.45);display:flex;align-items:flex-end;justify-content:center;padding:12px;animation:f .18s}
.pop[hidden]{display:none}
.sheet{background:var(--card);color:var(--ink);width:min(560px,100%);max-height:86vh;border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;animation:u .22s ease-out}
.sheet.wide{width:min(900px,100%);height:86vh}
.ph{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ph .x{margin-left:auto;border:0;background:none;color:var(--muted);font-size:1.6rem;line-height:1;cursor:pointer;padding:4px 8px}
#pbody{padding:14px 16px 18px;overflow:auto}
.sheet.wide #pbody{padding:0;flex:1;overflow:hidden}
#pbody iframe{width:100%;height:100%;border:0;display:block;background:#fff}
#pbody .cl{max-height:none}
#pbody .mbtn{border:0;cursor:pointer;font:600 1rem var(--f)}
@media(min-width:700px){.pop{align-items:center}}
@keyframes f{from{opacity:0}}@keyframes u{from{transform:translateY(30px);opacity:0}}
.hb{position:absolute;top:10px;left:10px;z-index:5}body.emb{padding:0}body.emb .stage{border:0;border-radius:0}body.emb #three{height:calc(100vh - 40px)}body:not(.emb) .stage{margin-top:44px}
